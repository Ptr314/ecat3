system {
    type = irisha
    name = Диалог
    version = Диалог (клон Ириши)
    charmap = koi8
}

cpu : i8080 {
    clock = 1777777
    ~int = pic.int
}

// ПЗУ 20 КБ, собрано из десяти микросхем по 2 КБ:
//   $0000       D23         монитор
//   $0800-$1FFF D30,D29,D28 редактор IRITEXT, копируется в $A100
//   $2000-$3FFF D24..D27    монитор и знакогенератор
//   $4000-$4FFF D32,D31     отладчик DDT, почти дословно оверлей Ириши
//
// Последние 4 КБ - то самое дополнительное ПЗУ, которое у Диалога включено
// вместо дополнительного ОЗУ. Видно оно в карте памяти 1 по адресу $0000:
// переносимая подпрограмма монитора ($0443, исполняется по $DF40) выбирает
// карту по старшему байту адреса источника - $4000..$7FFF означает «вычесть
// $4000 и включить карту 1». Оттуда DDT копируется в $9000.
bios : rom {
    size = 20k
    image = dialog.rom
}

exrom : rom {
    mode = stream
    size = 64k
    image = extra.rom
}

ram0 : ram {
    size = 64k
}

display : irisha-display {
    vram = ram0
    mode = port-videomode
    color = port-color
    page = port-videopage
}

port-kbd : port {}

port-videomode : port {}

port-color : port {}

port-videopage : port {}

keyboard : map-keyboard {
    map = irisha.map
    port-value = port-kbd
    ruslat = caps
    rusmode = code
    use_remap = 0
    rus_switches = $0E/$0F
}

ikbd : register {
    ~s = keyboard.ready
    ~r = port-kbd.access
}

ppa : i8255 {
    ~B[7] = ikbd.out[0]
}

// Memory configuration
// Defaults to 0 by reset to use bios rom, then just translates port values
mconf : register {
    type = buffer
    default = 0
    ~in[0-1] = ppa.CL[2-3]
}

timer : i8253 {
    clock = 1/1
    clock1 = 1/256
    ~gate[2] = ppa.A[5]
}

sound : speaker {
    ~mixer[0] = timer.output[2]     // Timer sound
    ~mixer[1] = ppa.A[4]            // "Noise effects" output
    ~input = ppa.A[7]               // Output to tape
}

pic : i8259 {
    ~ir[0] = timer.output[1]
    ~ir[1] = ikbd.out[0]
}

serial : i8251 {
    ~c = timer.output[0]
}

tape : taperecorder {
    encoding = msx
    files = "BIN files (*.bin)"
    ~input  = ppa.A[7]
    ~output = serial.dsr
    ~motor = serial.dtr
}

mapper : memory-mapper {
    portstomemory = 0
    config = mconf

    @memory[0][$0000-$3FFF] =  bios {mode = r}
    @memory[0][$4000-$7FFF] =  ram0[$4000]
    @memory[0][$8000-$BFFF] =  ram0[$8000]
    @memory[0][$C000-$FFFF] =  ram0[$0000]

    @memory[2][$0000-$3FFF] =  ram0[$C000]
    @memory[2][$4000-$7FFF] =  ram0[$4000]
    @memory[2][$8000-$BFFF] =  ram0[$8000]
    @memory[2][$C000-$FFFF] =  ram0[$0000]

    // Карта ОЗУ упрощена против оригинала: дополнительного ОЗУ (ram1) нет,
    // во всех картах одна и та же память. Это существенно: переносимая
    // подпрограмма копирования живет по $DF40 и через $DF8F передает байт
    // из карты 1 в карту 2, так что $C000-$FFFF обязано быть общим.
    @memory[1][$0000-$0FFF] =  bios[$4000] {mode = r}
    @memory[1][$0000-$3FFF] =  ram0[$C000]
    @memory[1][$4000-$7FFF] =  ram0[$4000]
    @memory[1][$8000-$BFFF] =  ram0[$8000]
    @memory[1][$C000-$FFFF] =  ram0[$0000]

    @memory[3][$0000-$3FFF] =  ram0[$C000]
    @memory[3][$4000-$7FFF] =  ram0[$4000]
    @memory[3][$8000-$BFFF] =  ram0[$8000]
    @memory[3][$C000-$FFFF] =  ram0[$0000]

    @port[$04-$05] = port-kbd
    @port[$06-$07] = serial
    @port[$08-$0B] = timer
    @port[$0C-$0F] = pic
    @port[$10-$13] = ppa
    @port[$14] = exrom
    @port[$D8] = port-videomode
    @port[$D9] = port-color
    @port[$DA] = port-videopage
}
