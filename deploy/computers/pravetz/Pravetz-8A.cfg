system {
	type = pravetz
	name = Правец
	version = Правец-8А
	charmap = koi8
	debug = 0
}

// Правец-8А: CM630 (NMOS 6502) от кварца 14250.45 кГц - PAL-вариант Apple //e,
// строка 65 тактов, 312 строк. Средний такт с учетом длинного: 14250450*65/912
cpu : 6502 {
	// Холостые циклы NMOS: чтение до переноса в индексной адресации и
	// обратная запись в командах чтение-модификация-запись (INC $C030 - три
	// обращения к динамику, LDA $C0F3,Y через страницу трогает $C083)
	dummy_reads = 1
	clock = 1015657
	stopped = 0
}

// 16 Кб ПЗУ $C000-$FFFF (CD + EF, СМ7864P 06/07), видны $C100-$FFFF
rom : rom {
	size = 16k
	image = files/pravetz-8a-rom.bin
}

// Знакогенератор 2764: две половины по 4 Кб, перемычка X20 (font_half у
// дисплея): 0 - набор Правец, 1 - набор как у Apple //e. Прошивки:
// для СССР (Ы на $5F/$7F), болгарская (там пустой прямоугольник и шашечки)
// и СП «Вариант» (утолщенные скобки, Ы и Ъ переставлены)
font : rom {
	size = 8k
	label = Знакогенератор
	image_1 = files/pravetz-8a-chr-su.bin
	title_1 = Для СССР
	image_2 = files/pravetz-8a-chr-bg.bin
	title_2 = Болгарский
	image_3 = files/pravetz-8a-chr-variant.bin
	title_3 = СП «Вариант»
	image = files/pravetz-8a-chr-su.bin
}

ram : ram {
	size = 64k
	soft_reset = 0
}

// Модуль MEGARAM в разъеме X0: 64 Кб (без него не работает ТЕКСТ80)
aux : ram {
	size = 64k
	soft_reset = 0
}

// ПЗУ P5 контроллера КНГМД 140 (4 x КР556РТ11, распутано: A5<->A7 и порядок
// разрядов старшего полубайта; совпадает с Apple 341-0027)
// Загрузчик на выбор: 16 секторов (DOS 3.3) или 13 (DOS 3.2, Apple
// 341-0009; секвенсор P6 тот же - новый читает и старые диски)
boot140 : rom {
	size = 256
	label = ПЗУ загрузчика КНГМД
	image_1 = files/fdc140-p5.bin
	title_1 = 16 секторов (DOS 3.3)
	image_2 = files/fdc140-p5-13.bin
	title_2 = 13 секторов (DOS 3.2)
	image = files/fdc140-p5.bin
}

mmu : apple2-mmu {
	model = iie
	ram = ram
	aux = aux
	rom = rom
	slot6 = boot140
}

iou : apple2-iou {
	model = iie
	pravetz = 1
	altchar_on_read = 1
	mmu = mmu
	keyboard = keyboard
	video = display
	~pb = keyboard.pb
}

// Раскладка кириллицы на одной и той же клавиатуре: ГОСТ (СССР), БДС
// (болгарский стандарт), ЯВЕРТЪ (фонетическая, как у 82 и 8М)
keyboard : pravetz-keyboard {
	map_label = Кириллица на клавиатуре
	map_1 = pravetz-8a-gost.map
	map_title_1 = ГОСТ (ЙЦУКЕН)
	map_2 = pravetz-8a-bds.map
	map_title_2 = БДС
	map_3 = pravetz-8a-yavert.map
	map_title_3 = ЯВЕРТЪ (болгарская герконовая, 65 клавиш)
	map = pravetz-8a-gost.map
	iou = iou
	use_remap = 0
}

// ПЗУ платы RGB СП «Вариант» (КР556РТ4): четыре точки сдвигового регистра
// и фаза -> цвет IRGB монитора CGA. Выбирается опцией «Видеовыход»
rgb-prom : rom {
	size = 256
	image = files/pravetz-rgb-variant.bin
}

display : apple2-video {
	standard = apple-pal
	mmu = mmu
	iou = iou
	font = font
	font_half = 0
	font_half_label = Перемычка X20
	font_half_title_0 = Набор Правец
	font_half_title_1 = Набор Apple //e
	charset = iie
	monitor = green
	rgb_rom = rgb-prom
	soft_reset = 0
}

port-sound : port-address {}

sound : speaker {
	mode = flip
	~input = port-sound.access
}

// ПЗУ P6 контроллера: секвенсор (341-0028; у Правец - РТ11 6H/6L)
p6rom : rom {
	size = 256
	image = files/fdc140-p6.bin
}

// Контроллер Disk II с секвенсором по P6: диск читается и пишется по
// битам, как его читала плата, - с настоящим временем, синхробайтами и
// защитами от копирования
fdc140 : apple2-disk2 {
	drives = fdd0|fdd1
	p6 = p6rom
	soft_reset = 0
}

fdd0 : fdd {
	title = 140K
	// Школьный диск СПТУ-20 (г. Ломоносов) с agatcomp.ru: DOS 3.3 и меню,
	// программа выбирается буквой. В software/pravetz есть и другие диски
	image = sptu20.dsk
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.woz *.d13 *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 0
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

fdd1 : fdd {
	title = 140K
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.woz *.d13 *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 1
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[$0000-$BFFF] = mmu
	@memory[$C000-$C02F] = iou[$C000]
	@memory[$C030-$C03F] = port-sound
	@memory[$C040-$C07F] = iou[$C040]
	@memory[$C080-$C08F] = mmu[$C080]

	// Слот 6: КНГМД 140
	@memory[$C0E0-$C0EF] = fdc140

	@memory[$C100-$FFFF] = mmu[$C100]
}
