system {
	type = pravetz
	name = Правец
	version = Правец-82
	charmap = koi8
	debug = 0
}

// Правец-82 (ИМКО-2): аналог Apple ][+ на SY6502. Частота кадров и кварц в
// найденных документах не названы; взята развертка PAL, как у 8А
cpu : 6502 {
	// Холостые циклы NMOS: чтение до переноса в индексной адресации и
	// обратная запись в командах чтение-модификация-запись (INC $C030 - три
	// обращения к динамику, LDA $C0F3,Y через страницу трогает $C083)
	dummy_reads = 1
	clock = 1015657
	stopped = 0
}

// 12 Кб ПЗУ $D000-$FFFF (шесть 2716): Монитор с автозагрузкой с дисковода
// и БЕЙСИК с кириллицей
rom : rom {
	size = 12k
	image = files/pravetz-82-rom.bin
}

// Знакогенератор 2716: все знаки в нормальном виде, инверсия ($00-$3F) и
// мерцание ($40-$7F) делаются аппаратно; кириллица на месте строчных,
// буквы прижаты к нижнему краю. Дамп с agatcomp.ru, по словам авторов,
// снят с ошибками в нескольких знаках
font : rom {
	size = 2k
	image = files/pravetz-82-chr.bin
}

// 48 Кб на плате и 16 Кб платы ДОЗУ КР3.088.180 в слоте 0 (аналог Language
// Card): буфер 64 Кб, второй банк $D000 лежит в нем по $C000
ram : ram {
	size = 64k
	soft_reset = 0
}

boot140 : rom {
	size = 256
	image = files/fdc140-p5.bin
}

mmu : apple2-mmu {
	model = ii
	ram = ram
	rom = rom
	lc = 1
	slot6 = boot140
}

iou : apple2-iou {
	model = ii
	mmu = mmu
	keyboard = keyboard
	video = display
	~pb = keyboard.pb
}

keyboard : pravetz-keyboard {
	map = pravetz-82.map
	iou = iou
	kd7 = 0
	caps = none
	use_remap = 0
}

display : apple2-video {
	standard = apple-pal
	mmu = mmu
	iou = iou
	font = font
	charset = ii
	font_reverse = 1
	monitor = green
	soft_reset = 0
}

port-sound : port-address {}

sound : speaker {
	mode = flip
	~input = port-sound.access
}

// ПЗУ P6 контроллера: секвенсор (341-0028; у Правеца - РТ11 6H/6L)
p6rom : rom {
	size = 256
	image = files/fdc140-p6.bin
}

// Контроллер Disk II с секвенсором по P6: диск читается и пишется по
// битам, как его читала плата, - с настоящим временем, синхробайтами и
// защитами от копирования
fdc140 : apple2-disk2 {
	drives = fdd0|fdd1
	p6 = p6rom
	soft_reset = 0
}

fdd0 : fdd {
	title = 140K
	// Школьный диск СПТУ-20 (г. Ломоносов) с agatcomp.ru: DOS 3.3 и меню,
	// программа выбирается буквой. В software/pravetz есть и другие диски
	image = sptu20.dsk
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 0
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

fdd1 : fdd {
	title = 140K
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 1
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[$0000-$BFFF] = mmu
	@memory[$C000-$C02F] = iou[$C000]
	@memory[$C030-$C03F] = port-sound
	@memory[$C040-$C07F] = iou[$C040]
	// Слот 0: ДОЗУ 16 Кб
	@memory[$C080-$C08F] = mmu[$C080]

	// Слот 6: КНГМД 140
	@memory[$C0E0-$C0EF] = fdc140

	@memory[$C100-$FFFF] = mmu[$C100]
}
