system {
	type = pravetz
	name = Правец
	version = Правец-82
	charmap = koi8
	debug = 0
}

// Правец-82 (ИМКО-2): аналог Apple ][+ на SY6502. Частота кадров и кварц в
// найденных документах не названы; взята развертка PAL, как у 8А
cpu : 6502 {
	// Холостые циклы NMOS: чтение до переноса в индексной адресации и
	// обратная запись в командах чтение-модификация-запись (INC $C030 - три
	// обращения к динамику, LDA $C0F3,Y через страницу трогает $C083)
	dummy_reads = 1
	clock = 1015657
	stopped = 0
}

// 12 Кб ПЗУ $D000-$FFFF (шесть 2716): Монитор с автозагрузкой с дисковода
// и БЕЙСИК с кириллицей
rom : rom {
	size = 12k
	image = files/pravetz-82-rom.bin
}

// Знакогенератор 2716: все знаки в нормальном виде, инверсия ($00-$3F) и
// мерцание ($40-$7F) делаются аппаратно; кириллица на месте строчных,
// буквы прижаты к нижнему краю. Дамп с agatcomp.ru, по словам авторов,
// снят с ошибками в нескольких знаках
font : rom {
	size = 2k
	image = files/pravetz-82-chr.bin
}

// 48 Кб на плате и 16 Кб платы ДОЗУ КР3.088.180 в слоте 0 (аналог Language
// Card): буфер 64 Кб, второй банк $D000 лежит в нем по $C000
ram : ram {
	size = 64k
	soft_reset = 0
}

// Загрузчик на выбор: 16 секторов (DOS 3.3) или 13 (DOS 3.2, Apple
// 341-0009; секвенсор P6 тот же - новый читает и старые диски)
boot140 : rom {
	size = 256
	label = ПЗУ загрузчика КНГМД
	image_1 = files/fdc140-p5.bin
	title_1 = 16 секторов (DOS 3.3)
	image_2 = files/fdc140-p5-13.bin
	title_2 = 13 секторов (DOS 3.2)
	image = files/fdc140-p5.bin
}

// Плата ОЗУ 128 Кб КР3.088.184 в слоте 0 вместо платы ДОЗУ 16 Кб (agatcomp.ru:
// аналог Legend Soft Disk 128, «по сути 8 штук language card на одной
// плате»). Банк 0 - обычная языковая карта; банк по 16 Кб выбирается
// обращением к $C084-$C087 (0-3) и $C08C-$C08F (4-7), на плате 16 Кб это
// были зеркала $C080-$C083 и $C088-$C08B. Схемы платы нет: регистры взяты
// как у Saturn 128K, на которую похожи такие платы
ram128 : ram {
	size = 128k
	soft_reset = 0
}

mmu : apple2-mmu {
	model = ii
	ram = ram
	rom = rom
	lc = 1
	lc_ram = ram128
	slot6 = boot140
}

iou : apple2-iou {
	model = ii
	mmu = mmu
	keyboard = keyboard
	video = display
	~pb = keyboard.pb
	~tape_in = tape.output
}

// Клавиатура: ранняя - с RPT, без стрелок; поздняя - со стрелками и
// автоповтором (agatcomp.ru); выбирается в редакторе расширений
keyboard : pravetz-keyboard {
	map_label = Клавиатура
	map_1 = pravetz-82.map
	map_title_1 = Ранняя (RPT)
	map_2 = pravetz-82-late.map
	map_title_2 = Поздняя (стрелки, автоповтор)
	map = pravetz-82.map
	iou = iou
	kd7 = 0
	caps = none
	// RPT ранней клавиатуры; автоповтор задает таблица (@autorepeat)
	rpt = f11
	use_remap = 0
}

display : apple2-video {
	standard = apple-pal
	mmu = mmu
	iou = iou
	font = font
	charset = ii
	font_reverse = 1
	monitor = green
	soft_reset = 0
}

port-sound : port-address {}

// Магнитофон: запись - переключением $C020, чтение - разрядом 7 $C060, как
// у Apple ][ (Монитор: адрес.адресW и адрес.адресR, БЕЙСИК: SAVE и LOAD).
// Мотором машина не управляет: ленту пускает кнопка окна или tape.play()
tape : taperecorder {
	encoding = apple
	baudrate = 20000
	files = "Лента Правеца (*.ptp);;Ленты (*.ptp *.wav *.bin);;Запись кассеты (*.wav);;Двоичный файл, одна запись (*.bin)"
	~input = iou.tape_out
}

sound : speaker {
	mode = flip
	~input = port-sound.access
}

// ПЗУ P6 контроллера: секвенсор (341-0028; у Правеца - РТ11 6H/6L)
p6rom : rom {
	size = 256
	image = files/fdc140-p6.bin
}

// Контроллер Disk II с секвенсором по P6: диск читается и пишется по
// битам, как его читала плата, - с настоящим временем, синхробайтами и
// защитами от копирования
fdc140 : apple2-disk2 {
	drives = fdd0|fdd1
	p6 = p6rom
	soft_reset = 0
}

fdd0 : fdd {
	title = 140K
	// Школьный диск СПТУ-20 (г. Ломоносов) с agatcomp.ru: DOS 3.3 и меню,
	// программа выбирается буквой. В software/pravetz есть и другие диски
	image = sptu20.dsk
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.woz *.d13 *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 0
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

fdd1 : fdd {
	title = 140K
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.woz *.d13 *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;DOS 3.2, 13 sectors (*.d13);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 1
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[$0000-$BFFF] = mmu
	@memory[$C000-$C02F] = iou[$C000]
	@memory[$C030-$C03F] = port-sound
	@memory[$C040-$C07F] = iou[$C040]
	// Слот 0: ДОЗУ 16 Кб
	@memory[$C080-$C08F] = mmu[$C080]

	// Слот 6: КНГМД 140
	@memory[$C0E0-$C0EF] = fdc140

	@memory[$C100-$FFFF] = mmu[$C100]
}
