system {
	type = pravetz
	name = Правец
	version = Правец-8С
	charmap = koi8
	debug = 0
}

// Правец-8С: CM630 (NMOS 6502), в отличие от 8А - от кварца 14.31818 МГц,
// как NTSC-вариант Apple //e: строка 65 тактов, 262 строки. Средний такт с
// учетом длинного: 14318180*65/912 (сервисная документация, с. 7 и 14)
cpu : 6502 {
	// Холостые циклы NMOS: чтение до переноса в индексной адресации и
	// обратная запись в командах чтение-модификация-запись (INC $C030 - три
	// обращения к динамику, LDA $C0F3,Y через страницу трогает $C083)
	dummy_reads = 1
	clock = 1020484
	stopped = 0
	~irq = !rs232.intr
}

// 16 Кб ПЗУ $C000-$FFFF (CD + EF, СМ7864P 06/07), видны $C100-$FFFF
rom : rom {
	size = 16k
	image = files/pravetz-8a-rom.bin
}

// Знакогенератор 2764: две половины по 4 Кб, перемычка X20 (font_half у
// дисплея): 0 - набор Правеца, 1 - набор как у Apple //e. Прошивки:
// для СССР (Ы на $5F/$7F), болгарская (там пустой прямоугольник и шашечки)
// и СП «Вариант» (утолщенные скобки, Ы и Ъ переставлены)
font : rom {
	size = 8k
	label = Знакогенератор
	image_1 = files/pravetz-8a-chr-su.bin
	title_1 = Для СССР
	image_2 = files/pravetz-8a-chr-bg.bin
	title_2 = Болгарский
	image_3 = files/pravetz-8a-chr-variant.bin
	title_3 = СП «Вариант»
	image = files/pravetz-8a-chr-su.bin
}

ram : ram {
	size = 64k
	soft_reset = 0
}

// Вторые 64 Кб на плате (у 8С 128 Кб, без расширения)
aux : ram {
	size = 64k
	soft_reset = 0
}

// D38: программы встроенных устройств - Centronics ($C100, слот 1), RS-232
// на 8250 ($C200, слот 2, регистры $C098-$C09F), загрузчик КНГМД ($C600, слот 6).
// ПЗУ СП «Вариант» (СМ7732P A, 4 Кб; у болгарских машин то же самое дважды в
// 2764) или болгарская заплата E8: Centronics с 8-битным набором знаков,
// программа в $C800-$CFFF
d38 : rom {
	size = 8k
	repeat = 1
	label = ПЗУ D38
	image_1 = files/pravetz-8c-d38.bin
	title_1 = Заводское
	image_2 = files/pravetz-8c-d38-e8.bin
	title_2 = Заплата E8 (Centronics, 8 бит)
	image = files/pravetz-8c-d38.bin
}

mmu : apple2-mmu {
	model = iie
	ram = ram
	aux = aux
	rom = rom
	slot1 = d38[$100]
	slot1_exp = d38[$800]
	slot2 = d38[$200]
	slot6 = d38[$600]
}

iou : apple2-iou {
	model = iie
	pravetz = 1
	altchar_on_read = 1
	mmu = mmu
	keyboard = keyboard
	video = display
	~pb = keyboard.pb
}

// Раскладка кириллицы на одной и той же клавиатуре: ГОСТ (СССР), БДС
// (болгарский стандарт), ЯВЕРТЪ (фонетическая, как у 82 и 8М)
keyboard : pravetz-keyboard {
	map_label = Кириллица на клавиатуре
	map_1 = pravetz-8a-gost.map
	map_title_1 = ГОСТ (ЙЦУКЕН)
	map_2 = pravetz-8a-bds.map
	map_title_2 = БДС
	map_3 = pravetz-8a-yavert.map
	map_title_3 = ЯВЕРТЪ
	map = pravetz-8a-gost.map
	iou = iou
	use_remap = 0
}

display : apple2-video {
	standard = apple-ntsc
	mmu = mmu
	iou = iou
	font = font
	font_half = 0
	font_half_label = Перемычка X20
	font_half_title_0 = Набор Правеца
	font_half_title_1 = Набор Apple //e
	charset = iie
	monitor = green
	soft_reset = 0
}

port-sound : port-address {}

// Встроенный Centronics (рис. 4.1 сервисной документации): запись в
// $C090-$C097 защелкивает байт в 74LS374 и дает строб PSTR; чтение -
// разряд 6 BUSY, разряд 7 - подтверждение ACK еще не пришло. Программа в
// D38 ($C100) ждет, пока оба не станут 0
cent-data : port {
	access_mode = w
}

cent-status : port {
	~data[6] = printer.busy
	~data[7] = printer.busy
}

printer : printer {
	title = Centronics
	~data = cent-data.value
	~strobe = cent-data.access
}

// Встроенный RS-232: 8250 (D24) с кварцем 18.432 МГц через делитель на 10
// (1.8432 МГц), регистры $C098-$C09F. Программа в D38 ($C200) - терминал на
// 1200 бод, 8N1. Линию можно вывести на порт компьютера (параметр port,
// команда connect) или подавать в нее байты командой send
rs232 : ins8250 {
	title = RS-232
	clock_hz = 1843200
}

sound : speaker {
	mode = flip
	~input = port-sound.access
}

// ПЗУ P6 контроллера: секвенсор (341-0028; у Правеца - РТ11 6H/6L)
p6rom : rom {
	size = 256
	image = files/fdc140-p6.bin
}

// Контроллер Disk II с секвенсором по P6: диск читается и пишется по
// битам, как его читала плата, - с настоящим временем, синхробайтами и
// защитами от копирования
fdc140 : apple2-disk2 {
	drives = fdd0|fdd1
	p6 = p6rom
	soft_reset = 0
}

fdd0 : fdd {
	title = 140K
	// Школьный диск СПТУ-20 (г. Ломоносов) с agatcomp.ru: DOS 3.3 и меню,
	// программа выбирается буквой. В software/pravetz есть и другие диски
	image = sptu20.dsk
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 0
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

fdd1 : fdd {
	title = 140K
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 1
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[$0000-$BFFF] = mmu
	@memory[$C000-$C02F] = iou[$C000]
	@memory[$C030-$C03F] = port-sound
	@memory[$C040-$C07F] = iou[$C040]
	@memory[$C080-$C08F] = mmu[$C080]

	// Встроенные Centronics и RS-232 - в пространстве слота 1, КНГМД 140 -
	// как в слоте 6; свободны слоты 4, 5 и 7
	@memory[$C090-$C097] = cent-data {mode = w}
	@memory[$C090-$C097] = cent-status {mode = r}
	@memory[$C098-$C09F] = rs232
	@memory[$C0E0-$C0EF] = fdc140

	@memory[$C100-$FFFF] = mmu[$C100]
}
