system {
	type = pravetz
	name = Правец
	version = Правец-8Д
	// В списке - после аналогов Apple серии Правец
	order = 10
	charmap = koi8
	debug = 0
}

// Правец-8Д (1985): болгарский аналог Oric Atmos, к Apple отношения не
// имеет. Процессор 6502 на 1 МГц (12 МГц / 12), как у Oric
cpu : 6502 {
	dummy_reads = 1
	clock = 1000000
	stopped = 0
	~irq = via.irq
	// Кнопка RESET - на NMI (SW1 по схеме Oric-1): теплый старт, программа
	// остается
	~nmi = keyboard.nmi
}

// 16 Кб ПЗУ $C000-$FFFF: БЕЙСИК Oric с кириллицей (pravetzt.rom, тот же,
// что в MAME и Oricutron)
rom : rom {
	size = 16k
	image = files/pravetz-8d-rom.bin
}

// 64 Кб ОЗУ; верхние 16 Кб под ПЗУ, пока контроллер дисковода не отдаст
// их ОЗУ ("оверлей"). Экран и оба знакогенератора - в ОЗУ
ram : ram {
	size = 64k
	soft_reset = 0
}

// VIA 6522 на $0300: порт A - шина данных AY-3-8912 и принтера, PB0-PB2 -
// ряд клавиатуры, PB3 - ответ клавиатуры, PB4 - строб принтера, PB6 -
// мотор магнитофона, PB7 - выход на магнитофон; CA2 = BC1, CB2 = BDIR
// звукового генератора, CB1 - вход с магнитофона. Таймер 1 дает системное
// прерывание
via : via6522 {
	~pa_in = ay.da_out
	~pb_in[3] = keyboard.sense
	~cb1 = tape.output
}

// AY-3-8912 на 1 МГц. Регистры - через VIA, порт A генератора - маска
// столбцов клавиатуры
ay : ay8910 {
	bus = pins
	frequency = 1000000
	~bdir = via.cb2
	~bc1 = via.ca2
	~da = via.pa
}

// Матрица 8 x 8: ряд - номер в PB0-PB2, столбцы выбирает маска из порта A
// AY (0 - выбран), нажатие видно в PB3
keyboard : scan-keyboard {
	decoder = 1
	decoder_bits = 3
	~scan[0-2] = via.pb[0-2]
	~colmask = ay.porta
	map = pravetz-8d.kbd
	use_remap = 0
	keys = pravetz-8d.keys
	picture = pravetz-8d.svg
	matrix_shift = key_lshift
	// C/L - Caps Lock хоста. В режиме кириллицы буквенные клавиши дают
	// А-Я по КОИ-7 ($61-$7A), а Ю Ш Э Щ Ч - Shift с @ [ \ ] ^ в любом
	// режиме; Shift с буквой - всегда латиница. Для TYPE
	rus_key = caps
	rus_layout = koi7-shift
	nmi_key = f12
}

display : oric-ula {
	ram = ram
}

sound : speaker {
	mix = ay
}

// Магнитофон: запись - PB7 (таймер 1 VIA), чтение - CB1, мотор - PB6.
// Файлы *.tap (Oric, быстрый формат: бит - период 416 или 832 мкс)
tape : taperecorder {
	encoding = oric
	baudrate = 19231
	files = "Ленты Oric (*.tap);;Записи WAV (*.wav);;Все файлы (*.*)"
	~input = via.pb[7]
	~motor = via.pb[6]
}

// Контроллер дисковода Правец: Disk II на $0310-$031F (регистры в том же
// порядке, что $C0E0-$C0EF у Apple) и ПЗУ 8DOS на 512 байт. Окно ПЗУ -
// $0320-$03FF, половина выбирается записью: $0380/$0381 - первая, $0382/
// $0383 - вторая; нечетный адрес отдает $C000-$FFFF ОЗУ (оверлей), четный
// возвращает ПЗУ. Загрузка с диска - CALL 800 ($0320)
dosrom : rom {
	size = 512
	image = files/pravetz-8d-dos.bin
}

olay : port-address {
}

p6rom : rom {
	size = 256
	image = files/fdc140-p6.bin
}

fdc140 : apple2-disk2 {
	drives = fdd0|fdd1
	p6 = p6rom
	soft_reset = 0
}

fdd0 : fdd {
	title = 140K
	// Системный диск 8D RDOS 2.31 (пустой каталог): CALL 800, затем DIR,
	// SAVE"ИМЯ", LOAD"ИМЯ"
	image = rdos231-8d.dsk
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.woz *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 0
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

fdd1 : fdd {
	title = 140K
	sides = 1
	tracks = 35
	sectors = 16
	sector_size = 256
	mode = mfm_agat_140
	files = "All formats (*.dsk *.do *.po *.woz *.mfm *.nic *.nib *.hfe);;Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;HXC MFM (*.mfm);;NIB (*.nib);;NIC (*.nic);;HxC Floppy Emulator (*.hfe)"
	files_save = "Disk images 140K (*.dsk *.do *.po);;WOZ (*.woz);;HXC MFM (*.mfm);;HxC Floppy Emulator (*.hfe)"
	selector_value = 1
	soft_reset = 0
	~select = fdc140.select[0-1]
	~motor_on = !fdc140.motor_on
}

mapper : memory-mapper {
	portstomemory = 1
	// Разряд 0 - оверлей (1: $C000-$FFFF - ОЗУ), разряд 1 - половина ПЗУ 8DOS
	~config[0-1] = olay.value[0-1]

	@memory[$0300-$030F] = via
	@memory[$0310-$031F] = fdc140
	@memory[$0380-$0383] = olay {mode = w}
	@memory[0:2][$0320-$03FF] = dosrom[$0020] {mode = r}
	@memory[2:2][$0320-$03FF] = dosrom[$0120] {mode = r}
	@memory[0:1][$C000-$FFFF] = rom {mode = r}
	@memory[$0000-$FFFF] = ram
}
