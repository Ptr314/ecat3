system {
	type = poisk
	name = Поиск
	version = Поиск-1 (512 КБ)
}

// К1810ВМ88 на 5 МГц (кварц 15 МГц / 3). Прерывания идут через ВН59, его
// вектор процессор берет с отдельной линии vector; NMI дает ловушка CGA
cpu : i8088 {
	clock = _5000000
	~intr = pic.int
	~nmi = trap.nmi
	~vector = pic.vector
}

pic : i8259 {
	~inta = cpu.inta
	~ir[0] = pit.output[0]
	// Канал 1 таймера: опрос клавиатуры
	~ir[6] = pit.output[1]
}

// Все три канала от 1,25 МГц (15 МГц / 12), то есть такт процессора / 4
pit : i8253 {
	clock = 1/4
	~gate[2] = ppi2.B[0]
}

sound : speaker {
	~input = pit.output[2]
	~enable[0] = ppi2.B[1]
}

// ПЗУ: BIOS 1991 года из набора MAME poisk1 (poisk_1991.bin, CRC d61c56fd)
bios : rom {
	size = 8k
	image = poisk_1991.bin
}

// ОЗУ на плате, 512 КБ. Видеопамять - его верхние 32 КБ (здесь 78000-7FFFF):
// процессор видит их только окном B8000, по собственному адресу их в карте
// нет. Так их понимает и BIOS: он находит память пробой блоков по 16 КБ и
// останавливается на 78000, то есть отдает системе 480 КБ, а DOS, получив
// 512, положил бы COMMAND.COM прямо в экран. Регенерация экрана идет по той
// же шине микросхем памяти: процессор, обратившийся к этому ОЗУ, ждет
// свободного слота (wait = display). ОЗУ в картридже расширения не ждет
// ничего, поэтому программы переносили себя туда
ram0 : ram {
	size = 512k
	wait = display
}

// Видеосистема на БМК: 640x200 или 320x200, без текстового режима
display : poisk-display {
	ram = ram0
	~mode = ppi2.A
	~control = ppi1.CH
	// Модель разделения ОЗУ между процессором и видео: в строке изображения
	// слоты идут каждые 8 тактов процессора, первые 4 из них занимает видео.
	// На живой машине не измерено, подстраивается здесь
	wait_period = _8
	wait_busy = _4
	wait_blank = 0
}

// Окно B8000-BFFFF на те же байты ОЗУ, с ловушкой записи в первые 16 КБ
vram : poisk-vram {
	display = display
	trap = trap
	wait = display
	~trap_off = ppi2.A[3]
}

trap : poisk-trap {}

// Первый ВВ55: порт 60h (A) и 69h-6Bh (B, C, управление). A - строки
// клавиатуры, B и младшая половина C - ее 12 линий возврата, старшая половина
// C - порт 6Ah: разряд 7 переключает изображение 640x200
ppi1 : i8255 {}

// Второй ВВ55: порт 68h (A) и 61h-63h. A - регистр режима видео, B -
// динамик, C - синхронизация экрана (0 - вне изображения, 3 - кадровый
// гаситель), вход магнитофона (4) и выход канала 2 таймера (5)
ppi2 : i8255 {
	~CL[0] = display.hsync
	~CL[3] = display.vsync
	~CH[4] = tape.output
	~CH[5] = pit.output[2]
}

// Магнитофон: кассета IBM PC (INT 15h BIOS повторяет ее как есть). На ленту
// идет выход канала 2 таймера - меандр с периодом 1184 отсчета для бита 1 и
// 592 для бита 0; с ленты сигнал приходит в разряд 4 порта 62h. Двигателем
// BIOS этой версии не управляет: ленту запускают кнопкой. Файлы - *.cas
// (формат эмулятора PCE): байты записи с заголовком из FFh и байтом FEh
tape : taperecorder {
	encoding = ibmpc
	baudrate = 4223
	files = "Кассеты IBM PC (*.cas)"
	~input = pit.output[2]
}

keyboard : scan-keyboard {
	~scan = !ppi1.A
	~output = ppi1.B
	~output_hi[0-3] = ppi1.CL[0-3]
	map = poisk1.kbd
	keys = poisk1.keys
	use_remap = 0
	// Shift - контакт матрицы: знаки, которые на клавиатуре хоста
	// набираются с Shift, прижимают его
	matrix_shift = key_lshift
}

// Картридж дисковода B504: КР1818ВГ93 на портах C0h-C3h, регистр управления
// на C4h и ПЗУ драйвера (заводское, 2 КБ) по E0000. Основной BIOS находит
// это ПЗУ при старте и грузится с дискеты A:, а без нее уходит в свое меню
fddrom : rom {
	size = 2k
	image = b_ngmd_n.rf2
}

fdc : wd1793 {
	drives = fdd0|fdd1
}

// Чтение C4h держит процессор до DRQ или INTRQ; эмулятор вместо этого сразу
// доводит контроллер до этого места
fdc-ctl : poisk-fdc-control {
	fdc = fdc
}

// 5,25" 80 дорожек, две стороны, 9 секторов по 512 байт - 720 КБ. Образ -
// дамп секторов по цилиндрам (*.img); короче - дискета с пустым остатком
fdd0 : fdd {
	title = A:
	sides = 2
	tracks = 80
	sectors = 9
	sector_size = 512
	selector_value = 1
	files = "Образы дисков Поиска (*.img *.ima *.dsk);;Все файлы (*.*)"
	~select = fdc-ctl.value[0-1]
	~side = !fdc-ctl.value[4]
	~motor_on = !fdc-ctl.motor[0]
	// MS-DOS 5.0 с Volkov Commander 4.05, который запускается из AUTOEXEC.BAT;
	// образ в deploy/software/poisk
	image = msdos5_vc405.img
}

fdd1 : fdd {
	title = B:
	sides = 2
	tracks = 80
	sectors = 9
	sector_size = 512
	selector_value = 2
	files = "Образы дисков Поиска (*.img *.ima *.dsk);;Все файлы (*.*)"
	~select = fdc-ctl.value[0-1]
	~side = !fdc-ctl.value[4]
	~motor_on = !fdc-ctl.motor[1]
}

mapper : memory-mapper {
	address_bits = _20
	wideports = 1
	portstomemory = 0

	@memory[$00000-$77FFF] = ram0
	@memory[$B8000-$BFFFF] = vram
	@memory[$E0000-$E07FF] = fddrom {mode = r}
	@memory[$FE000-$FFFFF] = bios {mode = r}

	@port[$20-$21] = pic
	@port[$28-$2A] = trap
	@port[$40-$43] = pit
	@port[$C0-$C3] = fdc
	@port[$C4-$C7] = fdc-ctl
	@port[$60] = ppi1[0]
	@port[$61-$63] = ppi2[1]
	@port[$68] = ppi2[0]
	@port[$69-$6B] = ppi1[1]
	// 3DAh - порт состояния CGA, это порт C второго ВВ55; остальные порты
	// CGA перехватываются
	@port[$3DA] = ppi2[2]
	@port[$3D0-$3DF] = trap[$10]
}
