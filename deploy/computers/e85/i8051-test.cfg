// Отладочная машина для i8051: процессор и 64 КБ памяти, общие для кода и MOVX. Разряды
// порта P1 заведены на входы P3, поэтому INT0 (P3.2) и INT1 (P3.3) программа дёргает
// сама. Тест - cpu-i8051
system {
	type = e85
	name = i8051 (тест)
	version = i8051, таймеры и прерывания
	debug = 1
}

cpu : i8051 {
	clock = _12000000
	~p3_in = cpu.p1
}

ram : ram {
	size = _64k
}

mapper : memory-mapper {
	address_bits = _16
	portstomemory = 1
	@memory[$0000-$FFFF] = ram
}

// Экран и клавиатуру ядро ждёт у любой машины
video : e85-video {
}

display : e85-display {
	video = video
}

keyboard : ms7004 {
	map = ms7004.map
	use_remap = 0
}
