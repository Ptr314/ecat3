// Числа без префикса в этом файле восьмеричные, как во всей документации машины.
// Адреса физические, 22-разрядные: страница ввода-вывода 17760000-17777777.
system {
	radix = 8
	charmap = koi8
	type = e85
	name = Электроника
	version = МС 0585
	debug = 0
}

//=========================== Системный модуль НС1 ==========================//

// КМ1811ВМ1 (F-11). Кварц 26,666 МГц на два, рабочий такт кристалла здесь -
// ещё вдвое: при reply_delay = 4 ADD R,R идёт 1,8 мкс, как в ТО (таблица 2),
// а SOB - 3 мкс, чего ждёт тест таймера в ПЗУ (2,8-3,4 мкс на проход)
cpu : km1811vm1 {
	clock = _6666666
	reply_delay = _4
	start_address = 160000
	// Адаптер плавающей запятой: без него ПРОС не загружается, её программы
	// на Паскале считают им
	fp = 1
	~virq = pic1.virq
	~vector = pic1.vector
}

// 512 КБ: один блок модуля НП2
ram : ram {
	size = _512k
}

// ПЗУ автодиагностики: две микросхемы по 8 КБ (D64 младшие байты, D65 старшие).
// Образ собран в порядке адресов, с 17730000
rom : rom {
	size = _16k
	image = ms0585.rom
}

// Три контроллера прерываний цепочкой, первый старший (ТО2, таблица 36):
// первый обслуживает модуль, второй и третий - линии А и Б позиций магистрали
pic1 : am9519 {
	~virq_in = pic2.virq
	~vector_in = pic2.vector
	~iako = cpu.iako
	~irq[1] = kbd.rxrdy
	~irq[2] = kbd.txrdy
	~irq[3] = comm.irq
	~irq[5] = prn.rxrdy
	~irq[6] = prn.txrdy
	~irq[7] = rtc.irq
}

pic2 : am9519 {
	~virq_in = pic3.virq
	~vector_in = pic3.vector
	~iako = cpu.iako
	~irq[1] = kngmd.irqa
	~irq[2] = video.irqa
}

pic3 : am9519 {
	~iako = cpu.iako
	~irq[1] = kngmd.irqb
	~irq[2] = video.irqb
}

// Интерфейс клавиатуры. Игры ждут нажатия, читая состояние в цикле, хотя символ
// забирает обработчик ядра: на машине команда успевает прочитать состояние раньше,
// чем примется прерывание, а признаки вернёт RTI. Задержка больше команды чтения
kbd : scn2661 {
	title = Клавиатура
	~rxd = keyboard.data
	rx_delay = _8
}

keyboard : ms7004 {
	map = ms7004.map
	keys = ms7004.keys
	picture = ms7004_keyboard.svg
	remap_arrows = arrows_ms7004.remap
	remap_letters = letters_ms7004.remap
	use_remap = 0
	interval = _14000
	~rxd = kbd.txd
}

// Других источников звука в машине нет: только пьезозвонок в клавиатуре
sound : speaker {
	~input = keyboard.sound
}

// Интерфейс внешнего устройства, разъём «Печать»: всё, что напечатано, видно в
// окне портов. Готовность принтера приходит на DSR (цепь 107А), неподключённый
// вход читается единицей. ПРОС шлёт русский текст принтеру СМ6329 в КОИ-7 с SO/SI
prn : scn2661 {
	title = Печать
	host_port = 1
	charset = koi7_n0_n1
}

// Коммуникационный порт, 8274 с регистрами модема
comm : e85-comm {
}

// Таймер КР512ВИ1, питается от аккумулятора
rtc : mc146818 {
	clock_source = cpu
	battery = 1
}

// Регистры модуля: конфигурация ОЗУ и монитор, занятость позиций, индикаторы,
// идентификационное ПЗУ
sys : e85-sys {
	memory = 023
	slots = 016
}

//=================== Видеоконтроллер НВ1 и расширитель НВ2 ==================//

// НВ1 стоит в третьей позиции (индекс 2), НВ2 - в четвёртой
video : e85-video {
	expansion = 1
	~init = cpu.init
}

display : e85-display {
	video = video
}

//======================== Контроллер НГМД, вторая позиция ===================//

// Вся работа - в прошивке 8751 («Кочан»). Плата связывает её с машиной
kngmd : e85-kngmd {
	fdc = fdc
	clock_source = kngmd-cpu
	~p1 = kngmd-cpu.p1
	~p2 = kngmd-cpu.p2
	~drq = fdc.drq
	~intrq = fdc.intrq
	~init = cpu.init
}

// СТД - синхросигнал логики чтения, 4 мкс: прошивка считает его таймером 0
kngmd-cpu : i8051 {
	clock = _8000000
	t0_clock = _250000
	mapper = kngmd-mapper
	~p2_in = kngmd.pins
	~reset = kngmd.reset
}

// Прошивки: штатная и форматирующая (её берёт программа форматирования дискет)
kngmd-rom : rom {
	clock_source = kngmd-cpu
	size = _4k
	label = Прошивка контроллера НГМД
	image_1 = kochan.rom
	title_1 = КОЧАН
	image_2 = kochan-f1.rom
	title_2 = КОЧАН, форматирующая (0015)
	image_3 = kochan-f0.rom
	title_3 = КОЧАН Ф0
}

// КР1818ВГ93. 300 об/мин - индекс каждые 200 мс: прошивка проверяет по нему вращение
fdc : wd1793 {
	clock_source = kngmd-cpu
	drives = fd0|fd1
	physical_head = 1
	max_cylinder = _79
	index_period = _200
	rotate_id = 1
}

fd0 : fdd {
	title = НГМД 0
	sides = _1
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 0
	files = "Образы дискет (*.dsk *.img *.hfe);;Все файлы (*.*)"
	~select = kngmd.select
	~side = kngmd.side
	~motor_on = kngmd.motor
}

fd1 : fdd {
	title = НГМД 1
	sides = _1
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 1
	files = "Образы дискет (*.dsk *.img *.hfe);;Все файлы (*.*)"
	~select = kngmd.select
	~side = kngmd.side
	~motor_on = kngmd.motor
}

kngmd-mapper : memory-mapper {
	@memory[$0000-$0FFF] = kngmd-rom {mode = r}
	@port[$0000-$FFFF] = kngmd[1000]
}

mapper : memory-mapper {
	address_bits = _22
	@memory[00000000-01777777] = ram
	@memory[17730000-17767777] = rom {mode = r}
	@memory[17773000-17773177] = rtc
	@memory[17773200-17773203] = pic1
	@memory[17773204-17773207] = pic2
	@memory[17773210-17773213] = pic3
	@memory[17773300-17773317] = comm
	@memory[17773400-17773407] = prn
	@memory[17773500-17773507] = kbd
	@memory[17773600-17773705] = sys
	@memory[17774200-17774377] = kngmd
	@memory[17774400-17774577] = video
	@memory[17774600-17774777] = video[400]
	@memory[02000000-17727777] = video[2000000] {routed = 1}
	@memory[17777560-17777567] = sys[220]
	@memory[17777750-17777751] = sys[200]
}
