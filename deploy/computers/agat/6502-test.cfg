system {
	type = agat
	name = Агат
	version = 6502 тест
	charmap = koi8
	debug = 1
}

cpu : 65c02 {
	clock = 10000000
	~irq = !port-irq.value[0]
	~nmi = !port-irq.value[1]
}

font : rom {
	size = 2k
	image = A7-fnt.rom
}

ram1 : ram {
	size = 64k
	fill = random
}

port-video : port-address {
		   default = $02
}

port-irq : port {}


display : agat-7-display {
	ram = ram1
	mode = port-video
	font = font
}

keyboard : scan-keyboard {
	map = agat.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

mapper : memory-mapper {
	portstomemory = 1
	@memory[$0000-$AFFF] = ram1[$0000]
	@memory[$B000-$BFFF] = port-irq
	@memory[$C000-$FFFF] = ram1[$C000]
}



