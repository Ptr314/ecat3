// Отладочная конфигурация для проверки ядра К1801ВМ1 и дисплея БК.
// ПЗУ образов не требует: тестовая программа записана прямо в конфигурации.

system {
	// Числа без префикса в этом файле восьмеричные, как принято для БК
	radix = 8
	type = bk
	name = БК
	version = Тест К1801ВМ1
	debug = 1
	files = "BK files (*.bin)"
}

cpu : 1801vm1 {
	clock = _3000000
	// Время каждого цикла шины - по модели кристалла (tools/bk-timing), а не по
	// формулам: ОЗУ отвечает через контроллер vp037
	timing = vm1
	start_address = 100000
}

// К1801ВП1-037 - контроллер ОЗУ и экрана. Процессор получает ОЗУ только в одной
// точке цикла контроллера, раз в 1333 нс (8 тактов 6 МГц), и только если строб
// выставлен заранее; ответ приходит на фиксированное время позже. Числа в нс,
// подобраны по замерам на настоящих БК0010 и БК0011М (tools/bk-timing). ПЗУ и
// регистры за контроллером не стоят и отвечают сразу
vp037 : bus-timing {
	window = _1333
	setup_read = _250
	setup_write = _400
	setup_rmw = _700
	reply = _550
}

ram : ram {
	bus_timing = vp037
	size = _16k
}

vram : ram {
	bus_timing = vp037
	size = _16k
}

// Начальные векторы и программа заливки видеопамяти:
//   0100000: 0100004        начальный PC
//   0100002: 0000340        начальный PSW
//   0100004: MOV #040000,R0
//   0100010: MOV #020000,R1
//   0100014: MOV R1,(R0)+
//   0100016: SOB R1,0100014
//   0100020: BR .
bios : rom {
	data = {$04,$80,$E0,$00,$C0,$15,$00,$40,$C1,$15,$00,$20,$50,$10,$42,$7E,$FF,$01}
}

display : bk-display {
	vram = vram
	mode = color
}

// Клавиатура в этой конфигурации не эмулируется, но устройство с именем
// keyboard обязано присутствовать
keyboard : scan-keyboard {
	map = rk.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-037777] = ram
	@memory[040000-077777] = vram
	@memory[100000-100021] = bios {mode = r}
}
