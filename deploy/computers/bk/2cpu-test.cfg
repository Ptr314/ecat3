// Отладочная конфигурация для проверки машин с двумя процессорами.
// Образов ПЗУ не требует: тестовая программа записана прямо в конфигурации.
//
// Два К1801ВМ1 на частотах 8 и 6,25 МГц - то же соотношение 32:25, что у ЦП и
// ПП в УК-НЦ. У каждого свой диспетчер адресов и своя память, общего нет
// ничего. Оба крутят один и тот же цикл, наращивающий слово по адресу 0100
// в собственном ОЗУ, поэтому после одинакового ожидания счётчики обязаны
// относиться как частоты. Это и есть проверка планировщика.

system {
	// Числа без префикса в этом файле восьмеричные, как принято для БК
	radix = 8
	type = bk
	name = БК
	version = Тест двух процессоров
	debug = 1
}

// Ведущий процессор. Устройство с именем cpu задаёт временную базу машины:
// clock_counter, задержки сценариев и WAIT считаются в его тактах
cpu : 1801vm1 {
	clock = _8000000
	start_address = 100000
}

// Второй процессор. Параметр mapper - то, чего в эмуляторе не было:
// раньше любой процессор брал диспетчер с жёстко заданным именем "mapper"
ppu : 1801vm1 {
	clock = _6250000
	start_address = 100000
	mapper = ppu-mapper
}

ram : ram {
	size = _16k
}

vram : ram {
	size = _16k
}

ppu-ram : ram {
	size = _16k
}

// Без start_vector процессор начинает выполнение прямо со start_address,
// поэтому пары PC/PSW в начале нет - сразу счётный цикл:
//   0100000: 0005237 0000100   INC @#100
//   0100004: 0000775           BR  0100000
counter : rom {
	data = {$9F,$0A,$40,$00,$FD,$01}
}

ppu-counter : rom {
	data = {$9F,$0A,$40,$00,$FD,$01}
}

// Экран тактуется от ведущего, как и всё, у чего не указан clock_source
display : bk-display {
	vram = vram
	mode = color
}

// Клавиатура в этой конфигурации не эмулируется, но устройство с именем
// keyboard обязано присутствовать
keyboard : scan-keyboard {
	map = rk.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

// Таймеры с одинаковым делителем на разных доменах: за одно и то же время
// ведущий насчитает в 32/25 раза больше, чем ведомый. Проверка того, что
// clock_source разводит тактирование устройств по доменам
timer : bk-timer {
	divider = _128
}

ppu-timer : bk-timer {
	divider = _128
	clock_source = ppu
}

mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-037777] = ram
	@memory[040000-077777] = vram
	@memory[100000-100005] = counter {mode = r}
	@memory[177706-177713] = timer
}

ppu-mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-037777] = ppu-ram
	@memory[100000-100005] = ppu-counter {mode = r}
	@memory[177706-177713] = ppu-timer
}
