system {
	// Числа без префикса в этом файле восьмеричные, как принято для БК
	radix = 8
	type = bk
	name = БК
	version = БК0010-01 + КНГМД
	charmap = koi8
	files = "Файлы БК (*.bin *.cod);;Все файлы (*.*)"
}

// БК0010-01 с блоком КНГМД в разъеме МПИ: контроллер К1801ВП1-128 (регистры
// 0177130 и 0177132), ПЗУ дискового драйвера DISK 326 по 0160000 и 16 КБ
// дополнительного ОЗУ на 0120000-0157777 вместо второй и третьей частей
// БЕЙСИКа. Разряды 2-3 команды 0177130 выбирают, что стоит в этом окне:
// 11 - ПЗУ БЕЙСИКа, 10 - ничего, 0x - ОЗУ. Монитор при включении находит
// дисковое ПЗУ и пытается загрузить систему с приводов 0 и 1.

// К1801ВМ1 стартует прямо с начального адреса 0100000, где начинается Монитор.
// Клавиша СТОП и команда HALT передают управление через вектор 004.
cpu : 1801vm1 {
	clock = _3000000
	start_address = 100000
	halt_vector = 4
	~virq = !kbd-ready.out[0]
	~vector = kbd-vector.out
}

// 0000000-0037777 - основное ОЗУ, 0040000-0077777 - видеоОЗУ
ram : ram {
	size = _16k
}

vram : ram {
	size = _16k
}

monitor : rom {
	size = _8k
	image = MONIT10.ROM
}

basic1 : rom {
	size = _8k
	image = Basic10first.rom
}

basic2 : rom {
	size = _8k
	image = Basic10second.rom
}

// Дополнительное ОЗУ блока КНГМД
ram-fdd : ram {
	size = _16k
}

// ПЗУ дискового драйвера, 4 КБ по 0160000-0167777. Адреса 0170000-0177127
// остаются пустыми: таймаут магистрали там нужен ПЗУ для поиска устройств.
disk : rom {
	size = _4k
	image = DISK_326.ROM
}

// Контроллер НГМД. Регистр состояния/команды 0177130, регистр данных 0177132.
// Контроллер отдает процессору дорожку словами, поиск секторов и контроль
// делает ПЗУ. Одно слово каждые 64 мкс - 300 об/мин, 3125 слов на дорожку.
fdc : bk-fdc {
	drives = fdd0|fdd1
}

// Приводы: 80 дорожек, две стороны, 10 секторов по 512 байт - 800 КБ.
// Образ - дамп секторов (*.img, *.bkd, *.dsk); укороченные образы на 40
// дорожек читаются как дискеты с пустым остатком.
fdd0 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 0
	image = andos.img
	files = "Образы дискет БК (*.img *.bkd *.dsk);;Все файлы (*.*)"
	~select = fdc.select[0-1]
	~motor_on = fdc.motor_on
}

fdd1 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 1
	files = "Образы дискет БК (*.img *.bkd *.dsk);;Все файлы (*.*)"
	~select = fdc.select[0-1]
	~motor_on = fdc.motor_on
}

// Регистры ввода-вывода. Разрядность 16 бит, обращения выполняются словами.

// 0177660 - состояние клавиатуры, бит 7 - готовность кода
port-kbd-state : port {
	size = _16
	~data[7] = kbd-ready.out[0]
}

// 0177662 - код нажатой клавиши, чтение сбрасывает готовность. Регистр только
// для чтения: запись в него остается без ответа (таймаут магистрали), и по этому
// признаку дисковые системы отличают БК0010 от БК0011М, где 0177662 доступен
// для записи как регистр палитры.
port-kbd-code : port {
	size = _16
}

// 0177664 - регистр управления скроллингом, 01330 соответствует несдвинутому экрану
port-scroll : port {
	size = _16
	default = 1330
}

// 0177700, 0177702, 0177704 - регистры с постоянными значениями
port-177700 : port {
	size = _16
	default = 177740
	mask = 0
}

port-177702 : port {
	size = _16
	default = 177777
	mask = 0
}

port-177704 : port {
	size = _16
	default = 177440
	mask = 0
}

// 0177706-0177712 - таймер
timer : bk-timer {
	divider = _128
}

// 0177714 - параллельный порт
port-ppi : port {
	size = _16
	~data[0-7] = joystick.out[0-7]
}

// Стандартный джойстик БК на входных линиях порта 0177714: вверх 1, вправо 2,
// вниз 4, влево 010, кнопка A 020, огонь 040, дополнительный огонь 0100,
// кнопка B 0200. Нажатый контакт читается единицей. Клавиши хоста заданы
// в bk-joystick.map: стрелки, End, Home, PgUp и PgDn.
joystick : joystick {
	map = bk-joystick.map
}

// Музыкальный сопроцессор AY-3-8910 на выходных линиях порта 0177714, как в
// распространенных приставках к БК: запись слова в порт выбирает регистр,
// запись байта по адресу 0177714 записывает в него данные. Линии порта
// инвертирующие, поэтому в порт кладется дополнение номера и данных до 0377.
// Микросхема тактируется частотой 12 МГц / 7.
ay : ay8910 {
	bus = bk
}

// 0177716 - системный регистр:
//   запись бита 5 - выход на магнитофон, бита 6 - звук
//   чтение бита 5 - вход с магнитофона, бита 6 - признак нажатия клавиши
port-sys : port {
	size = _16
	default = 100000
	~data[5] = tape.output
}

display : bk-display {
	vram = vram
	scroll = port-scroll
	mode = color
}

keyboard : map-keyboard {
	map = bk.map
	port-value = port-kbd-code
	ruslat = caps
}

// Триггер готовности: взводится клавиатурой, сбрасывается чтением кода
kbd-ready : register {
	~s = keyboard.ready
	~r = port-kbd-code.access
}

// Вектор прерывания от клавиатуры - 060
kbd-vector : register {
	type = buffer
	default = 60
	~in = 0
}

sound : speaker {
	~input = port-sys.value[6]
	mix = ay
}

// Магнитофон: выход машины - бит 6 регистра 0177716, вход - бит 5
tape : taperecorder {
	ecoding = bk
	baudrate = _9464
	files = "Файлы БК (*.bin *.cod *.foc *.asc);;Все файлы (*.*)"
	~input = port-sys.value[6]
}

mapper : memory-mapper {
	portstomemory = 1

	// Разряды 2-3 команды контроллера выбирают содержимое окна 0120000-0157777
	~config[2-3] = fdc.control[2-3]

	@memory[000000-037777] = ram
	@memory[040000-077777] = vram
	@memory[100000-117777] = monitor {mode = r}
	@memory[14:14][120000-137777] = basic1 {mode = r}
	@memory[14:14][140000-157777] = basic2 {mode = r}
	@memory[0:10][120000-157777] = ram-fdd
	@memory[160000-167777] = disk {mode = r}

	@memory[177130-177133] = fdc

	@memory[177660-177661] = port-kbd-state
	@memory[177662-177663] = port-kbd-code {mode = r, strict = 1}
	@memory[177664-177665] = port-scroll
	@memory[177700-177701] = port-177700
	@memory[177702-177703] = port-177702
	@memory[177704-177705] = port-177704
	@memory[177706-177713] = timer
	@memory[177714-177715] = ay {mode = w}
	@memory[177714-177715] = port-ppi {mode = r}
	@memory[177716-177717] = port-sys
}
