system {
	// Числа без префикса в этом файле восьмеричные, как принято для БК
	radix = 8
	type = bk
	name = БК
	version = БК0010-01 + СМК-512
	charmap = koi8
	files = "Файлы БК (*.bin *.cod);;Все файлы (*.*)"
}

// БК0010-01 с платой СМК-512 вместо блока КНГМД. Бейсика на этой машине нет:
// его ПЗУ плата отключает, а разряд 3 регистра 0177130, подключавший его на
// старых СМК-64, у СМК-512 не работает. Монитор плата отключает в режимах, где
// ставит на его место свое ОЗУ.

// К1801ВМ1 стартует прямо с начального адреса 0100000, где начинается Монитор.
// Клавиша СТОП и команда HALT передают управление через вектор 004.
cpu : 1801vm1 {
	clock = _3000000
	// Время каждого цикла шины - по модели кристалла (tools/bk-timing), а не по
	// формулам: ОЗУ отвечает через контроллер vp037
	timing = vm1
	// Пуск - с 0166400, из ПЗУ платы. Процессор берет адрес пуска из 0177716,
	// но в режиме SYS, который плата ставит при сбросе, ее ПЗУ перекрывает и
	// страницу ввода-вывода, и там читается слово ПЗУ 0167716 = 0166400
	start_address = 166400
	halt_vector = 4
	~halt = !keyboard.stop
	~virq = kbd-irq.out[0]
	~vector = keyboard.vector
}

// К1801ВП1-037 - контроллер ОЗУ и экрана. Процессор получает ОЗУ только в одной
// точке цикла контроллера, раз в 1333 нс (8 тактов 6 МГц), и только если строб
// выставлен заранее; ответ приходит на фиксированное время позже. Числа в нс,
// подобраны по замерам на настоящих БК0010 и БК0011М (tools/bk-timing). ПЗУ и
// регистры за контроллером не стоят и отвечают сразу
vp037 : bus-timing {
	window = _1333
	setup_read = _250
	setup_write = _400
	setup_rmw = _700
	reply = _550
}

// 0000000-0037777 - основное ОЗУ, 0040000-0077777 - видеоОЗУ
ram : ram {
	bus_timing = vp037
	size = _16k
}

vram : ram {
	bus_timing = vp037
	size = _16k
}

monitor : rom {
	size = _8k
	image = MONIT10.ROM
}

// Плата СМК-512 (АльтПро) в разъеме МПИ, как ее делает ПЛИС-реплика: 512 КБ
// ОЗУ, ПЗУ BIOS 4 КБ, контроллер дисковода, совместимый с К1801ВП1-128, и
// контроллер винчестера ИДЕ. Память платы подключается в окно 0100000-0177777
// восемью режимами, выбираемыми записью в 0177130 (MOV #6, затем MOV
// режим+страница); в каждом режиме плата не только перекрывает, но и отключает
// часть памяти самой машины. Это решает устройство smk: в диспетчере оно
// стоит одним диапазоном с routed = 1 и по каждому адресу отвечает само,
// оставляет его машине или оставляет магистраль без ответа.

// Статическая память платы стоит на МПИ, а не за ВП1-037, и отвечает сразу
smk-bus : bus-timing {
}

smk-ram : ram {
	size = _512k
}

smk-rom : rom {
	size = _4k
	image = SMK512_V205.ROM
}

smk : smk512 {
	bus_timing = smk-bus
	ram = smk-ram
	rom = smk-rom
	machine = bk10
}

// Винчестер платы: те же регистры АльтПро, что у УК-НЦ, по 0177740-0177757.
// Геометрия - из таблицы разделов в блоке 7 образа. Образа по умолчанию нет:
// его вставляют командой hdd.load("файл")
hdd : uknc-hdd {
	board = bk
	files = "Образы винчестера БК (*.img *.hdi *.hdd);;Все файлы (*.*)"
}

// Контроллер НГМД. Регистр состояния/команды 0177130, регистр данных 0177132.
// Контроллер отдает процессору дорожку словами, поиск секторов и контроль
// делает ПЗУ. Одно слово каждые 64 мкс - 300 об/мин, 3125 слов на дорожку.
fdc : bk-fdc {
	drives = fdd0|fdd1
}

// Приводы: 80 дорожек, две стороны, 10 секторов по 512 байт - 800 КБ.
// Образ - дамп секторов (*.img, *.bkd, *.dsk); укороченные образы на 40
// дорожек читаются как дискеты с пустым остатком.
fdd0 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 0
	image = andos330.img
	files = "Образы дискет БК (*.img *.bkd *.dsk);;Все файлы (*.*)"
	~select = fdc.select[0-1]
	~motor_on = fdc.motor_on
}

fdd1 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 1
	files = "Образы дискет БК (*.img *.bkd *.dsk);;Все файлы (*.*)"
	~select = fdc.select[0-1]
	~motor_on = fdc.motor_on
}

// Регистры ввода-вывода. Разрядность 16 бит, обращения выполняются словами.

// 0177660 - состояние клавиатуры. Бит 7 - готовность кода, он только читается:
// ПЗУ обнуляет этот регистр после каждой клавиши, и если бы запись доходила до
// разряда готовности, код терялся бы. Программно доступен только бит 6 -
// маска прерывания от клавиатуры.
port-kbd-state : port {
	size = _16
	mask = 100
	~data[7] = kbd-ready.out[0]
}

// 0177662 - код нажатой клавиши, чтение сбрасывает готовность. Регистр только
// для чтения: запись в него остается без ответа (таймаут магистрали), и по этому
// признаку дисковые системы отличают БК0010 от БК0011М, где 0177662 доступен
// для записи как регистр палитры.
port-kbd-code : port {
	size = _16
}

// 0177664 - регистр управления скроллингом, 01330 соответствует несдвинутому экрану
port-scroll : port {
	size = _16
	default = 1330
}

// 0177700, 0177702, 0177704 - регистры с постоянными значениями
port-177700 : port {
	size = _16
	default = 177740
	mask = 0
}

port-177702 : port {
	size = _16
	default = 177777
	mask = 0
}

port-177704 : port {
	size = _16
	default = 177440
	mask = 0
}

// 0177706-0177712 - таймер
timer : bk-timer {
	divider = _128
}

// 0177714 - параллельный порт
port-ppi : port {
	size = _16
	~data[0-7] = joystick.out[0-7]
	~data[0-7] = mouse.out[0-7]
}

// 0177714 при записи - выходной регистр порта. Запись приходит и в AY, и сюда;
// его младший байт - вход Covox
port-ppi-out : port {
	size = _16
}

// Стандартный джойстик БК на входных линиях порта 0177714: вверх 1, вправо 2,
// вниз 4, влево 010, кнопка A 020, огонь 040, дополнительный огонь 0100,
// кнопка B 0200. Нажатый контакт читается единицей. Клавиши хоста заданы
// в bk-joystick.map: стрелки, End, Home, PgUp и PgDn.
joystick : joystick {
	map = bk-joystick.map
}

// Мышь УВК-01 «Марсианка» на тех же входных линиях: вверх 1, вправо 2, вниз 4,
// влево 010 - триггеры направлений, которые держатся до сброса; кнопка «Л» 040,
// кнопка «П» 0100. Сброс - разряд 3 выходного регистра порта: пока он нулевой,
// триггеры сброшены, поэтому программа пишет в порт 0, а за ним 010.
mouse : mouse {
	~reset = !port-ppi-out.value[3]
	// Строб чтения порта: сброшенный непрочитанным шаг мышь повторит
	~read = port-ppi.access
}

// Разъем УП: джойстик и мышь занимают одни и те же линии, поэтому подключено
// одно устройство или ни одного. По умолчанию разъем пуст, и стрелки хоста
// работают только как клавиатура; выбор меняется на панели инструментов.
up : connector {
	devices = joystick|mouse
	default = none
	icon = joystick.png
}

// Музыкальный сопроцессор AY-3-8910 на выходных линиях порта 0177714, как в
// распространенных приставках к БК: запись слова в порт выбирает регистр,
// запись байта по адресу 0177714 записывает в него данные. Линии порта
// инвертирующие, поэтому в порт кладется дополнение номера и данных до 0377.
// Микросхема тактируется частотой 12 МГц / 7.
ay : ay8910 {
	bus = bk
}

// Плата 2xAY (TurboSound, GryphonSound): два AY на том же порту - отдельный
// пункт списка звуковой приставки. Слово выбора регистра 0377 (после инверсии
// порта) направляет запись в первый AY, 0376 - во второй, разряды 15 и 14
// выбирают первый, второй или оба. Одиночный ay этих слов не разбирает: у
// программы, которая пишет номер регистра байтом, старший байт слова после
// инверсии дает оба разряда, и на плате ее запись ушла бы в оба AY.
ts-ay1 : ay8910 {
	bus = bk
	chip = 1
	// Название в списке звуковой приставки: плата, а не микросхема
	title = 2xAY TurboSound
}

// Второй AY платы: вставляется и вынимается вместе с первым и в смеси
// участвует, только когда программа к нему обратилась
ts-ay2 : ay8910 {
	bus = bk
	chip = 2
	pair = ts-ay1
}

// Covox - восьмиразрядный ЦАП на выходных линиях того же порта: уровень на
// выходе равен младшему байту выходного регистра, без инверсии. Частоту
// выборки задает сама программа тем, как часто пишет в порт.
covox : covox {
	~input = port-ppi-out.value[0-7]
}

// Звуковая приставка на порту 0177714: AY-3-8910, Covox, плата 2xAY или ничего
// (2xAY - последним пунктом, чтобы номера прежних выборов в ini не сдвинулись). Место под
// приставку одно: программа для Covox выводит выборки байтами в тот же порт,
// и AY принял бы их за данные своих регистров (в демо TDR - за форму огибающей,
// вместо музыки выходил шум). Выбор - списком на панели инструментов.
sound-card : connector {
	devices = ay|covox|ts-ay1
	default = ay
	kind = sound
	icon = sound.png
}

// 0177716 - системный регистр. За одним адресом стоят два разных регистра.
// При записи бит 6 - выход на магнитофон и на звук.
port-sys : port {
	size = _16
	default = 100000
}

// При чтении отвечает второй регистр: бит 5 - вход с магнитофона, бит 6 -
// признак нажатой клавиши (активный уровень - ноль). По этому биту ПЗУ и
// дисковые системы делают автоповтор, и клавиша, которая никогда не видна
// отпущенной, повторяется бесконечно. Записанное в 0177716 здесь не
// появляется, как и на реальной машине.
port-sys-rd : port {
	size = _16
	default = 100100
	~data[5] = tape.output
	~data[6] = !keyboard.pressed
}

// Контроллер экрана К1801ВП1-037 рисует по развертке: кадр из 320 строк по 64 мкс,
// 256 видимых и 64 служебные. Палитра и экранная страница берутся в момент, когда
// луч проходит строку, регистр 0177664 - один раз за кадр, в служебных строках.
display : bk-display {
	vram = vram
	scroll = port-scroll
	mode = color
}

keyboard : map-keyboard {
	map = bk.map
	keys = bk.keys
	picture = bk_keyboard.svg
	port-value = port-kbd-code
	// Контроллер отдает процессору один из двух векторов: код, набранный с АР2,
	// и управляющие коды 0-2, 4-7, 11, 13, 21 при любых модификаторах идут
	// через 274, и восьмибитный код из этой пары делает ПЗУ
	vector = 60
	alt-vector = 274
	alt-codes = "0,1,2,4,5,6,7,11,13,21"
	ruslat = caps
	// Caps Lock хоста шлет машине коды РУС и ЛАТ, как одноименные клавиши
	rusmode = code
	rus_switches = $0E/$0F
	// Буквы с клавиатуры компьютера подчиняются защелкам ЗАГЛ/СТР и регистру РУС,
	// как клавиши экранной клавиатуры
	case-latch = 1
}

// Триггер готовности: взводится клавиатурой, сбрасывается чтением кода
kbd-ready : register {
	~s = keyboard.ready
	~r = port-kbd-code.access
}

// Запрос прерывания от клавиатуры: готовность кода, пока разряд 6 регистра
// 0177660 нулевой. Единица в нем прерывание запрещает, и программа опрашивает
// разряд 7 сама (демо INSULT ждет пробела так); без маски код забирал
// обработчик ПЗУ по вектору 060, и программа нажатия не видела.
kbd-irq : mux {
	~a[0] = !kbd-ready.out[0]
	~b = $FF
	~s = port-kbd-state.value[6]
}

sound : speaker {
	~input = port-sys.value[6]
	mix = ay|covox|ts-ay1|ts-ay2
}

// Магнитофон: выход машины - бит 6 регистра 0177716, вход - бит 5
tape : taperecorder {
	encoding = bk
	baudrate = _9464
	files = "Файлы БК (*.bin *.cod *.foc *.asc);;Все файлы (*.*)"
	~input = port-sys.value[6]
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[000000-037777] = ram
	@memory[040000-077777] = vram
	// Плата первой: по каждому адресу окна она сама решает, ответить,
	// оставить адрес монитору и регистрам или не ответить никому
	@memory[100000-177777] = smk {routed = 1}

	// Запись в ПЗУ остается без ответа, как на настоящей БК
	@memory[100000-117777] = monitor {mode = r, strict = 1}

	@memory[177130-177133] = fdc
	@memory[177740-177757] = hdd

	@memory[177660-177661] = port-kbd-state
	@memory[177662-177663] = port-kbd-code {mode = r, strict = 1}
	@memory[177664-177665] = port-scroll
	@memory[177700-177701] = port-177700
	@memory[177702-177703] = port-177702
	@memory[177704-177705] = port-177704
	@memory[177706-177713] = timer
	@memory[177714-177715] = ay {mode = w, through = 1}
	@memory[177714-177715] = ts-ay1 {mode = w, through = 1}
	@memory[177714-177715] = ts-ay2 {mode = w, through = 1}
	@memory[177714-177715] = port-ppi-out {mode = w}
	@memory[177714-177715] = port-ppi {mode = r}
	@memory[177716-177717] = port-sys {mode = w}
	@memory[177716-177717] = port-sys-rd {mode = r}
}
