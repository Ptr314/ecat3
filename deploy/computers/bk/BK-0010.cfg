system {
	type = bk
	name = БК
	version = БК0010 (Фокал)
	charmap = koi8
	files = "Файлы БК (*.bin *.cod *.foc);;Все файлы (*.*)"
}

cpu : 1801vm1 {
	clock = 3000000
	start_address = $8000
	halt_vector = $04
	~virq = !kbd-ready.out[0]
	~vector = kbd-vector.out
}

ram : ram {
	size = 16k
}

vram : ram {
	size = 16k
}

monitor : rom {
	size = 8k
	image = MONIT10.ROM
}

focal : rom {
	size = 8k
	image = Focal.rom
}

tests : rom {
	size = 8k
	image = Tests.rom
}

port-kbd-state : port {
	size = 16
	~data[7] = kbd-ready.out[0]
}

port-kbd-code : port {
	size = 16
}

port-scroll : port {
	size = 16
	default = $2D8
}

port-177700 : port {
	size = 16
	default = $FFE0
	mask = 0
}

port-177702 : port {
	size = 16
	default = $FFFF
	mask = 0
}

port-177704 : port {
	size = 16
	default = $FF20
	mask = 0
}

port-timer-init : port {
	size = 16
}

port-timer-count : port {
	size = 16
}

port-timer-csr : port {
	size = 16
}

port-ppi : port {
	size = 16
}

port-sys : port {
	size = 16
	default = $8000
}

display : bk-display {
	vram = vram
	scroll = port-scroll
	mode = color
}

keyboard : map-keyboard {
	map = bk.map
	port-value = port-kbd-code
	ruslat = caps
}

kbd-ready : register {
	~s = keyboard.ready
	~r = port-kbd-code.access
}

kbd-vector : register {
	type = buffer
	default = $30
	~in = 0
}

sound : speaker {
	~input = port-sys.value[6]
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[$0000-$3FFF] = ram
	@memory[$4000-$7FFF] = vram
	@memory[$8000-$9FFF] = monitor {mode = r}
	@memory[$A000-$BFFF] = focal {mode = r}
	@memory[$C000-$FEFF] = tests {mode = r}

	@memory[$FFB0-$FFB1] = port-kbd-state
	@memory[$FFB2-$FFB3] = port-kbd-code
	@memory[$FFB4-$FFB5] = port-scroll
	@memory[$FFC0-$FFC1] = port-177700
	@memory[$FFC2-$FFC3] = port-177702
	@memory[$FFC4-$FFC5] = port-177704
	@memory[$FFC6-$FFC7] = port-timer-init
	@memory[$FFC8-$FFC9] = port-timer-count
	@memory[$FFCA-$FFCB] = port-timer-csr
	@memory[$FFCC-$FFCD] = port-ppi
	@memory[$FFCE-$FFCF] = port-sys
}
