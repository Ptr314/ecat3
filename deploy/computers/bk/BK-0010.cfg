system {
	type = bk
	name = БК
	version = БК0010 (Фокал)
	charmap = koi8
	files = "Файлы БК (*.bin *.cod *.foc);;Все файлы (*.*)"
}

cpu : 1801vm1 {
	clock = 3000000
	start_address = $8000
	halt_vector = $04
	~virq = !kbd-ready.out[0]
	~vector = kbd-vector.out
}

ram : ram {
	size = 16k
}

vram : ram {
	size = 16k
}

monitor : rom {
	size = 8k
	image = MONIT10.ROM
}

focal : rom {
	size = 8k
	image = Focal.rom
}

tests : rom {
	size = 8k
	image = Tests.rom
}

port-kbd-state : port {
	size = 16
	~data[7] = kbd-ready.out[0]
}

port-kbd-code : port {
	size = 16
}

port-scroll : port {
	size = 16
	default = $2D8
}

port-177700 : port {
	size = 16
	default = $FFE0
	mask = 0
}

port-177702 : port {
	size = 16
	default = $FFFF
	mask = 0
}

port-177704 : port {
	size = 16
	default = $FF20
	mask = 0
}

// 0177706-0177712 - таймер
timer : bk-timer {
	divider = 128
}

port-ppi : port {
	size = 16
	~data[0-7] = joystick.out[0-7]
}

// Стандартный джойстик БК на входных линиях порта 0177714: вверх 1, вправо 2,
// вниз 4, влево 010, кнопка A 020, огонь 040, дополнительный огонь 0100,
// кнопка B 0200. Нажатый контакт читается единицей. Клавиши хоста заданы
// в bk-joystick.map: стрелки, End, Home, PgUp и PgDn.
joystick : joystick {
	map = bk-joystick.map
}

// Музыкальный сопроцессор AY-3-8910 на выходных линиях порта 0177714, как в
// распространенных приставках к БК: запись слова в порт выбирает регистр,
// запись байта по адресу 0177714 записывает в него данные. Линии порта
// инвертирующие, поэтому в порт кладется дополнение номера и данных до 0377.
// Микросхема тактируется частотой 12 МГц / 7.
ay : ay8910 {
	bus = bk
}

port-sys : port {
	size = 16
	default = $8000
	~data[5] = tape.output
}

display : bk-display {
	vram = vram
	scroll = port-scroll
	mode = color
}

keyboard : map-keyboard {
	map = bk.map
	port-value = port-kbd-code
	ruslat = caps
}

kbd-ready : register {
	~s = keyboard.ready
	~r = port-kbd-code.access
}

kbd-vector : register {
	type = buffer
	default = $30
	~in = 0
}

sound : speaker {
	~input = port-sys.value[6]
	mix = ay
}

// Магнитофон: выход машины - бит 6 регистра 0177716, вход - бит 5
tape : taperecorder {
	ecoding = bk
	baudrate = 9464
	files = "Файлы БК (*.bin *.cod *.foc *.asc);;Все файлы (*.*)"
	~input = port-sys.value[6]
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[$0000-$3FFF] = ram
	@memory[$4000-$7FFF] = vram
	@memory[$8000-$9FFF] = monitor {mode = r}
	@memory[$A000-$BFFF] = focal {mode = r}
	@memory[$C000-$FEFF] = tests {mode = r}

	@memory[$FFB0-$FFB1] = port-kbd-state
	@memory[$FFB2-$FFB3] = port-kbd-code {mode = r, strict = 1}
	@memory[$FFB4-$FFB5] = port-scroll
	@memory[$FFC0-$FFC1] = port-177700
	@memory[$FFC2-$FFC3] = port-177702
	@memory[$FFC4-$FFC5] = port-177704
	@memory[$FFC6-$FFCB] = timer
	@memory[$FFCC-$FFCD] = ay {mode = w}
	@memory[$FFCC-$FFCD] = port-ppi {mode = r}
	@memory[$FFCE-$FFCF] = port-sys
}
