// Числа без префикса в этом файле восьмеричные, как принято для БК
system {
	radix = 8
	type = bk
	name = БК
	version = БК0011М (Бейсик)
	charmap = koi8
	files = "Файлы БК (*.bin *.cod);;Все файлы (*.*)"
}

// К1801ВМ1 стартует прямо с начального адреса 0140000, где начинается БОС.
// Клавиша СТОП и команда HALT передают управление через вектор 004,
// кадровое прерывание от контроллера экрана - через вектор 0100 (вход ~irq2).
cpu : 1801vm1 {
	clock = _4000000
	start_address = 140000
	halt_vector = 4
	// Ответ памяти приходит через 4 периода такта (у БК0010 на 3 МГц - через 2):
	// ОЗУ обслуживает контроллер экрана, и на 4 МГц процессор ждет его дольше.
	// Подобрано по демо INSULT: обработчик кадра укладывается в кадр, а смена
	// палитры посреди кадра проходит между персонажем и бегущей строкой.
	reply_delay = _4
	~halt = !keyboard.stop
	~virq = kbd-irq.out[0]
	~vector = keyboard.vector
	~irq2 = !frame-irq.out[0]
}

// Кадровое прерывание: кадровый синхроимпульс контроллера экрана (21-я служебная
// строка, за 43 строки до первой видимой), раз в 20,48 мс (48,8 Гц). Запрещается
// битом 14 регистра 0177662. Раньше его давал отдельный генератор 50 Гц, не
// связанный с разверткой, и программы, меняющие палитру по ходу кадра (демо
// INSULT), мигали.
frame-irq : mux {
	~a[0] = display.frame
	~b = 0
	~s = port-palette.value[14]
}

// ОЗУ 128 КБ: восемь страниц по 16 КБ. Страница 0 постоянно занимает адреса
// 0000000-0037777, страницы 5 и 6 являются экранными, остальные подключаются
// в окна через регистр 0177716.
ram0 : ram {
	size = _16k
}

ram1 : ram {
	size = _16k
}

ram2 : ram {
	size = _16k
}

ram3 : ram {
	size = _16k
}

ram4 : ram {
	size = _16k
}

ram5 : ram {
	size = _16k
}

ram6 : ram {
	size = _16k
}

ram7 : ram {
	size = _16k
}

// Номер страницы в регистре 0177716 не совпадает с номером самой страницы ОЗУ:
// разряды номера разведены на кристаллы в другом порядке. Соответствие
// 0->1, 1->5, 2->2, 3->3, 4->4, 5->7, 6->0, 7->6 задается порядком @page.

// Окно 0040000-0077777, номер страницы - разряды 12-14 регистра 0177716
win0 : page-mapper {
	@page[0] = ram1
	@page[1] = ram5
	@page[2] = ram2
	@page[3] = ram3
	@page[4] = ram4
	@page[5] = ram7
	@page[6] = ram0
	@page[7] = ram6
	~page = port-sys.alt[12-14]
}

// Окно 0100000-0137777, номер страницы - разряды 8-10 регистра 0177716.
// Работает, только когда в это окно не включено ПЗУ.
win1 : page-mapper {
	@page[0] = ram1
	@page[1] = ram5
	@page[2] = ram2
	@page[3] = ram3
	@page[4] = ram4
	@page[5] = ram7
	@page[6] = ram0
	@page[7] = ram6
	~page = port-sys.alt[8-10]
}

// ПЗУ БОС, постоянно занимает адреса 0140000-0157777
bos : rom {
	size = _8k
	image = B11M_BOS.ROM
}

// ПЗУ, подключаемые в окно 0100000-0137777
basic1 : rom {
	size = _16k
	image = BAS11M_0.ROM
}

basic2 : rom {
	size = _8k
	image = BAS11M_1.ROM
}

ext : rom {
	size = _8k
	image = B11M_EXT.ROM
}

// Регистры ввода-вывода. Разрядность 16 бит, обращения выполняются словами.

// 0177660 - состояние клавиатуры. Бит 7 - готовность кода, он только читается:
// ПЗУ обнуляет этот регистр после каждой клавиши, и если бы запись доходила до
// разряда готовности, код терялся бы. Программно доступен только бит 6 -
// маска прерывания от клавиатуры.
port-kbd-state : port {
	size = _16
	mask = 100
	~data[7] = kbd-ready.out[0]
}

// 0177662 при чтении - код нажатой клавиши, чтение сбрасывает готовность
port-kbd-code : port {
	size = _16
}

// 0177662 при записи - управление изображением:
//   разряды 8-11 - номер палитры, разряд 14 - запрет кадрового прерывания,
//   разряд 15 - номер экранной страницы (0 - страница 5, 1 - страница 6)
port-palette : port {
	size = _16
	default = 47400
}

// 0177664 - регистр управления скроллингом, 0330 соответствует несдвинутому экрану
port-scroll : port {
	size = _16
	default = 1330
}

// 0177700, 0177702, 0177704 - регистры с постоянными значениями
port-177700 : port {
	size = _16
	default = 177740
	mask = 0
}

port-177702 : port {
	size = _16
	default = 177777
	mask = 0
}

port-177704 : port {
	size = _16
	default = 177440
	mask = 0
}

// 0177706-0177712 - таймер, при 4 МГц частота счета составляет 31250 Гц
timer : bk-timer {
	divider = _128
}

// 0177714 - параллельный порт
port-ppi : port {
	size = _16
	~data[0-7] = joystick.out[0-7]
	~data[0-7] = mouse.out[0-7]
}

// 0177714 при записи - выходной регистр порта. Запись приходит и в AY, и сюда;
// его младший байт - вход Covox
port-ppi-out : port {
	size = _16
}

// Стандартный джойстик БК на входных линиях порта 0177714: вверх 1, вправо 2,
// вниз 4, влево 010, кнопка A 020, огонь 040, дополнительный огонь 0100,
// кнопка B 0200. Нажатый контакт читается единицей. Клавиши хоста заданы
// в bk-joystick.map: стрелки, End, Home, PgUp и PgDn.
joystick : joystick {
	map = bk-joystick.map
}

// Мышь УВК-01 «Марсианка» на тех же входных линиях: вверх 1, вправо 2, вниз 4,
// влево 010 - триггеры направлений, которые держатся до сброса; кнопка «Л» 040,
// кнопка «П» 0100. Сброс - разряд 3 выходного регистра порта: пока он нулевой,
// триггеры сброшены, поэтому программа пишет в порт 0, а за ним 010.
mouse : mouse {
	~reset = !port-ppi-out.value[3]
	// Строб чтения порта: сброшенный непрочитанным шаг мышь повторит
	~read = port-ppi.access
}

// Разъем УП: джойстик и мышь занимают одни и те же линии, поэтому подключено
// одно устройство или ни одного. По умолчанию разъем пуст, и стрелки хоста
// работают только как клавиатура; выбор меняется на панели инструментов.
up : connector {
	devices = joystick|mouse
	default = none
	icon = joystick.png
}

// Музыкальный сопроцессор AY-3-8910 на выходных линиях порта 0177714, как в
// распространенных приставках к БК: запись слова в порт выбирает регистр,
// запись байта по адресу 0177714 записывает в него данные. Линии порта
// инвертирующие, поэтому в порт кладется дополнение номера и данных до 0377.
// Микросхема тактируется частотой 12 МГц / 7.
ay : ay8910 {
	bus = bk
}

// Covox - восьмиразрядный ЦАП на выходных линиях того же порта: уровень на
// выходе равен младшему байту выходного регистра, без инверсии. Частоту
// выборки задает сама программа тем, как часто пишет в порт.
covox : covox {
	~input = port-ppi-out.value[0-7]
}

// Звуковая приставка на порту 0177714: AY-3-8910, Covox или ничего. Место под
// приставку одно: программа для Covox выводит выборки байтами в тот же порт,
// и AY принял бы их за данные своих регистров (в демо TDR - за форму огибающей,
// вместо музыки выходил шум). Выбор - списком на панели инструментов.
sound-card : connector {
	devices = ay|covox
	default = ay
	kind = sound
	icon = sound.png
}

// 0177716 - системный регистр. За одним адресом стоят три независимых регистра.
// При записи разряд 11 значения выбирает, в какой из двух она попадет:
//   0 - магнитофон и звук, бит 6 - выход на них обоих;
//   1 - управление памятью: разряды 0-4 - ПЗУ в окне 0100000,
//       8-10 и 12-14 - номера страниц ОЗУ в окнах.
port-sys : port {
	size = _16
	alt_bit = _11
	alt_default = 2
}

// Третий регистр отдается при чтении: бит 5 - вход с магнитофона,
// бит 6 - признак нажатой клавиши (активный уровень - ноль), биты 14-15 всегда
// единичны. Записанное в 0177716 здесь не появляется, как и на реальной машине.
port-sys-rd : port {
	size = _16
	default = 140300
	~data[5] = tape.output
	~data[6] = !keyboard.pressed
}

// Контроллер экрана К1801ВП1-037 рисует по развертке: кадр из 320 строк по 64 мкс,
// 256 видимых и 64 служебные. Палитра и экранная страница берутся в момент, когда
// луч проходит строку, регистр 0177664 - один раз за кадр, в служебных строках.
display : bk-display {
	vram = ram5
	vram2 = ram6
	scroll = port-scroll
	control = port-palette
	mode = color
}

keyboard : map-keyboard {
	map = bk.map
	keys = bk.keys
	picture = bk_keyboard.svg
	port-value = port-kbd-code
	// Контроллер отдает процессору один из двух векторов: код, набранный с АР2,
	// и управляющие коды 0-2, 4-7, 11, 13, 21 при любых модификаторах идут
	// через 274, и восьмибитный код из этой пары делает ПЗУ
	vector = 60
	alt-vector = 274
	alt-codes = "0,1,2,4,5,6,7,11,13,21"
	ruslat = caps
	// Caps Lock хоста шлет машине коды РУС и ЛАТ, как одноименные клавиши
	rusmode = code
	rus_switches = $0E/$0F
	// Буквы с клавиатуры компьютера подчиняются защелкам ЗАГЛ/СТР и регистру РУС,
	// как клавиши экранной клавиатуры
	case-latch = 1
}

// Триггер готовности: взводится клавиатурой, сбрасывается чтением кода
kbd-ready : register {
	~s = keyboard.ready
	~r = port-kbd-code.access
}

// Запрос прерывания от клавиатуры: готовность кода, пока разряд 6 регистра
// 0177660 нулевой. Единица в нем прерывание запрещает, и программа опрашивает
// разряд 7 сама (демо INSULT ждет пробела так); без маски код забирал
// обработчик ПЗУ по вектору 060, и программа нажатия не видела.
kbd-irq : mux {
	~a[0] = !kbd-ready.out[0]
	~b = $FF
	~s = port-kbd-state.value[6]
}

sound : speaker {
	~input = port-sys.value[6]
	mix = ay|covox
}

// Магнитофон: выход машины - бит 6 регистра 0177716, вход - бит 5.
// Единица скорости - полупериод короткого импульса данных. Замер вывода БОС
// по команде SAVE: вводная серия 437 тактов, импульс данных и разделитель 473,
// длинный импульс 953, маркер 1920. При 4 МГц это 8457 единиц в секунду.
// БК0011М пишет ленту примерно на 12% медленнее БК0010 (317 тактов при 3 МГц),
// но читаются кассеты в обе стороны: ПЗУ подстраивается по вводной серии.
tape : taperecorder {
	encoding = bk
	baudrate = _8457
	files = "Файлы БК (*.bin *.cod *.foc *.asc);;Все файлы (*.*)"
	~input = port-sys.value[6]
}

mapper : memory-mapper {
	portstomemory = 1

	// Диспетчеру памяти нужны только разряды 0-4 системного регистра,
	// выбирающие ПЗУ в окне 0100000
	~config[0-4] = port-sys.alt[0-4]

	@memory[000000-037777] = ram0
	@memory[040000-077777] = win0

	// Разряд 0 включает БЕЙСИК (16 КБ), разряд 1 - вторую часть БЕЙСИКа
	// и ПЗУ расширения, разряды 3 и 4 - отсутствующие здесь блок локальной
	// сети и внешнее ПЗУ, поэтому окно остается пустым
	@memory[1:1][100000-137777] = basic1 {mode = r}
	@memory[2:3][100000-117777] = basic2 {mode = r}
	@memory[2:3][120000-137777] = ext {mode = r}
	@memory[0:33][100000-137777] = win1

	@memory[140000-157777] = bos {mode = r}

	@memory[177660-177661] = port-kbd-state
	@memory[177662-177663] = port-palette {mode = w}
	@memory[177662-177663] = port-kbd-code {mode = r}
	@memory[177664-177665] = port-scroll
	@memory[177700-177701] = port-177700
	@memory[177702-177703] = port-177702
	@memory[177704-177705] = port-177704
	@memory[177706-177713] = timer
	@memory[177714-177715] = ay {mode = w, through = 1}
	@memory[177714-177715] = port-ppi-out {mode = w}
	@memory[177714-177715] = port-ppi {mode = r}
	@memory[177716-177717] = port-sys {mode = w}
	@memory[177716-177717] = port-sys-rd {mode = r}
}
