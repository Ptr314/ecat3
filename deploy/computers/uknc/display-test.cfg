// Отладочная конфигурация: дисплейный контроллер УК-НЦ.
//
// Видеоконтроллер обходит связный список построчных дескрипторов («таблицу
// строк») в плане 0 с адреса 0000270. Каждая строка называет адрес своих точек,
// а четырёхсловные дескрипторы по ходу луча меняют палитру, растяжку, яркость
// и курсор - поэтому у каждой строки могут быть свои восемь цветов и своя
// ширина.
//
// Точка - три бита, по одному из каждого плана, считанных по одному и тому же
// адресу: план 0 - младший разряд цвета, план 2 - старший, а разряд 0 байта -
// самая левая точка октета.
//
// Процессоры здесь команд не выполняют: таблицу строк и точки кладёт сценарий.

system {
	// Числа без префикса восьмеричные, как во всей документации К1801
	radix = 8
	type = uknc
	name = УК-НЦ
	version = Тест дисплея
	debug = 1
}

// Оба процессора крутят холостой цикл BR . : остановленный процессор не даёт
// ни эмулированного времени (а WAIT считает именно его), ни тактов своему
// домену - а видеоконтроллер тактуется от ПП
cpu : 1801vm2 {
	clock = _8000000
	start_address = 100000
}

// Дисплей тактуется от периферийного процессора: видеоконтроллер на его стороне
ppu : 1801vm2 {
	clock = _6250000
	start_address = 100000
	mapper = ppu-mapper
}

// 0000777 - BR на себя
loop : rom {
	data = {$FF,$01}
}

// Три плана по 64 КБ
plane0 : ram {
	size = _64k
	fill = 0
}

plane1 : ram {
	size = _64k
	fill = 0
}

plane2 : ram {
	size = _64k
	fill = 0
}

display : uknc-display {
	plane0 = plane0
	plane1 = plane1
	plane2 = plane2
	clock_source = ppu
}

// Клавиатура не эмулируется, но устройство с именем keyboard обязательно
keyboard : scan-keyboard {
	map = rk.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-077777] = plane1
	@memory[100000-100001] = loop {mode = r}
}

ppu-mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-077777] = plane0
	@memory[100000-100001] = loop {mode = r}
}
