// Отладочная конфигурация: каналы обмена между процессорами УК-НЦ.
//
// Общей памяти в машине нет, и всё, чем процессоры разговаривают, - это пять
// байтовых каналов с квитированием: три от центрального процессора к
// периферийному и два обратно. Канал 0 системное ПО использует как терминал
// (экраном и клавиатурой владеет ПП), канал 1 - как принтер, канал 2 - для
// команд и блочной передачи.
//
// Одно устройство включено в оба диспетчера с разными базами: стороны видят
// разные регистры по разным адресам.
//
// Процессоры здесь команд не выполняют, регистрами двигает сценарий.

system {
	// Числа без префикса восьмеричные, как во всей документации К1801
	radix = 8
	type = uknc
	name = УК-НЦ
	version = Тест каналов
	debug = 1
}

cpu : 1801vm2 {
	clock = _8000000
	start_address = 100000
	stopped = 1
	~virq = channels.cpu_virq
	~vector = channels.cpu_vector
}

ppu : 1801vm2 {
	clock = _6250000
	start_address = 100000
	mapper = ppu-mapper
	stopped = 1
	~virq = channels.ppu_virq
	~vector = channels.ppu_vector
}

// Каналы. Векторы по умолчанию те же, что у настоящей машины, поэтому
// в конфигурации о них ничего не сказано.
channels : uknc-channels {
}

ram : ram {
	size = _16k
	fill = 0
}

ppu-ram : ram {
	size = _16k
	fill = 0
}

display : bk-display {
	vram = ram
	mode = color
}

// Клавиатура не эмулируется, но устройство с именем keyboard обязательно
keyboard : scan-keyboard {
	map = rk.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-037777] = ram

	// Канал 0: приёмник 177560/177562, источник 177564/177566
	@memory[177560-177563] = channels
	@memory[177564-177567] = channels[4]

	// Канал 1: приёмник 176660/176662, источник 176664/176666
	@memory[176660-176663] = channels[10]
	@memory[176664-176667] = channels[14]

	// Канал 2 - только ЦП->ПП, источник 176674/176676
	@memory[176674-176677] = channels[20]
}

ppu-mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-037777] = ppu-ram

	// Приёмники: данные каналов 0, 1, 2 и общий регистр состояния 177066
	@memory[177060-177067] = channels[24]

	// Источники: данные каналов 0 и 1 и общий регистр состояния 177076
	@memory[177070-177077] = channels[34]
}
