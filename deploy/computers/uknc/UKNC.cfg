// Числа без префикса в этом файле восьмеричные, как во всей документации К1801
system {
	radix = 8
	charmap = koi8
	type = uknc
	name = УК-НЦ
	version = УК-НЦ (HDD, AY)
	debug = 0
}

// Два КМ1801ВМ2. Машина стартует с ПЗУ периферийного процессора, и центральный
// поднимает именно он: ПЗУ стоит только на стороне ПП.
//
// Центральный процессор. ПЗУ у него нет вовсе: пультовый монитор ему
// перекачивает в ОЗУ периферийный, а потом отпускает линии DCLO и ACLO
// разрядами 5 и 15 своего регистра 177716.
cpu : 1801vm2 {
	clock = _8000000
	// Время команд - по модели кристалла (tools/vm2-timing), ответ ОЗУ - от
	// cpu-mem: память динамическая, ее время подобрано по машинам с БМК
	// К1515ХМ1-031 и К1515ХМ2-001 (tools/uknc-timing). ПЗУ у ЦП нет, регистры отвечают сразу, кроме СА и
	// С2 (cpu-io)
	timing = vm2
	// Только для команд без шаблона (переходы через регистр, прерывания,
	// WAIT, RESET): они идут по старым формулам с этой задержкой ответа
	reply_delay = _5
	// Регистр SEL: вектор пуска и векторы пультового режима - от 160000.
	// Пультовый монитор, который перекачивает сюда ПП, работает командами
	// RUN, STEP, MFPC и прочими - они есть только в этом режиме
	sel = 160000
	~dclo = !pp-sys.value[5]
	~halt = !pp-sys.value[4]
	// Разряд 15 - авария сети: единица - питание в норме, линия снята; ноль
	// прижимает её (так и в UKNCBTL). Пуск ЦП - снятие линии, а её появление
	// при работающем процессоре - прерывание по вектору 024, как у
	// кристалла. Резидент винчестера в периферийном процессоре сообщает им об
	// окончании переноса: кладёт свой адрес в вектор 024 центрального,
	// дёргает линию (ноль, затем единица) и возвращает вектор на место
	~aclo = pp-sys.value[15]
	// Прерывания ЦП идут цепочкой: стык С2, сетевой адаптер, каналы обмена
	~virq = c2.virq
	~vector = c2.vector
	~irq2 = !evnt-cpu.out[0]
}

// Периферийный процессор: ему принадлежат экран, клавиатура, диски и печать
ppu : 1801vm2 {
	clock = _6250000
	// Как у центрального; ОЗУ (план 0) отвечает от ppu-mem, ПЗУ и регистры -
	// от ppu-io
	timing = vm2
	reply_delay = _5
	sel = 160000
	mapper = ppu-mapper
	~virq = pp-timer.virq
	~vector = pp-timer.vector
	~irq2 = !evnt-ppu.out[0]
}

// 192 КБ: три плана по 64 КБ. Видеоконтроллер читает из всех трёх по байту
// сразу - 24 разряда дают восемь точек, цвет точки это тройка разрядов.
plane0 : ram {
	size = _64k
	wait = ppu-mem
}

plane1 : ram {
	size = _64k
}

plane2 : ram {
	size = _64k
}

// Адресное пространство ЦП: слово - младший байт из плана 1, старший из
// плана 2, поэтому 64 КБ адресов стоят по 32 КБ каждого плана. Верхняя
// половина планов - экран, процессору она недоступна.
cpu-ram : plane-pair {
	low = plane1
	high = plane2
	size = _64k
	wait = cpu-mem
}

// Когда ОЗУ отвечает процессорам (timing = vm2). Машины выпускались с двумя
// версиями БМК (таймер, клавиатура и прочее): ранним К1515ХМ1-031 и
// доработанным К1515ХМ2-001, и память ПП на них отвечает по-разному.
// Схем нет, это модель, подобранная на модели кристалла ВМ2 по замерам машин
// литеры 7 с тем и другим (тесты Alex_K с UTEST.DSK; tools/uknc-timing): цикл
// памяти начинается в точке сетки памяти не раньше строба и не раньше
// конца прошлого цикла того же процессора, RPLY - через reply, память занята
// read / write наносекунд. Процессоры друг другу не мешают - замеры этого не
// показывают.
//
// ПП синхронен сетке памяти: с обоими БМК его времена кратны 4
// тактам, но с ХМ2-001 он читает на 4 такта быстрее, чем с ХМ1-031 (MOV R0,R1
// 16 против 20). Среднего у синхронного ПП не бывает, параметры - под
// К1515ХМ2-001 (его же версию показывает тест таймера TSTMR): MOV R0,R1
// 16 тактов, MOV (R0),R1 36, MOV R0,(R1) 36, INC (R1) 52, MOV (R0),(R1) 60,
// как на машине (таблицы ПП - 0.05 такта в среднем). План 0 восьмиразрядный:
// байт пишется одним обращением из двух, и BISB, MOVB в память на машине на 4
// такта короче BIS и MOV - reply_write_byte. Машина с ранним К1515ХМ1-031 -
// расширение UKNC-031.ext
ppu-mem : uknc-ram-timing {
	clock_source = ppu
	grid = _640
	setup = _320
	reply = _880
	reply_write = _880
	reply_write_byte = _240
	read = _1280
	write = _1600
	write_byte = _960
}

// ПЗУ и регистры ПП тоже отвечают через видеоконтроллер, не сразу: на машине
// MOV (R0),R1 из ПЗУ или регистра - 28 тактов, а не 24. Ожидание по
// умолчанию у ppu-mapper (через ppu-wait) - для всего, у чего нет своего wait.
// Такты за всех считает ppu-mem (time_from): сами эти устройства не тактируются
ppu-io : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _80
	read = _0
	write = _0
}

// Регистры ПП отвечают по-разному, и не по устройствам, а по адресам (PRDWR
// Alex_K, машина с К1515ХМ2-001; с К1515ХМ1-031 - UKNC-031.ext): чтение
// везде 28 тактов, запись 28, но в 177010, 177012 и раритетные 177030-177053
// - 36, в 177024 - 32. ПЗУ по 100000-137777 (первые две микросхемы) читается
// 32 такта, по 140000 - 28; дисковод 177130/177132 - 32. Классы ниже
// раскладывает по адресам ppu-wait; у ОЗУ свой wait
ppu-rom-low : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _240
	read = _0
	write = _0
}

// Каналы, таймер, клавиатура, прочие регистры не видеоконтроллера
ppu-regs : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _80
	read = _0
	write = _0
}

// Регистры видеоконтроллера 177014-177027 и 177054
ppu-vc : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _80
	read = _0
	write = _0
}

// 177024 - запись рисует октет
ppu-vc-draw : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _80
	reply_write = _400
	read = _0
	write = _0
}

// 177010 - запись адреса читает планы
ppu-vc-addr : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _80
	reply_write = _960
	read = _0
	write = _0
}

// 177012 (план 0) и раритетные 177030-177053 - запись идёт в видеоконтроллер
ppu-vc-slow : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _80
	reply_write = _960
	read = _0
	write = _0
}

// Дисковод 177130-177133: 32 такта на обеих машинах
ppu-fdc : uknc-ram-timing {
	time_from = ppu-mem
	clock_source = ppu
	grid = _160
	reply = _240
	reply_write = _160
	read = _0
	write = _0
}

ppu-wait : wait-map {
	default = ppu-io
	@wait[100000-137777] = ppu-rom-low
	@wait[177010-177011] = ppu-vc-addr
	@wait[177012-177013] = ppu-vc-slow
	@wait[177014-177023] = ppu-vc
	@wait[177024-177025] = ppu-vc-draw
	@wait[177026-177027] = ppu-vc
	@wait[177030-177053] = ppu-vc-slow
	@wait[177054-177055] = ppu-vc
	@wait[177130-177133] = ppu-fdc
	@wait[177000-177777] = ppu-regs
}

// ЦП: планы 1 и 2 рядом, слово - одно обращение. Свой кварц ЦП не связан с
// сеткой, и на машине фаза между ними плывёт: drift удлиняет сетку на 100
// миллионных, иначе цикл из одинаковых команд застревает в одной фазе. Здесь
// фаза усредняется, и цель - среднее двух машин (таблицы - 1.6-2 такта,
// однооперандные 0.7): MOV R0,R1 13.7 тактов (машины 13.7 и 11.9), MOV
// (R0),R1 32.0 (32.9, 32.5), MOV R0,(R1) 32.0 (35.2), INC (R1) 41.1 (40.9,
// 40.5), MOV (R0),(R1) 51.1 (54.2, 49.6)
cpu-mem : uknc-ram-timing {
	grid = _160
	drift = _100
	setup = _360
	reply = _240
	reply_write = _160
	read = _1520
	write = _1640
	rmw_write = _720
}

// Сетевой адаптер и стык С2 (176560-176577) отвечают ЦП медленнее прочих
// регистров: MOV (R0),R1 из них 30.7 такта против 25.6
cpu-io : uknc-ram-timing {
	time_from = cpu-mem
	grid = _320
	reply = _360
	read = _0
	write = _0
}

// Системное ПЗУ, четыре К1801РЕ2 по 8 КБ: 100000-176777 на шине ПП
rom : rom {
	size = _32k
	image = uknc_rom.bin
}

// Картриджи ПЗУ: до трёх банков по 8 КБ, которые по очереди появляются у ПП
// в окне 100000-117777. Банк выбирают разряды 1-2 регистра 177054, слот -
// разряд 3, и всё это только при снятом разряде 0 (системное ПЗУ в окне).
// Файл - банки подряд: 0-17777 первый, 20000-37777 второй, 40000-57777 третий.
//
// В первом слоте плата винчестера: её ПЗУ занимает нижнюю половину окна, а
// верхняя отдана регистрам контроллера (см. hdd). Во втором стоит звуковой
// модуль (см. asm-ay1), и он там остаётся: своего ПЗУ у модуля нет, окном
// 100000-117777 он не пользуется и разбирает только свои адреса в странице
// ввода-вывода. Поэтому окно второго слота свободно под картридж - например,
// под кассетный Бейсик. Вариант машины без винчестера и модуля -
// UKNC-basic.ext
//
// Образ каждого слота меняется в редакторе расширений: у ПЗУ для этого задан
// фильтр окна выбора файла (параметр files). Слот без образа отвечает
// байтом fill, как пустое гнездо.
//
// Загрузчики винчестера (ide_*.bin) занимают только нижнюю половину каждого
// банка, поэтому регистры контроллера им не мешают и в первом слоте они
// взаимозаменяемы. Бейсик занимает банк целиком - ему нужен второй слот
cart1 : rom {
	size = _24k
	image = ide_wdromv0110.bin
	files = "ПЗУ картриджей УК-НЦ (*.bin *.rom);;Все файлы (*.*)"
}

cart2 : rom {
	size = _24k
	files = "ПЗУ картриджей УК-НЦ (*.bin *.rom);;Все файлы (*.*)"
}

// Винчестер: плата ИДЕ в первой кассете ПЗУ, регистры в 110000-117777.
// Образ - файл на сотни мегабайт, с эмулятором он не возится, поэтому по
// умолчанию гнездо пустое: образ вставляют командой hdd.load("файл") или
// кладут рядом с дискетами, в software/uknc/hdd.img
hdd : uknc-hdd {
	title = WD
	clock_source = ppu
	image = hdd.img
	files = "Образы винчестера УК-НЦ (*.img *.hdd);;Все файлы (*.*)"
}

//------------------------- Обмен между процессорами ------------------------//

// Пять байтовых каналов: три ЦП->ПП и два обратно. Общей памяти нет,
// и это вместе с косвенным доступом - всё, чем процессоры разговаривают.
channels : uknc-channels {
	// Запрос канала однократный: процессор, взяв прерывание, снимает его
	// подтверждением. Иначе свободный передатчик предлагался бы снова после
	// любого чужого прерывания и воровал символы клавиатуры у меню
	~cpu_iako = cpu.iako
	~ppu_iako = ppu.iako
}

// Графический блок ПП, регистры 177010-177026: косвенный доступ ко всем трём
// планам (pp-indirect) и рисование октетами (pp-video). Через него ПП и
// достаёт память ЦП, и рисует - ПЗУ выводит текст именно записью в 177024.
//
// Косвенный доступ к планам. Регистр адреса хранит не адрес ЦП, а индекс
// байта в планах, а planes12 - планы 1 и 2 словами, по слову на два адреса:
// отсюда scale = 2. Через cpu-ram индекс делился бы на 2: запись по «адресу»
// 070075 портила слово ЦП 070074 - так ломался загруженный дисковый Бейсик,
// и SIN с COS уводили его на HALT.
//
// planes12 - те же планы, что cpu-ram, но на всю глубину: 128 КБ адресов
planes12 : plane-pair {
	low = plane1
	high = plane2
}

// ЦП: адрес 176640, данные 176642 - только планы 1 и 2. Плана 0
// центральный процессор не видит вовсе, отсюда у него только 4 цвета.
// Регистр данных - цикл той же памяти, что и cpu-ram, через тот же
// контроллер: MOV (R0),R1 из 176642 на машинах 32.2-32.9 такта, как из ОЗУ,
// а из 176640 - 25.6, как из прочих регистров (CRDWR1 Alex_K)
cpu-indirect : indirect-memory {
	@data[0] = planes12 {scale = 2, wait = cpu-mem}
}

// 176644 и 176646 на обеих машинах отвечают ЦП так же быстро, как 176640
// (25.6 такта), без тайм-аута. Что за ними, неизвестно: тест мерит только
// время. Здесь - заглушка, читается нулём, запись пропадает
cpu-17664x : port {
	size = _16
	mask = 0
}

// ПП: адрес 177010, данные 177012 - план 0 (байт), 177014 - планы 1 и 2.
// Через них ПП достаёт всю память машины, включая память ЦП
pp-indirect : indirect-memory {
	@data[0] = plane0 {width = 8}
	@data[1] = planes12 {scale = 2}
}

// Рисование октетами, 177016-177026, по адресу регистра 177010
pp-video : uknc-graphics {
	plane0 = plane0
	plane1 = plane1
	plane2 = plane2
	~address = pp-indirect.address
}

//------------------------------ Периферия ----------------------------------//

// 177054 - управление адресным пространством. Разряд 0 - ПЗУ в окне 0,
// разряды 1-2 - банк картриджа в окне 0, разряд 3 - слот картриджа,
// разряд 4 - ОЗУ вместо ПЗУ в окне 0, разряды 5-7 - ОЗУ вместе с ПЗУ в
// окнах 1-3, разряды 8 и 9 запрещают EVNT
// периферийному и центральному процессорам. После сброса 1401: везде ПЗУ,
// EVNT запрещён обоим.
pp-win : port {
	size = _16
	default = 1401
}

// 177030-177052 - регистры прототипа 1515ХМ1-032 (TSPSPD зовёт их регистрами
// палитры): по реверсу кристалла (Emuverse, «УКНЦ БМК») запись получает RPLY и
// никуда не идёт, на чтение никто не отвечает - ловушка 4. Палитра УК-НЦ живёт
// в четырёхсловных дескрипторах таблицы строк, а не здесь
pp-proto : port {
	size = _16
}

// Кадровое прерывание EVNT, вектор 100: кадровый импульс видеоконтроллера
// (312 строк по 64 мкс, 50,08 Гц), так что оно идёт в ногу с лучом. Приходит
// обоим процессорам, каждому со своим запретом в 177054.
evnt-ppu : mux {
	~a[0] = display.frame
	~b = 0
	~s = pp-win.value[8]
}

evnt-cpu : mux {
	~a[0] = display.frame
	~b = 0
	~s = pp-win.value[9]
}

// 177716 - системный регистр ПП. Разряд 4 - линия HALT центрального
// процессора, разряд 5 - DCLO, разряд 15 - ACLO: первая единица после
// включения питания пускает ЦП. Разряд 7 - динамик.
//
// Магнитофон - разряды 0-3. Разряд 1 - выход на ленту: ПЗУ пишет, переключая
// его из прерывания таймера по нулю (127734). Разряд 0 - вход с ленты, только
// чтение, в обратной полярности. Разряд 2 открывает вход: перепад на нём
// становится внешним событием таймера (177710, разряд 5, вектор 310), и
// обработчик ПЗУ (130570) читает из 177714 время, прошедшее с прошлого
// перепада, - по нему и отличаются нули от единиц. Разряды 2 и 3 ПЗУ ставит
// вместе на чтение и снимает на запись.
pp-sys : port {
	size = _16
	mask = 177776
	~data[0] = !tape-line.out[0]
}

// Магнитофон: пишет разряд 1 регистра 177716, отдаёт звук с ленты
tape : taperecorder {
	clock_source = ppu
	encoding = uknc
	files = "Файлы магнитофона УК-НЦ (*.uknc.tap);;Все файлы (*.*)"
	~input = pp-sys.value[1]
}

// Вход с ленты. Заводской тест («Тест магнитофона (ЗАГЛ.)») ждёт заглушку,
// замыкающую выход на вход: COMMAND tape-plug.set(0,1) её вставляет, и
// перепады разряда 1 возвращаются машине, минуя магнитофон
tape-plug : port {
	size = _1
}

tape-line : mux {
	~a[0] = tape.output
	~b[0] = pp-sys.value[1]
	~s = tape-plug.value[0]
}

// 176670-176673 - место приёмника канала 2, которого у машины нет: канал
// односторонний, только ЦП -> ПП. Дешифратор блока каналов отвечает на эти
// адреса нулями, и это не мелочь: драйвер винчестера записан с адресом
// регистров 176670, а загрузчик RT-11 проверяет его существование чтением.
// Без ответа приходит таймаут магистрали, и загрузка кончается сообщением
// «?BOOT-U-Conflicting SYSGEN options»
cpu-chan2-rx : port {
	size = _16
	constant_return = 0
}

// Сетевой адаптер СА (176560-176566) - адаптер сети КУВТ «УКНЦ Micronet».
// Регистры те же, что у С2, векторы 360 и 364, скорость 57600; в старших
// разрядах регистров виден номер станции (0-63, COMMAND sa.station(n)).
// Пункт 3 меню ЗАГРУЗКА грузит по нему машину со станции преподавателя
// (FTSUK.SAV под RT-11) по своему протоколу. Линия, как и у С2, выходит на
// порт хоста: параметр port или COMMAND sa.connect("COM7"); host_port = 1
// показывает выбор порта в редакторе конфигурации
sa : dl11 {
	title = Сетевой адаптер
	host_port = 1
	wait = cpu-io
	baud = _57600
	rx_vector = 360
	tx_vector = 364
	station = 0
	rcsr_mask = 104
	// Чтение XBUF даёт 0360 - его проверяет заводской тест СА
	xbuf_read = 360
	~iako = cpu.iako
	~init = cpu.init
	~virq_in = channels.cpu_virq
	~vector_in = channels.cpu_vector
}

// Стык С2 (176570-176576): последовательный порт, регистры как у DL11,
// векторы 370 и 374. Пункт 4 меню ЗАГРУЗКА посылает в линию @ и принимает в
// ОЗУ ЦП с адреса 0 блок из 512 байт, первое слово которого 000240, - так
// грузит RT-11 сервер HX (OpenHX). Линия выходит на порт хоста: параметр
// port (COM5, /dev/ttyUSB0) или COMMAND c2.connect("COM5"); без порта байты
// уходят в никуда. Скорость как у OpenHX по умолчанию
c2 : dl11 {
	title = Стык С2
	host_port = 1
	wait = cpu-io
	baud = _9600
	rx_vector = 370
	tx_vector = 374
	xbuf_read = 370
	~iako = cpu.iako
	~init = cpu.init
	~virq_in = sa.virq
	~vector_in = sa.vector
}

// Клавиатура МС7007. Контроллер отдаёт не символ, а номер клавиши, причём
// на оба фронта: при отпускании - разряд 7 и младшая тетрада номера (НР 105
// отпускается кодом 205, иначе ПЗУ его не узнаёт). Перекодировкой занимается
// ПЗУ машины, поэтому регистровые клавиши (НР, УПР, ГРАФ, АЛФ, ФИКС) - это
// обычные клавиши со своими номерами.
//
// Экранной клавиатуры пока нет: рисунок МС7007 не готов, работает только
// клавиатура хоста.
// Прерывания трёх источников сходятся на единственный вход процессора,
// поэтому они соединены цепочкой: каналы -> клавиатура -> таймер -> ПП.
// Свой запрос устройство выставляет вперёд чужого, так что ближе к
// процессору - старше. Порядок - по реверсу ХМ2-001 (docs-external/UKNC/
// BMK_texts, «векторные прерывания VIRQ»), где клавиатура и таймер в одном
// кристалле: 310 (событие на входе с ленты), 304 (обнуление таймера), 300
// (клавиатура). Для 1515ХМ1-031 литеры 7 он не проверен. Каналы - за ними
keyboard : uknc-keyboard {
	// Коды машине отдаются из тактов ПП по одному, когда прочитан предыдущий
	clock_source = ppu
	map = uknc.map
	keys = uknc.keys
	picture = ms7007_keyboard.svg
	// Столбцы матрицы: клавиша хоста, нажатая при удерживаемой клавише того
	// же столбца, машине не уходит - как на настоящей клавиатуре
	groups = ms7007.grp
	// РУС/ЛАТ здесь не при чём: алфавит переключает сама машина клавишей
	// АЛФ и командами УПР+N / УПР+O, а хост всегда отдаёт номер клавиши
	use_remap = 0
	port-value = pp-kbd-code
	vector = 300
	~irq_enable = pp-kbd-state.value[6]
	~read = pp-kbd-code.access
	~virq_in = channels.ppu_virq
	~vector_in = channels.ppu_vector
}

// 177702 - код клавиши. Чтение снимает готовность
pp-kbd-code : port {
	size = _16
}

// 177700 - состояние. Разряд 6 разрешает прерывание и доступен программе,
// разряд 7 - готовность, её держит контроллер до чтения регистра кода.
//
// Разряд 6 здесь именно РАЗРЕШАЕТ прерывание, а не запрещает, как
// одноимённый разряд 0177660 у БК: ПЗУ пишет `MOV #100,@#177700` с
// комментарием «Разрешить прерывания от клавиатуры» и `CLR @#177700`,
// чтобы их запретить
pp-kbd-state : port {
	size = _16
	mask = 100
	~data[7] = keyboard.ready
}

// Мышь (github.com/Ptr314/ecat3/issues/62): слово 177400 - смещения с
// прошлого чтения, X в разрядах 1-7 (вправо), Y в 9-15 (вверх), правая
// кнопка - разряд 0, левая - 8. Включена с пуска, указатель захватывается
// щелчком, только когда программа уже прочла регистр. Кнопка на панели её
// выключает: тогда 177400 остаётся без ответа, как на машине без неё
mouse : uknc-mouse {
	mapper = ppu-mapper
	plugged = 1
	icon = mouse.png
}

// Программируемый таймер 177710-177714: 12-разрядный счётчик на вычитание
// с периодом 2, 4, 8 или 16 мкс. Он ближе всех к процессору в цепочке
// прерываний (см. keyboard): свой запрос выставляет вперёд, а запросы
// клавиатуры и каналов пропускает дальше
pp-timer : uknc-timer {
	clock_source = ppu
	~virq_in = keyboard.virq
	~vector_in = keyboard.vector
	// Внешнее событие - перепад на входе с ленты при разряде 2 регистра 177716
	~event = tape-line.out[0]
	~event_enable = pp-sys.value[2]
}

// Звук: разряд 7 регистра 177716 - линия динамика, разряды 8-12 - сетка
// частот 60 Гц - 8 кГц, собранная по «И». Сетка - это отводы счётчика
// программируемого таймера, а не отдельный делитель, поэтому уставка в 177712
// двигает её всю: так машина и играет мелодии. Звук на стороне ПП, поэтому и
// тактуется устройство частотой ПП.
//
// Стоит после таймера нарочно: устройства домена тактуются в порядке
// объявления, а динамик усредняет уровень по тому, что счётчик прошёл за
// отрезок. Объявленный раньше, он усредняет отрезок предыдущей команды - на
// такт назад, - и в паузах мелодии это слышно.
// Имя sound - по нему окно эмулятора находит громкость
sound : uknc-sound {
	clock_source = ppu
	timer = pp-timer
	~input = pp-sys.value[7-12]
	mix = covox|asm-ay1|asm-ay2|asm-ay3|asm-dac
	// Громкость в миксе делится поровну между звучащими источниками, поэтому
	// источник занимает свою долю только с тех пор, как зазвучал после сброса:
	// иначе молчащий звуковой модуль вчетверо приглушал бы динамик
	idle_share = 0
}

// Параллельный порт (принтер), 177100-177103: К580ВВ55. Порт A (177100) -
// восемь выходных линий данных, порт B (177101) - состояние принтера, порт C
// (177102) - стробы, 177103 - управляющее слово. Самого принтера нет, но порт
// отвечать обязан: ПЗУ щупает его при выводе на печать, и без ответа выходил
// таймаут магистрали
pp-printer : i8255 {
	// Порт машины разведён жёстко: порт A (данные) на вывод, порт B (линии
	// состояния принтера) на ввод, старшая тетрада C на вывод, младшая на ввод. Ни ПЗУ, ни программы
	// управляющего слова сюда не пишут - проигрыватель Bad Apple пишет в
	// 177103 только команду установки разряда порта C, - а без него отдельная
	// ВВ55 осталась бы на вводе и ЦАП ничего бы не услышал
	control = $83
	~B = printer-line.out
	~CL = printer-c-line.out
}

// Заглушка на разъёме принтера: линии данных замкнуты на линии состояния.
// Её ждёт заводской «Тест ПЕЧАТЬ (заглушка)» - он пишет в порт A бегущий ноль
// и читает то же самое из порта B. COMMAND printer-plug.set(0,1) её вставляет
printer-plug : port {
	size = _1
}

printer-line : mux {
	// Прочие линии состояния принтер не ведёт
	~a = 0
	~a[1] = printer.online
	~a[7] = printer.busy
	~b = pp-printer.A
	~s = printer-plug.value[0]
}

printer-c-line : mux {
	~a = 0
	~b = pp-printer.CH
	~s = printer-plug.value[0]
}

// Принтер на разъёме: данные - порт A как записан, строб - PC7 (активный
// 0), подтверждение - PB7, «на линии» - PB1 (так их понимает UKNCBTL).
// Подтверждение здесь - занятость принтера: встаёт по стробу, снимается,
// когда байт напечатан. Принятое видно в окне «Порты ввода-вывода».
// Стоит на разъёме lpt вместо Covox: COMMAND lpt.plug(printer)
printer : printer {
	title = Принтер
	~data = pp-printer.A
	~strobe = !pp-printer.CH[3]
}

// Covox - восьмиразрядный ЦАП на выходных линиях порта A. Линии принтера
// инвертированы, поэтому уровень - дополнение того, что программа положила в
// порт (так же считает и UKNCBTL). Частоту выборки задаёт сама программа тем,
// как часто пишет в порт: демонстрация Bad Apple с винчестера играет так
// музыку, проверив сперва, что порт отвечает
covox : covox {
	~input = !pp-printer.A
}

// Разъём принтера: Covox, принтер или ничего. Выбор - списком на панели
// инструментов, как звуковая приставка у БК. По умолчанию Covox: подключённый
// принтер виден программам в линиях состояния (PB1, PB7)
lpt : connector {
	devices = covox|printer
	default = covox
	kind = sound
	icon = sound.png
	label = LPT
}

// Звуковой модуль Aberrant Sound Module (github.com/aberranthacker/
// aberrant_sound_module) во втором слоте кассет ПЗУ. Слот ему безразличен:
// окном 100000-117777 он не пользуется, а свои адреса 177360-177377 в
// странице ввода-вывода ПП разбирает сам. Три AY-3-8912 - 177360, 177362,
// 177364, ЦАП - 177372; YM3812 (177374) не сделан.
//
// Протокол как у приставки БК: запись слова выбирает регистр AY, запись
// байта кладёт в него данные. Инверсию магистрали снимают буферы модуля,
// поэтому программа пишет прямые значения. Чтение отдаёт 0, как в UKNCBTL.
// Генераторы тактует кварц 3,58 МГц через делитель на 2.
asm-ay1 : ay8910 {
	clock_source = ppu
	bus = word
	frequency = _1789772
}

asm-ay2 : ay8910 {
	clock_source = ppu
	bus = word
	frequency = _1789772
}

asm-ay3 : ay8910 {
	clock_source = ppu
	bus = word
	frequency = _1789772
}

// ЦАП модуля: регистр-защёлка на 177372, уровень - записанный байт без
// инверсии (её, как и у AY, снимают буферы)
asm-dac-reg : port {
	size = _8
}

asm-dac : covox {
	~input = asm-dac-reg.value
}

display : uknc-display {
	plane0 = plane0
	plane1 = plane1
	plane2 = plane2
	clock_source = ppu
	// Порядок выходов цвета, как у UKNCBTL по умолчанию: красный и зелёный
	// переставлены. Так служебные строки после теста графики красные, а не
	// зелёные, и ромбы идут синий, красный, малиновый, зелёный. Переключается
	// с панели инструментов
	colors = grb
}

//---------------------------- Адресные пространства ------------------------//

// Шина центрального процессора: 56 КБ ОЗУ и страница ввода-вывода.
// ПЗУ у ЦП нет.
mapper : memory-mapper {
	portstomemory = 1

	// Разряд 0 конфигурации - пультовый режим процессора
	~config[0] = cpu.halt_mode

	@memory[000000-157777] = cpu-ram

	// В пультовом режиме у процессора все 64 КБ - ОЗУ, страницы ввода-вывода
	// нет вовсе: именно оттуда он берёт вектор пуска по 160000 и там же лежит
	// перекачанный периферийным процессором пультовый монитор. В обычном
	// режиме верхние 8 КБ отданы регистрам, и обращение мимо них должно
	// оставаться без ответа - ПЗУ ищет устройства таймаутами магистрали.
	// Строка стоит раньше регистров: отвечает первый подходящий диапазон, и
	// за ней в пульте 176560-176577, 176640-176677 и 177560-177567 были
	// регистрами, а не памятью. Тест HALT Alex_K (CHLT) кладёт копии
	// пультовой команды на всю область 160000-177777, и выборка с 176560
	// читала регистр сетевого адаптера
	@memory[1:1][160000-177777] = cpu-ram[160000]

	@memory[176560-176567] = sa
	@memory[176570-176577] = c2

	// Косвенный доступ к планам 1 и 2
	@memory[176640-176643] = cpu-indirect
	@memory[176644-176645] = cpu-17664x
	@memory[176646-176647] = cpu-17664x

	// Каналы обмена
	@memory[176660-176663] = channels[10]
	@memory[176664-176667] = channels[14]
	@memory[176670-176673] = cpu-chan2-rx
	@memory[176674-176677] = channels[20]
	@memory[177560-177563] = channels
	@memory[177564-177567] = channels[4]
}

// Контроллер НГМД, 177130/177132. Тот же К1801ВП1-128 и те же адреса, что у
// БК, поэтому подходит bk-fdc как есть: контроллер отдаёт процессору дорожку
// словами, а поиск секторов и контроль делает ПЗУ машины.
//
// Он тут не украшение. ПЗУ щупает контроллер командой `TST @#177132`, и от
// ответа зависит весь ход загрузки: если контроллера нет, ПП передаёт ЦП
// ключ -1, и пультовый монитор уходит прямо на загрузку из сети, минуя меню
// ЗАГРУЗКА - а меню рисует ПП, и вместе с ним чистится экран. Без КНГМД
// машина показывает одну строку на неочищенном чёрном экране.
fdc : bk-fdc {
	clock_source = ppu
	drives = fdd0|fdd1
}

// 177704 - перемычки дисковода. ПЗУ читает его один раз: `BIT #10000,@#177704`
// с комментарием «Подключен 80-дорожечный дисковод?». Разряд 12 взведён -
// приводы у нас 80-дорожечные
fdc-jumpers : port {
	size = _16
	constant_return = 10000
}

// Приводы: 80 дорожек, две стороны, 10 секторов по 512 байт - 800 КБ.
// Столько же ПЗУ и ожидает: `MOV #12,R0 ; число секторов в дорожке`,
// формат сектора 512 байт.
//
// В оба привода вставлены дискеты, и загрузочную выбирают в меню ЗАГРУЗКА:
// пункт 1 - диск, стрелка вправо, номер привода, ВК. В приводе 0 - FODOS с
// системными утилитами и заводским тестом, в приводе 1 - RT-11 с HELP и
// программой форматирования. Образы лежат в software/uknc, там же basic.dsk
fdd0 : fdd {
	title = MZ0
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 0
	image = sysimage.dsk
	// Дорожки целиком, как их пишет контроллер (К1801ВП1-128); .mfm и .hfe хранят
	// их без потерь, с метками удаления и нестандартной разметкой
	mode = mfm_ibm
	files = "Образы дискет УК-НЦ (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = fdc.select[0-1]
	~motor_on = fdc.motor_on
}

fdd1 : fdd {
	title = MZ1
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 1
	image = sys1002.dsk
	// Дорожки целиком, как их пишет контроллер (К1801ВП1-128); .mfm и .hfe хранят
	// их без потерь, с метками удаления и нестандартной разметкой
	mode = mfm_ibm
	files = "Образы дискет УК-НЦ (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = fdc.select[0-1]
	~motor_on = fdc.motor_on
}

// Шина периферийного процессора: план 0, системное ПЗУ и страница
// ввода-вывода. Отсюда машина и стартует.
ppu-mapper : memory-mapper {
	portstomemory = 1
	// ПЗУ и регистры - через видеоконтроллер (ppu-wait); у ОЗУ свой wait
	wait = ppu-wait
	~config[0-7] = pp-win.value[0-7]

	@memory[000000-077777] = plane0

	// Окно 0, 100000-117777, как в UKNCBTL: разряд 4 - ОЗУ, иначе разряд 0 -
	// системное ПЗУ, иначе разряды 1-3 - слот и банк картриджа. Банк 0 не
	// отвечает ни в одном слоте
	@memory[20:20][100000-117777] = plane0[100000]
	@memory[1:1][100000-117777] = rom {mode = r}

	// Первый слот - плата винчестера. Её ПЗУ видно в 100000-107777, а
	// 110000-117777 при любом банке занимают регистры контроллера: так же
	// делает и UKNCBTL, когда в слот вставлен образ. Верхние половины банков
	// этого ПЗУ пусты, поэтому и без образа ничего не теряется
	@memory[2:16][110000-117777] = hdd
	@memory[4:16][110000-117777] = hdd
	@memory[6:16][110000-117777] = hdd
	@memory[2:16][100000-117777] = cart1 {mode = r}
	@memory[4:16][100000-117777] = cart1[20000] {mode = r}
	@memory[6:16][100000-117777] = cart1[40000] {mode = r}

	// Второй слот - разряд 3 регистра 177054. Звуковой модуль остаётся на
	// своих адресах (177360-177372), а окно кассеты отвечает картриджем
	@memory[12:16][100000-117777] = cart2 {mode = r}
	@memory[14:16][100000-117777] = cart2[20000] {mode = r}
	@memory[16:16][100000-117777] = cart2[40000] {mode = r}

	// Окна 1-3, 120000-137777, 140000-157777 и 160000-176777. ПЗУ здесь не
	// отключается никогда, а разряды 5-7 подключают к нему ОЗУ плана 0: при
	// чтении отвечают оба, и шина видит их объединение по ИЛИ, запись же
	// попадает только в ОЗУ. Так описано в документации UKNCBTL (Memory-ru);
	// сам UKNCBTL проще - у него ОЗУ заменяет ПЗУ. Программа, которая держит
	// здесь данные, поэтому читает их только из тех мест, где ПЗУ даёт нули,
	// а байтовые команды и чтение-модификация-запись через окно портят ОЗУ.
	// Окна стоят перед ПЗУ и несут or_read сами: пока они выключены, чтение
	// сразу попадает в ПЗУ и не ищет по карте второго ответчика, а ПП
	// выполняет отсюда почти каждую свою команду
	@memory[40:40][120000-137777] = plane0[120000] {or_read = 1}
