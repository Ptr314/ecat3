// Отладочная конфигурация для проверки контроллера винчестера УК-НЦ.
// Образов ПЗУ не требует: машины здесь нет, регистры контроллера крутит
// сценарий, а процессор нужен только затем, чтобы шло эмулированное время -
// накопитель отвечает не мгновенно.
//
// На машине регистры контроллера стоят в верхней половине окна кассеты ПЗУ
// периферийного процессора, 110000-117777; здесь они лежат по тем же адресам,
// только окном никто не управляет.

system {
	// Числа без префикса восьмеричные, как во всей документации К1801
	radix = 8
	type = uknc
	name = УК-НЦ
	version = Тест винчестера
	debug = 1
}

// Процессор крутит на месте команду BR . , которую кладёт в память сценарий:
// эмулированное время должно идти, иначе не дождаться конца чтения сектора
cpu : 1801vm2 {
	clock = _6250000
	start_address = 1000
}

ram : ram {
	size = _64k
	fill = 0
}

// Контроллер ИДЕ. Образ вставляет сценарий: файл с эмулятором не возится
hdd : uknc-hdd {
	files = "Образы винчестера УК-НЦ (*.img *.hdd);;Все файлы (*.*)"
}

// Экран и клавиатура не проверяются, но устройства с такими именами нужны
display : bk-display {
	vram = ram
	mode = color
}

keyboard : scan-keyboard {
	map = rk.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

mapper : memory-mapper {
	portstomemory = 1

	@memory[000000-107777] = ram
	@memory[110000-117777] = hdd
	@memory[120000-177777] = ram[120000]
}
