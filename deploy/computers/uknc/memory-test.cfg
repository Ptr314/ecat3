// Отладочная конфигурация для проверки памяти УК-НЦ. Образов ПЗУ не требует:
// всё, что нужно, пишется в память сценарием.
//
// Проверяются три вещи, на которых стоит вся память машины:
//   plane-pair       - адресное пространство ЦП поверх планов 1 и 2
//   indirect-memory  - косвенный доступ ПП ко всем 192 КБ
//   or_read          - окно, где ПЗУ и ОЗУ отвечают одновременно
//
// Настоящей машины здесь нет: процессор стоит, всё делает сценарий.

system {
	// Числа без префикса восьмеричные, как во всей документации К1801
	radix = 8
	type = uknc
	name = УК-НЦ
	version = Тест памяти
	debug = 1
}

cpu : 1801vm2 {
	clock = _8000000
	start_address = 100000
	// Процессор в этой конфигурации не нужен: память проверяет сценарий
	stopped = 1
}

// Три плана по 64 КБ. Видеоконтроллер читает из всех трёх по байту сразу,
// поэтому память машины устроена именно так, а не одним куском.
plane0 : ram {
	size = _64k
	fill = 0
}

plane1 : ram {
	size = _64k
	fill = 0
}

plane2 : ram {
	size = _64k
	fill = 0
}

// Адресное пространство ЦП: слово - младший байт из плана 1, старший из
// плана 2. 64 КБ адресов стоят по 32 КБ каждого плана.
cpu-ram : plane-pair {
	low = plane1
	high = plane2
	// Разрядность шины ЦП: 64 КБ. Без этого устройство заняло бы всю
	// глубину планов - 128 КБ, чего 16-разрядный процессор не адресует
	size = _64k
}

// Косвенный доступ ПП: регистр адреса и два регистра данных. Первый смотрит
// в план 0, второй - в адресное пространство ЦП, то есть в планы 1 и 2.
// Так ПП достаёт всю память машины, включая память ЦП.
pp-indirect : indirect-memory {
	@data[0] = plane0
	@data[1] = cpu-ram
}

// ПЗУ окна: отвечает вместе с ОЗУ, результаты объединяются по ИЛИ
win-rom : rom {
	size = _1k
	data = {$0F,$F0,$00,$00}
}

win-ram : ram {
	size = _1k
	fill = 0
}

display : bk-display {
	vram = plane0
	mode = color
}

// Клавиатура не эмулируется, но устройство с именем keyboard обязательно
keyboard : scan-keyboard {
	map = rk.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

mapper : memory-mapper {
	portstomemory = 1

	// Память ЦП: 56 КБ, дальше страница ввода-вывода
	@memory[000000-157777] = cpu-ram

	// Окно с квирком: ПЗУ отдаёт данные и передаёт чтение дальше, ОЗУ
	// отдаёт свои, шина видит ИЛИ. Запись доходит только до ОЗУ, потому
	// что диапазон ПЗУ объявлен только на чтение.
	@memory[160000-161777] = win-rom {mode = r, or_read = 1}
	@memory[160000-161777] = win-ram

	// Регистры косвенного доступа ПП: адрес, данные плана 0, данные ЦП
	@memory[177010-177015] = pp-indirect
}
