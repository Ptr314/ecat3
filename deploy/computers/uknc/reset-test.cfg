// Отладочная конфигурация: один процессор держит другой в сбросе.
//
// На УК-НЦ машина стартует с ПЗУ периферийного процессора, а центральный
// поднимает именно ПП - разрядами своего регистра 177716 (4 - HALT, 5 - DCLO,
// 15 - ACLO). Здесь проверяется вход ~dclo процессора: пока линия активна
// (ноль), ЦП не выполняет ни одной команды; отпущенная, она запускает его
// с начального адреса.

system {
	// Числа без префикса восьмеричные, как во всей документации К1801
	radix = 8
	type = uknc
	name = УК-НЦ
	version = Тест сброса
	debug = 1
}

// Ведущий по времени, но по смыслу это центральный процессор УК-НЦ:
// он стоит, пока его не отпустит ведомый.
cpu : 1801vm2 {
	clock = _8000000
	start_address = 100000
	// Разряд 5 регистра ПП: ноль держит процессор в сбросе
	~dclo = pp-sys.value[5]
}

// Периферийный процессор: в этой конфигурации команд не выполняет,
// его регистром управляет сценарий
ppu : 1801vm2 {
	clock = _6250000
	start_address = 100000
	mapper = ppu-mapper
	stopped = 1
}

ram : ram {
	size = _16k
	fill = 0
}

ppu-ram : ram {
	size = _16k
	fill = 0
}

// Счётный цикл ЦП, тот же, что в тесте двух процессоров:
//   0100000: 0005237 0000100   INC @#100
//   0100004: 0000775           BR  0100000
counter : rom {
	data = {$9F,$0A,$40,$00,$FD,$01}
}

// Регистр ПП. По умолчанию разряд 5 нулевой, то есть при включении машины
// центральный процессор стоит - как на настоящей УК-НЦ.
pp-sys : port {
	size = _16
	default = 0
}

display : bk-display {
	vram = ram
	mode = color
}

// Клавиатура не эмулируется, но устройство с именем keyboard обязательно
keyboard : scan-keyboard {
	map = rk.kbd
	ctrl = ctrl
	shift = shift
	ruslat = caps
}

mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-037777] = ram
	@memory[100000-100005] = counter {mode = r}
}

ppu-mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-037777] = ppu-ram
	@memory[177716-177717] = pp-sys
}
