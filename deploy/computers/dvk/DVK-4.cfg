// Числа без префикса в этом файле восьмеричные, как во всей документации К1801
system {
	radix = 8
	type = dvk
	name = ДВК-4
	version = ДВК-4 (МС1201.04, КСМ, MX, MY, DW)
	debug = 0
}

//=========================== Процессорная плата МС1201.04 =================//

// КМ1801ВМ3: режимы ядра и пользователя, диспетчер памяти с 22-разрядным
// адресом. Адреса в этом файле физические: ОЗУ с 0, страница ввода-вывода -
// 17760000-17777777.
//
// Пультовый режим у ВМ3 свой: процессор ставит стек пульта на 100000, кладёт
// туда PSW и PC и выполняет с адреса 0 теневой памяти (вывод SEL - здесь
// разряд 22 адреса, 20000000 и выше). Там монитор платы - ПЗУ 134 - и 512
// байт теневого ОЗУ, где монитор держит переменные и стек. Плата держит
// процессор в пульте с самого пуска (переключатель «пульт»), так что
// монитор получает управление сразу
cpu : 1801vm3 {
	clock = _4600000
	start_address = 173000
	start_halt = 1
	~virq = dw.virq
	~vector = dw.vector
	// Сетевой таймер платы на входе EVNT: вектор 100, уровень 6
	~irq2 = !lks.irq
	~halt = panel.ost
	// Разрешение пуска от пульта
	~dclo = panel.aip
	~aclo = panel.asp
}

// Пульт: включает блок питания и даёт разрешение пуска. Через 0,5 с, когда
// блок питания выходит на режим, снимает АИП (DCLO), ещё через 10 мс - АСП
// (ACLO); процессор стартует, когда сняты обе. Терминал КСМ - отдельный блок
// и за это время успевает приготовиться: без паузы первое приглашение
// монитора пропадало. COMMAND panel.reset() - кнопка «Сброс».
//
// Тумблеры пульта - переключатели машины на панели инструментов: «Пульт»
// (линия ОСТ, процессор в пультовом режиме) и «Прерывания» (линия ПРТ,
// сетевой таймер 50 Гц). halt и prt - их положение при включении
panel : dvk-panel {
	power_good = _500
	aip_delay = _13
	asp_delay = _10
	halt = 0
	prt = 1
	halt_icon = agent.png
	prt_icon = socket.png
}

// 1 МБ ОЗУ
ram : ram {
	size = _1024k
}

// Монитор (ПЗУ 134), теневая память. Видны первые 6 КБ каждых 8 КБ, в
// последних 2 КБ - теневое ОЗУ
monitor : rom {
	size = _8k
	image = 134.rom
}

// Теневое ОЗУ, 512 байт, повторяется по всей своей части теневой памяти
sysram : ram {
	size = _512
}

// Сетевой таймер с регистром LKS, 177546. Частота - с линии ПРТ магистрали
// (тумблер «Прерывания» пульта), на плате её проводит на вход EVNT перемычка
lks : dvk-lks {
	frequency = 0
	~prt = panel.prt
	~init = cpu.init
}

// Терминальный интерфейс ИРПС, 177560-177566, векторы 60 и 64. На другом
// конце линии - терминал КСМ
tt : dl11 {
	baud = _9600
	~iako = cpu.iako
	~init = cpu.init
	~rxd = ksm-line.txd
}

// Контроллер MY (КМД 3.057.136), 172140/172142, вектор 170. Это плата со
// своим процессором: К1801ВМ1 на 4 МГц, прошивка 092 (КР1801РЕ2), 4 КБ ОЗУ
// (две КР537РУ8) и контроллер дисковода К1801ВП1-128. Чтение, запись,
// форматирование - всё делает прошивка; с машиной плату связывают её
// регистры и прямой доступ к памяти через окно 40000-77777.
// Адрес прямого доступа 22-разрядный: перемычки S1-S6 выводят разряды
// 16-21 на шину
my : dvk-kmd {
	host_mapper = mapper
	address_bits = _22
	~virq_in = tt.virq
	~vector_in = tt.vector
	~iako = cpu.iako
	~init = cpu.init
}

// Процессор платы. Пуск - по адресу из старшего байта 177716 платы (010000):
// прошивка там гасит прерывания и переходит на 0. INIT машины - IRQ2
// платы (вектор 100), АИП/АСП - общие с машиной
kmd-cpu : 1801vm1 {
	clock = _4000000
	start_address = 010000
	mapper = kmd-mapper
	~irq2 = !my.local_init
	~dclo = panel.aip
	~aclo = panel.asp
}

// Прошивка 092; другая версия - kmd091.rom
kmd-rom : rom {
	size = _8k
	image = kmd092.rom
	files = "ПЗУ КМД (*.rom *.bin);;Все файлы (*.*)"
}

kmd-ram : ram {
	clock_source = kmd-cpu
	size = _4k
}

kmd-fdc : bk-fdc {
	clock_source = kmd-cpu
	drives = my0|my1
}

my0 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 0
	image = rt11-my.dsk
	files = "Образы дискет MY (*.dsk *.img);;Все файлы (*.*)"
	~select = kmd-fdc.select
	~motor_on = kmd-fdc.motor_on
}

my1 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 1
	files = "Образы дискет MY (*.dsk *.img);;Все файлы (*.*)"
	~select = kmd-fdc.select
	~motor_on = kmd-fdc.motor_on
}

// Адреса процессора платы. 177716 - регистр режима (переключатели SA1 в
// разрядах 0-1, адрес пуска в старшем байте), 177760 прошивка пишет при
// пуске, плата его не читает
kmd-mapper : memory-mapper {
	@memory[000000-017777] = kmd-rom {mode = r}
	@memory[020000-027777] = kmd-ram
	@memory[040000-077777] = my[0400000]
	@memory[177100-177103] = my[0100]
	@memory[177130-177133] = kmd-fdc
	@memory[177716-177717] = my[0110]
	@memory[177760-177761] = my[0120]
}

// Контроллер винчестера DW (КЗД 3.057.316), 174000-174020, вектор 300.
// Образ в гнездо не вставлен: файл на 5 МБ возят отдельно от машины. RT-11 на
// винчестере - software/dvk/rt11-dw.dsk, вставить из меню и загрузить BDW0
dw : dvk-dw {
	files = "Образы винчестера DW (*.dsk *.img);;Все файлы (*.*)"
	~virq_in = my.virq
	~vector_in = my.vector
	~iako = cpu.iako
	~init = cpu.init
}

// Контроллер MX, 177130/177132
mx : dvk-mx {
	drives = mx0|mx1
}

mx0 : fdd {
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 0
	image = rt11-mx.dsk
	files = "Образы дискет MX (*.dsk *.img);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

mx1 : fdd {
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 1
	files = "Образы дискет MX (*.dsk *.img);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

mapper : memory-mapper {
	address_bits = _23

	@memory[00000000-03777777] = ram
	@memory[17772140-17772143] = my
	@memory[17774000-17774037] = dw
	@memory[17777130-17777133] = mx
	@memory[17777546-17777547] = lks
	@memory[17777560-17777567] = tt

	// Теневая память пультового режима
	@memory[20000000-20013777] = monitor {mode = r}
	@memory[20014000-20014777] = sysram
	@memory[20015000-20015777] = sysram
	@memory[20016000-20016777] = sysram
	@memory[20017000-20017777] = sysram
	@memory[20020000-20033777] = monitor {mode = r}
	@memory[20034000-20034777] = sysram
	@memory[20035000-20035777] = sysram
	@memory[20036000-20036777] = sysram
	@memory[20037000-20037777] = sysram
	@memory[20040000-20053777] = monitor {mode = r}
	@memory[20054000-20054777] = sysram
	@memory[20055000-20055777] = sysram
	@memory[20056000-20056777] = sysram
	@memory[20057000-20057777] = sysram
	@memory[20060000-20073777] = monitor {mode = r}
	@memory[20074000-20074777] = sysram
	@memory[20075000-20075777] = sysram
	@memory[20076000-20076777] = sysram
	@memory[20077000-20077777] = sysram
}

//=========================== Терминал КСМ =================================//

// Контроллер символьного монитора - отдельная машина на КР580ВМ80А со своим
// ПЗУ (ksm_04/05), знакогенератором (ksm_03) и 16 КБ видеопамяти. С ДВК
// его связывает только линия ИРПС; клавиатура МС7004 подключена к нему же.
ksm-cpu : i8080 {
	clock = _1540000
	mapper = ksm-mapper
	// Прерывания даёт ВН59 в режиме 8080: CALL на 0BC0 + 4 * уровень
	int_opcode = $CD
	~int = ksm-pic.int
	~int_address = ksm-pic.call
}

ksm-rom : rom {
	size = _4k
	image = ksm.rom
}

ksm-ram : ram {
	clock_source = ksm-cpu
	size = _256
}

ksm-vram : ram {
	clock_source = ksm-cpu
	size = _16k
}

ksm-cg : rom {
	size = _2k
	image = ksm_cg.rom
}

ksm-pic : i8259 {
	clock_source = ksm-cpu
	~inta = ksm-cpu.inta
	~ir[1] = ksm-kbd.rxrdy
	~ir[3] = ksm-line.rxrdy
}

// D42 - линия к ДВК, 9600 бод (x16 от генератора скорости)
ksm-line : i8251 {
	clock_source = ksm-cpu
	clock = 1/_12
	~rxd = tt.txd
}

// D41 - линия от клавиатуры, 4800 бод
ksm-kbd : i8251 {
	clock_source = ksm-cpu
	clock = 1/_24
	~rxd = keyboard.data
}

// D30. Порт A - первая строка кольца видеопамяти на экране, B - переключатели
// SA1 (1 стоп-бит, без чётности, КОИ-7 Н0/Н1), младшая половина C -
// переключатели SA2 (9600 бод, без XON/XOFF)
ksm-ppi : i8255 {
	clock_source = ksm-cpu
	~B = 1
	~CL = 0
}

display : ksm-display {
	clock_source = ksm-cpu
	vram = ksm-vram
	font = ksm-cg
	~line = ksm-ppi.A
}

keyboard : ms7004 {
	clock_source = ksm-cpu
	map = ms7004.map
	use_remap = 0
	// Символ на 4800 бод - 2,3 мс, 3500 тактов процессора КСМ
	interval = _3500
}

ksm-mapper : memory-mapper {
	@memory[$0000-$0FFF] = ksm-rom {mode = r}
	@memory[$2000-$20FF] = ksm-ram
	@memory[$C000-$FFFF] = ksm-vram

	@port[$5E-$5F] = ksm-pic
	@port[$6E-$6F] = ksm-kbd
	@port[$76-$77] = ksm-line
	@port[$78-$7B] = ksm-ppi
}
