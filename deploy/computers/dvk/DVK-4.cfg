// Числа без префикса в этом файле восьмеричные, как во всей документации К1801
system {
	radix = 8
	type = dvk
	name = ДВК-4
	version = ДВК-4 (МС1201.04, КЦГД, MX, MY, DW)
	debug = 0
}

//=========================== Процессорная плата МС1201.04 =================//

// КМ1801ВМ3: режимы ядра и пользователя, диспетчер памяти с 22-разрядным
// адресом. Адреса в этом файле физические: ОЗУ с 0, страница ввода-вывода -
// 17760000-17777777.
//
// Пультовый режим у ВМ3 свой: процессор ставит стек пульта на 100000, кладёт
// туда PSW и PC и выполняет с адреса 0 теневой памяти (вывод SEL - здесь
// разряд 22 адреса, 20000000 и выше). Там монитор платы - ПЗУ 134 - и 512
// байт теневого ОЗУ, где монитор держит переменные и стек. Плата держит
// процессор в пульте с самого пуска (переключатель «пульт»), так что
// монитор получает управление сразу
cpu : 1801vm3 {
	clock = _4600000
	start_address = 173000
	start_halt = 1
	~virq = dw.virq
	~vector = dw.vector
	// Сетевой таймер на входе EVNT (вектор 100, уровень 6) - линия ПРТ
	// магистрали (тумблер «Прерывания» пульта): по нетлисту МС1201.04 она
	// идёт через приёмник D7 и перемычку S7 прямо на вывод 44 ВМ3. Регистра
	// LKS 177546, который его разрешает, на плате нет (он есть в FPGA-реплике)
	~irq2 = !panel.prt
	~halt = panel.ost
	// Разрешение пуска от пульта
	~dclo = panel.aip
	~aclo = panel.asp
}

// Пульт: включает блок питания и даёт разрешение пуска. Через 0,5 с, когда
// блок питания выходит на режим, снимает АИП (DCLO), ещё через 10 мс - АСП
// (ACLO); процессор стартует, когда сняты обе. Терминал (КЦГД) стартует от
// тех же линий и за это время успевает приготовиться: без паузы первое
// приглашение монитора пропадало. COMMAND panel.reset() - кнопка «Сброс».
//
// Тумблеры пульта - переключатели машины на панели инструментов: «Пульт»
// (линия ОСТ, процессор в пультовом режиме) и «Прерывания» (линия ПРТ,
// сетевой таймер 50 Гц). halt и prt - их положение при включении.
// «Прерывания» при включении выключены: регистра LKS нет, запрос ничем не
// запирается, а монитор 134 гоняет тест памяти с открытыми прерываниями и
// со включённым таймером уходит через вектор 100 в мусор. Тумблер включают
// после приглашения монитора
panel : dvk-panel {
	power_good = _500
	aip_delay = _13
	asp_delay = _10
	halt = 0
	prt = 0
	halt_icon = agent.png
	prt_icon = socket.png
}

// 1 МБ ОЗУ
ram : ram {
	size = _1024k
}

// Монитор, теневая память. Видны первые 6 КБ каждых 8 КБ, в последних 2 КБ -
// теневое ОЗУ. Сменная микросхема, 134 или 377: выбирается в редакторе
// конфигурации (копия машины, поле «ПЗУ монитора»)
monitor : rom {
	size = _8k
	label = ПЗУ монитора
	image_1 = 134.rom
	title_1 = 134
	image_2 = 377.rom
	title_2 = 377
}

// Теневое ОЗУ, 512 байт, повторяется по всей своей части теневой памяти
sysram : ram {
	size = _512
}

// Терминальный интерфейс ИРПС, 177560-177566, векторы 60 и 64. На другом
// конце линии - графический терминал КЦГД; оба канала (D9 и D10) на его
// плате, с квитированием накрест: символ не уходит, пока приёмник на том
// конце занят (BSYD, вывод 29, - от вывода 31 другого). Скорость - входы
// FR3-FR0 = 1100 (выводы 6-3 запаяны), 57600 бод по таблице ВП1-035/065;
// без квитирования прошивка 181 не успевала бы ни на какой
tt : dl11 {
	baud = _57600
	~iako = cpu.iako
	~init = cpu.init
	~rxd = kcgd-host.txd
	~cts = kcgd-host.rx_free
}

// Контроллер MY (КМД 3.057.136), 172140/172142, вектор 170. Это плата со
// своим процессором: К1801ВМ1 на 4 МГц, прошивка 092 (КР1801РЕ2), 4 КБ ОЗУ
// (две КР537РУ8) и контроллер дисковода К1801ВП1-128. Чтение, запись,
// форматирование - всё делает прошивка; с машиной плату связывают её
// регистры и прямой доступ к памяти через окно 40000-77777.
// Адрес прямого доступа 22-разрядный: перемычки S1-S6 выводят разряды
// 16-21 на шину
my : dvk-kmd {
	host_mapper = mapper
	address_bits = _22
	~virq_in = tt.virq
	~vector_in = tt.vector
	~iako = cpu.iako
	~init = cpu.init
}

// Процессор платы. Пуск - по адресу из старшего байта 177716 платы (010000):
// прошивка там гасит прерывания и переходит на 0. INIT машины - IRQ2
// платы (вектор 100), АИП/АСП - общие с машиной
kmd-cpu : 1801vm1 {
	clock = _4000000
	mapper = kmd-mapper
	~irq2 = !my.local_init
	~dclo = panel.aip
	~aclo = panel.asp
}

// Прошивка 255 (КР1801РЕ2) - для платы с ОЗУ на 537РУ8/РУ10, как наша по
// нетлисту: 4 КБ на 020000-027777, стек 30000. Прошивки других вариантов
// платы (bkbtl-doc, «1801re2 ROMs») - 092 (ОЗУ 537РУ11), 093 (К1809РУ1),
// 091 (исходный КМД: К1809РУ1 и контроллер дисковода ВП1-097); у тех ОЗУ
// свой интерфейс МПИ и регистр начального адреса и конфигурации 177760,
// который прошивка пишет при пуске. На этой плате его нет
kmd-rom : rom {
	size = _8k
	image = kmd255.rom
	files = "ПЗУ КМД (*.rom *.bin);;Все файлы (*.*)"
}

kmd-ram : ram {
	clock_source = kmd-cpu
	size = _4k
}

kmd-fdc : bk-fdc {
	clock_source = kmd-cpu
	drives = my0|my1
}

my0 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 0
	image = rt11-my.dsk
	// Дорожки целиком, как их пишет контроллер (К1801ВП1-128); .mfm и .hfe хранят
	// их без потерь, с метками удаления и нестандартной разметкой
	mode = mfm_ibm
	files = "Образы дискет MY (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = kmd-fdc.select
	~motor_on = kmd-fdc.motor_on
}

my1 : fdd {
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 1
	// Дорожки целиком, как их пишет контроллер (К1801ВП1-128); .mfm и .hfe хранят
	// их без потерь, с метками удаления и нестандартной разметкой
	mode = mfm_ibm
	files = "Образы дискет MY (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = kmd-fdc.select
	~motor_on = kmd-fdc.motor_on
}

// Адреса процессора платы. 177716 - регистр режима (переключатели SA1 в
// разрядах 0-1, адрес пуска в старшем байте). 177760 (регистр ОЗУ 537РУ11 /
// К1809РУ1) на плате с 537РУ8 никто не отвечает: обращение - зависание шины
kmd-mapper : memory-mapper {
	@memory[000000-017777] = kmd-rom {mode = r}
	@memory[020000-027777] = kmd-ram
	@memory[040000-077777] = my[0400000]
	@memory[177100-177103] = my[0100]
	@memory[177130-177133] = kmd-fdc
	@memory[177716-177717] = my[0110]
}

// Контроллер винчестера DW (КЗД 3.057.316), 174000-174020, вектор 300.
// Образ в гнездо не вставлен: файл на 5 МБ возят отдельно от машины. RT-11 на
// винчестере - software/dvk/rt11-dw.dsk, вставить из меню и загрузить BDW0
dw : dvk-dw {
	files = "Образы винчестера DW (*.dsk *.img);;Все файлы (*.*)"
	~virq_in = my.virq
	~vector_in = my.vector
	~iako = cpu.iako
	~init = cpu.init
}

// Контроллер MX, 177130/177132
mx : dvk-mx {
	drives = mx0|mx1
}

mx0 : fdd {
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 0
	image = rt11-mx.dsk
	// Дорожки целиком, как их пишет контроллер, .mfm и .hfe хранят их без потерь
	mode = fm_dvk_mx
	files = "Образы дискет MX (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

mx1 : fdd {
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 1
	// Дорожки целиком, как их пишет контроллер, .mfm и .hfe хранят их без потерь
	mode = fm_dvk_mx
	files = "Образы дискет MX (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

mapper : memory-mapper {
	address_bits = _23

	@memory[00000000-03777777] = ram
	@memory[17772140-17772143] = my
	@memory[17774000-17774037] = dw
	@memory[17777130-17777133] = mx
	@memory[17777560-17777567] = tt

	// Теневая память пультового режима
	@memory[20000000-20013777] = monitor {mode = r}
	@memory[20014000-20014777] = sysram
	@memory[20015000-20015777] = sysram
	@memory[20016000-20016777] = sysram
	@memory[20017000-20017777] = sysram
	@memory[20020000-20033777] = monitor {mode = r}
	@memory[20034000-20034777] = sysram
	@memory[20035000-20035777] = sysram
	@memory[20036000-20036777] = sysram
	@memory[20037000-20037777] = sysram
	@memory[20040000-20053777] = monitor {mode = r}
	@memory[20054000-20054777] = sysram
	@memory[20055000-20055777] = sysram
	@memory[20056000-20056777] = sysram
	@memory[20057000-20057777] = sysram
	@memory[20060000-20073777] = monitor {mode = r}
	@memory[20074000-20074777] = sysram
	@memory[20075000-20075777] = sysram
	@memory[20076000-20076777] = sysram
	@memory[20077000-20077777] = sysram
}

//=========================== КЦГД =========================================//

// КМ1801ВМ2, 30,8 МГц / 4. Начальный пуск и векторы пульта - от 100000, где
// лежит прошивка: пуск по 111516, HALT и двойное зависание - туда же. PSW
// вектора пуска - 340, без разряда 8: прошивка работает вне пультового режима
kcgd-cpu : 1801vm2 {
	clock = _7700000
	// Регистр SEL: вектор пуска и векторы пультового режима - от 100000
	sel = 100000
	// Время команд - по симуляции кристалла (tools/vm2-timing). ОЗУ
	// процессора - видеопамять: обращение к ней ждёт окна развёртки (kcgd,
	// по ПЗУ D61), ПЗУ и регистры отвечают сразу
	timing = vm2
	mapper = kcgd-mapper
	// Прерывания цепочкой: ВП1-033, клавиатура, линия к ДВК
	~virq = kcgd.virq
	~vector = kcgd.vector
	// Кадровый импульс, вектор 100
	~irq2 = kcgd.evnt
	// АИП и АСП магистрали
	~dclo = panel.aip
	~aclo = panel.asp
}

// ПЗУ КЦГД, 100000-157777, выбирается в редакторе конфигурации (поле
// «Прошивка КЦГД»). Прошивка
// (КР1801РЕ2) - 100000-117777; на 120000-157777 - расширение KeyGP (ещё две
// КР1801РЕ2: РР1-183, РР1-184), которое работает только с прошивкой 182.
// Варианты: 182 с KeyGP (образ на 24 КБ - три микросхемы подряд), 182 и 181
// без него. Пустые гнёзда на шине не отвечают (partial): прошивка 182 при
// пуске переходит на 120000 и без KeyGP возвращается по вектору 4, а
// заводской тест KC.SAV с прошивкой 181 считает ответ там ошибкой 13
kcgd-rom : rom {
	size = _24k
	partial = 1
	label = Прошивка КЦГД
	image_1 = kcgd182-keygp.rom
	title_1 = 182 + KeyGP
	image_2 = kcgd182.rom
	title_2 = 182
	image_3 = kcgd181.rom
	title_3 = 181
	files = "ПЗУ КЦГД (*.rom *.bin);;Все файлы (*.*)"
}

// Видеопамять, регистры 160000/160002 и КР1801ВП1-033 (167770-167776)
kcgd : kcgd {
	clock_source = kcgd-cpu
	// Развёртка: ПЗУ К556РТ4 строки (D61, D62) и поля (D63)
	image_d61 = kcgd_d61.bin
	image_d62 = kcgd_d62.bin
	image_d63 = kcgd_d63.bin
	// По нетлисту на EVNT идёт выход V9 D63 (разряд 1), но в имеющемся дампе
	// он единица по всем адресам: прерывания по вектору 100 не было бы, а
	// прошивка 181 им считает время (мигание курсора, гашение экрана). Пока
	// это не выяснено, на EVNT взят кадровый синхроимпульс V8 (разряд 2)
	evnt_bit = 2
	mouse = mouse
	~virq_in = kcgd-kbd.virq
	~vector_in = kcgd-kbd.vector
	~iako = kcgd-cpu.iako
	~init = kcgd-cpu.init
}

// Клавиатура, 177560-177566, векторы 60 и 64, 4800 бод (D16: FR3-FR0 = 1001)
kcgd-kbd : dl11 {
	clock_source = kcgd-cpu
	baud = _4800
	~virq_in = kcgd-host.virq
	~vector_in = kcgd-host.vector
	~iako = kcgd-cpu.iako
	~init = kcgd-cpu.init
	~rxd = keyboard.data
}

// Линия к ДВК, 176560-176566, векторы 360 и 364 (прошивка 181 её опрашивает)
kcgd-host : dl11 {
	clock_source = kcgd-cpu
	baud = _57600
	rx_vector = 360
	tx_vector = 364
	~iako = kcgd-cpu.iako
	~init = kcgd-cpu.init
	~rxd = tt.txd
	~cts = tt.rx_free
}

// Изображение 800 x 480. Шрифт прошивки (для поля text) - с 012236 ПЗУ.
// Выходы цвета: U55 - красный, U56 - зелёный, U57 - синий; текст прошивки
// 181 (регистр палитры 017) - жёлтый
display : kcgd-display {
	clock_source = kcgd-cpu
	kcgd = kcgd
	font = kcgd-rom
	font_offset = 012236
}

// Мышь (разъём XP5): счётчики осей читаются в 167774. Прошивка её не
// читает - её читает программа, которую машина загружает в КЦГД
mouse : kcgd-mouse {
	clock_source = kcgd-cpu
}

keyboard : ms7004 {
	clock_source = kcgd-cpu
	map = ms7004.map
	use_remap = 0
	// Символ на 4800 бод - 2,1 мс, 16000 тактов процессора КЦГД
	interval = _16000
	// Команды КЦГД клавиатуре (индикаторы, перезапуск)
	~rxd = kcgd-kbd.txd
}

kcgd-mapper : memory-mapper {
	portstomemory = 1
	// Младшие 16К слов видеопамяти - ОЗУ процессора КЦГД
	@memory[000000-077777] = kcgd
	@memory[100000-157777] = kcgd-rom {mode = r, routed = 1}
	@memory[160000-163777] = kcgd[160000]
	@memory[167770-167777] = kcgd[167770]
	@memory[176560-176567] = kcgd-host
	@memory[177560-177567] = kcgd-kbd
}
