// Числа без префикса в этом файле восьмеричные, как во всей документации К1801
system {
	radix = 8
	type = dvk
	name = ДВК
	version = ДВК-1
	debug = 0
}

//=========================== Процессорная плата МС1201.01 =================//

// К1801ВМ1. Адрес пуска процессор берёт из старшего байта регистра
// начального пуска SEL1 (177716): 160000. Там стоит монитор (ПЗУ 000), а что
// делать после включения, он решает по двум младшим разрядам того же
// регистра: 00 - пуск через вектор 24, 01 - выход в пульт, 10 - загрузка с
// DX, 11 - пуск с 140000. Перемычки платы стоят на 01.
//
// Пультовый режим у ВМ1 внешний: вход - RMW 177716 с разрядом 3 (он же
// открывает верхнее окно монитора), слово состояния в 177676, PC в 177674 -
// это системное ОЗУ платы, 177600-177677, - и новые PC/PSW из 160002/160004.
cpu : 1801vm1 {
	// Частота МС1201.01 - уточнить по паспорту платы
	clock = _4000000
	~virq = tt.virq
	~vector = tt.vector
	// Сетевой таймер 50 Гц (вектор 100) - линия ПРТ от тумблера «Прерывания»
	// пульта
	~irq2 = !panel.prt
	~halt = panel.ost
	// Разрешение пуска от пульта
	~dclo = panel.aip
	~aclo = panel.asp
}

// Пульт: включает блок питания и даёт разрешение пуска. Через 0,5 с, когда
// блок питания выходит на режим, снимает АИП (DCLO), ещё через 10 мс - АСП
// (ACLO); процессор стартует, когда сняты обе. Терминал - отдельный блок
// и за это время успевает приготовиться: без паузы первое приглашение
// монитора пропадало. COMMAND panel.reset() - кнопка «Сброс».
//
// Тумблеры пульта - переключатели машины на панели инструментов: «Пульт»
// (линия ОСТ, процессор в пультовом режиме) и «Прерывания» (линия ПРТ,
// сетевой таймер 50 Гц). halt и prt - их положение при включении.
// У ДВК-1 «Прерывания» при включении выключены: БЕЙСИК в ПЗУ держит с
// адреса 100 свой код и с включённым таймером падает на первой же команде
panel : dvk-panel {
	power_good = _500
	aip_delay = _13
	asp_delay = _10
	halt = 0
	prt = 0
	halt_icon = agent.png
	prt_icon = socket.png
}

// 48 КБ ОЗУ; 140000-157777 занимает пользовательское ПЗУ
ram : ram {
	size = _48k
}

// Пользовательское ПЗУ: БЕЙСИК (013) или ФОКАЛ (058) - сменная микросхема,
// выбирается в редакторе конфигурации (копия машины, поле «Пользовательское
// ПЗУ»); запускается из монитора командой 140000G
user-rom : rom {
	size = _8k
	label = Пользовательское ПЗУ
	image_1 = 013.rom
	title_1 = БЕЙСИК (013)
	image_2 = 058.rom
	title_2 = ФОКАЛ (058)
	files = "ПЗУ пользователя ДВК (*.rom *.bin);;Все файлы (*.*)"
}

// Монитор (ПЗУ 000), 160000-173777. Окна открывают разряды SEL1: разряд 2
// или 3 - 160000-163777, разряд 3 - 164000-172777; загрузчик 173000-173777
// виден всегда
monitor : rom {
	size = _8k
	image = 000.rom
}

// Системное ОЗУ платы, 177600-177677: сюда пультовый вход ВМ1 кладёт PC и PSW
sysram : ram {
	size = _64
}

// SEL1, регистр начального пуска: старший байт - адрес пуска, 3-2 - окна
// монитора, 1-0 - режим пуска. Программа меняет только разряды 7-2
sel1 : port {
	size = _16
	default = 160005
	mask = 000374
}

// SEL2, 177714 - чётный и нечётный регистры платы
sel2 : port {
	size = _16
}

// Таймер процессора, 177706-177712
timer : bk-timer {
	divider = _128
}

// Терминальный интерфейс ИРПС, 177560-177566, векторы 60 и 64. На другом
// конце линии - терминал 15ИЭ
tt : dl11 {
	baud = _9600
	~iako = cpu.iako
	~init = cpu.init
	~rxd = display.txd
}

mapper : memory-mapper {
	portstomemory = 1

	~config[0-1] = sel1.value[2-3]

	@memory[000000-137777] = ram
	// ПЗУ на запись не отвечает: БЕЙСИК ищет верх ОЗУ записью вниз от
	// 160000 и ждёт тайм-аута на первом же слове ПЗУ
	@memory[140000-157777] = user-rom {mode = r, strict = 1}
	@memory[1:1][160000-163777] = monitor {mode = r, strict = 1}
	@memory[2:2][160000-172777] = monitor {mode = r, strict = 1}
	@memory[173000-173777] = monitor[13000] {mode = r, strict = 1}
	@memory[177560-177567] = tt
	@memory[177600-177677] = sysram
	@memory[177706-177713] = timer
	@memory[177714-177715] = sel2
	@memory[177716-177717] = sel1
}

//=========================== Терминал 15ИЭ ================================//

// 15ИЭ-00-013 - отдельный блок со своей клавиатурой 15ВВВ-97-006; с ДВК его
// связывает только линия ИРПС. Поведение терминала (почти VT52, кириллица по
// SO/SI) написано в коде, знаки - из его знакогенератора. Лампы над
// клавиатурой горят все: ЛАТ, НР, ПРД и пять переключателей режимов (ДУП,
// ЛИН, РЕД, ПЧ, СДВ - на рисунке клавиатуры, при включении на линии и в
// дуплексе). КГД к нему не подключается.
ie15-cg : rom {
	size = _2k
	image = ie15_cg.rom
}

display : ie15 {
	font = ie15-cg
	keyboard = keyboard
	baud = _9600
	~rxd = tt.txd
}

keyboard : ie15-keyboard {
	map = 15vvv.map
	keys = 15vvv.keys
	picture = 15vvv_keyboard.svg
	ruslat = caps
	rusmode = code
	use_remap = 0
	rus_switches = $0E/$0F
}

