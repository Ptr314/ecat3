// Отладочная машина для К1801ВМ3: процессор, 248 КБ ОЗУ и терминальный
// интерфейс без терминала. На ней идут тесты DEC для PDP-11/34
// (github.com/1801BM1/cpu11, vm3/tst/org): образ кладётся в ОЗУ с адреса 0,
// пуск с 200, вывод читается полем tt.text.
//
// Адреса физические, 22-разрядные: страница ввода-вывода - 17760000-17777777
system {
	radix = 8
	type = dvk
	name = ВМ3 (тест)
	version = К1801ВМ3, тесты DEC
	debug = 1
}

cpu : 1801vm3 {
	clock = _4600000
	start_address = 200
	~virq = tt.virq
	~vector = tt.vector
	~irq2 = !lks.irq
}

ram : ram {
	size = _248k
}

// Сетевой таймер прерывает только при разрешении в LKS (177546)
lks : dvk-lks {
	~init = cpu.init
}

tt : dl11 {
	baud = _38400
	~iako = cpu.iako
	~init = cpu.init
}

mapper : memory-mapper {
	address_bits = _23
	@memory[00000000-00757777] = ram
	@memory[17777546-17777547] = lks
	@memory[17777560-17777567] = tt
}

display : ksm-display {
	vram = ksm-vram
	font = ksm-cg
}

ksm-vram : ram {
	size = _16k
}

ksm-cg : rom {
	size = _2k
	image = ksm_cg.rom
}

keyboard : ms7004 {
	map = ms7004.map
	use_remap = 0
}
