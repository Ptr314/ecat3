// Числа без префикса в этом файле восьмеричные, как во всей документации К1801
system {
	radix = 8
	type = dvk
	name = ДВК-2
	version = ДВК-2 (МС1201.01, КСМ, DX)
	debug = 0
}

//=========================== Процессорная плата МС1201.01 =================//

// К1801ВМ1. Адрес пуска процессор берёт из старшего байта регистра
// начального пуска SEL1 (177716): 160000. Там стоит монитор (ПЗУ 000), а что
// делать после включения, он решает по двум младшим разрядам того же
// регистра: 00 - пуск через вектор 24, 01 - выход в пульт, 10 - загрузка с
// DX, 11 - пуск с 140000. Перемычки платы стоят на 01.
//
// Пультовый режим у ВМ1 внешний: вход - RMW 177716 с разрядом 3 (он же
// открывает верхнее окно монитора), слово состояния в 177676, PC в 177674 -
// это системное ОЗУ платы, 177600-177677, - и новые PC/PSW из 160002/160004.
cpu : 1801vm1 {
	// Частота МС1201.01 - уточнить по паспорту платы
	clock = _4000000
	// Прерывания идут цепочкой: DX, потом терминальный интерфейс
	~virq = dx.virq
	~vector = dx.vector
	// Сетевой таймер 50 Гц на входе IRQ2 (вектор 100), тумблер включён
	// Сетевой таймер 50 Гц (вектор 100) - линия ПРТ от пульта
	~irq2 = !panel.prt
	~halt = panel.ost
	// Разрешение пуска от пульта
	~dclo = panel.aip
	~aclo = panel.asp
}

// Пульт: включает блок питания и даёт разрешение пуска. Через 0,5 с, когда
// блок питания выходит на режим, снимает АИП (DCLO), ещё через 10 мс - АСП
// (ACLO); процессор стартует, когда сняты обе. Терминал КСМ - отдельный блок
// и за это время успевает приготовиться: без паузы первое приглашение
// монитора пропадало. COMMAND panel.reset() - кнопка «Сброс».
//
// Тумблеры пульта - переключатели машины на панели инструментов: «Пульт»
// (линия ОСТ, процессор в пультовом режиме) и «Прерывания» (линия ПРТ,
// сетевой таймер 50 Гц). halt и prt - их положение при включении
panel : dvk-panel {
	power_good = _500
	aip_delay = _13
	asp_delay = _10
	halt = 0
	prt = 1
	halt_icon = agent.png
	prt_icon = socket.png
}

// 56 КБ ОЗУ
ram : ram {
	size = _56k
}

// Монитор (ПЗУ 000), 160000-173777. Окна открывают разряды SEL1: разряд 2
// или 3 - 160000-163777, разряд 3 - 164000-172777; загрузчик 173000-173777
// виден всегда
monitor : rom {
	size = _8k
	image = 000.rom
}

// Системное ОЗУ платы, 177600-177677: сюда пультовый вход ВМ1 кладёт PC и PSW
sysram : ram {
	size = _64
}

// SEL1, регистр начального пуска: старший байт - адрес пуска, 3-2 - окна
// монитора, 1-0 - режим пуска. Программа меняет только разряды 7-2
sel1 : port {
	size = _16
	default = 160005
	mask = 000374
}

// SEL2, 177714 - чётный и нечётный регистры платы
sel2 : port {
	size = _16
}

// Таймер процессора, 177706-177712
timer : bk-timer {
	divider = _128
}

// Терминальный интерфейс ИРПС, 177560-177566, векторы 60 и 64. На другом
// конце линии - терминал КСМ
tt : dl11 {
	baud = _9600
	~iako = cpu.iako
	~init = cpu.init
	~rxd = ksm-line.txd
}

// Контроллер DX (RX11) 8" дисководов ГМД-7012, 177170/177172, вектор 264
dx : dvk-dx {
	drives = dx0|dx1
	~virq_in = tt.virq
	~vector_in = tt.vector
	~iako = cpu.iako
	~init = cpu.init
}

// 77 дорожек по 26 секторов по 128 байт, 256256 байт
dx0 : fdd {
	sides = _1
	tracks = _77
	sectors = _26
	sector_size = _128
	selector_value = 0
	image = rt11-dx.dsk
	// Дорожки IBM 3740 FM целиком; .mfm хранит их без потерь, с метками
	// удаления
	mode = fm_ibm
	files = "Образы дискет DX (*.dsk *.rx1 *.img *.mfm);;Все файлы (*.*)"
	~select = dx.select
	~motor_on = dx.motor_on
}

dx1 : fdd {
	sides = _1
	tracks = _77
	sectors = _26
	sector_size = _128
	selector_value = 1
	// Дорожки IBM 3740 FM целиком; .mfm хранит их без потерь, с метками
	// удаления
	mode = fm_ibm
	files = "Образы дискет DX (*.dsk *.rx1 *.img *.mfm);;Все файлы (*.*)"
	~select = dx.select
	~motor_on = dx.motor_on
}

mapper : memory-mapper {
	portstomemory = 1

	~config[0-1] = sel1.value[2-3]

	@memory[000000-157777] = ram
	@memory[177170-177173] = dx
	// ПЗУ на запись не отвечает, программы ищут верх ОЗУ записью
	@memory[1:1][160000-163777] = monitor {mode = r, strict = 1}
	@memory[2:2][160000-172777] = monitor {mode = r, strict = 1}
	@memory[173000-173777] = monitor[13000] {mode = r, strict = 1}
	@memory[177560-177567] = tt
	@memory[177600-177677] = sysram
	@memory[177706-177713] = timer
	@memory[177714-177715] = sel2
	@memory[177716-177717] = sel1
}

//=========================== Терминал КСМ =================================//

// Контроллер символьного монитора - отдельная машина на КР580ВМ80А со своим
// ПЗУ (ksm_04/05), знакогенератором (ksm_03) и 16 КБ видеопамяти. С ДВК
// его связывает только линия ИРПС; клавиатура МС7004 подключена к нему же.
ksm-cpu : i8080 {
	clock = _1540000
	mapper = ksm-mapper
	// Прерывания даёт ВН59 в режиме 8080: CALL на 0BC0 + 4 * уровень
	int_opcode = $CD
	~int = ksm-pic.int
	~int_address = ksm-pic.call
}

ksm-rom : rom {
	size = _4k
	image = ksm.rom
}

ksm-ram : ram {
	clock_source = ksm-cpu
	size = _256
}

ksm-vram : ram {
	clock_source = ksm-cpu
	size = _16k
}

ksm-cg : rom {
	size = _2k
	image = ksm_cg.rom
}

ksm-pic : i8259 {
	clock_source = ksm-cpu
	~inta = ksm-cpu.inta
	~ir[1] = ksm-kbd.rxrdy
	~ir[3] = ksm-line.rxrdy
}

// D42 - линия к ДВК, 9600 бод: 1,54 МГц / 10 = 154 кГц, x16 в режиме 8251
ksm-line : i8251 {
	clock_source = ksm-cpu
	clock = 1/_10
	~rxd = tt.txd
}

// D41 - линия от клавиатуры, 4800 бод (1,54 МГц / 20, x16)
ksm-kbd : i8251 {
	clock_source = ksm-cpu
	clock = 1/_20
	~rxd = keyboard.data
}

// D30. Порт A - первая строка кольца видеопамяти на экране, B - переключатели
// SA1 (1 стоп-бит, без чётности, КОИ-7 Н0/Н1), младшая половина C -
// переключатели SA2 (9600 бод, без XON/XOFF)
ksm-ppi : i8255 {
	clock_source = ksm-cpu
	~B = 1
	~CL = 0
}

display : ksm-display {
	clock_source = ksm-cpu
	vram = ksm-vram
	font = ksm-cg
	~line = ksm-ppi.A
}

keyboard : ms7004 {
	clock_source = ksm-cpu
	map = ms7004.map
	use_remap = 0
	// Символ на 4800 бод - 2,3 мс, 3500 тактов процессора КСМ
	interval = _3500
}

ksm-mapper : memory-mapper {
	@memory[$0000-$0FFF] = ksm-rom {mode = r}
	@memory[$2000-$20FF] = ksm-ram
	@memory[$C000-$FFFF] = ksm-vram

	@port[$5E-$5F] = ksm-pic
	@port[$6E-$6F] = ksm-kbd
	@port[$76-$77] = ksm-line
	@port[$78-$7B] = ksm-ppi
}
