// Числа без префикса в этом файле восьмеричные, как во всей документации К1801
system {
	radix = 8
	type = dvk
	name = ДВК-3
	version = ДВК-3 (МС1201.02, КСМ, КГД, MX)
	debug = 0
}

//=========================== Процессорная плата МС1201.02 =================//

// КМ1801ВМ2. Пультовый монитор (ПЗУ 055) живёт в «теневом» адресном
// пространстве процессора - в пультовом режиме, при поднятом выводе SEL:
// ПЗУ в 140000-157777, своё ОЗУ в 160000-177777. Остальные адреса при SEL
// не отвечает никто, а память прерванной программы монитор читает и пишет
// командами MFPM/MTPM, на время которых SEL снят.
//
// Регистр начального пуска платы отдаёт процессору 140000 и режим 001 -
// «выход в пульт»: процессор входит в пультовый режим и берёт PC и слово
// состояния из 140000/140002. Векторы пультового режима - тоже от 140000:
// HALT - 140170
cpu : 1801vm2 {
	// Частота МС1201.02 - уточнить по паспорту платы
	clock = _8000000
	start_address = 140000
	start_vector = 1
	halt_sel = 140000
	// Регистр начального пуска: 140000 и режим 001 - выход в пульт
	una_value = 140001
	~virq = tt.virq
	~vector = tt.vector
	// Сетевой таймер 50 Гц на входе EVNT (вектор 100) - линия ПРТ от пульта
	~irq2 = !panel.prt
	~halt = panel.ost
	// Разрешение пуска от пульта
	~dclo = panel.aip
	~aclo = panel.asp
}

// Пульт: включает блок питания и даёт разрешение пуска. Через 0,5 с, когда
// блок питания выходит на режим, снимает АИП (DCLO), ещё через 10 мс - АСП
// (ACLO); процессор стартует, когда сняты обе. Терминал КСМ - отдельный блок
// и за это время успевает приготовиться: без паузы первое приглашение
// монитора пропадало. COMMAND panel.reset() - кнопка «Сброс».
//
// Тумблеры пульта - переключатели машины на панели инструментов: «Пульт»
// (линия ОСТ, процессор в пультовом режиме) и «Прерывания» (линия ПРТ,
// сетевой таймер 50 Гц). halt и prt - их положение при включении
panel : dvk-panel {
	power_good = _500
	aip_delay = _13
	asp_delay = _10
	halt = 0
	prt = 1
}

ram : ram {
	size = _64k
}

// Теневое ОЗУ пультового режима, 160000-177777
sysram : ram {
	size = _8k
}

monitor : rom {
	size = _8k
	image = 055.rom
}

// Терминальный интерфейс ИРПС, 177560-177566, векторы 60 и 64. На другом
// конце линии - терминал КСМ
tt : dl11 {
	baud = _9600
	~iako = cpu.iako
	~init = cpu.init
	~rxd = ksm-line.txd
}

// Контроллер НГМД MX, 177130/177132. Прерываний у него нет
mx : dvk-mx {
	drives = mx0|mx1
}

// Приводы: 40 дорожек, две стороны, 11 секторов по 256 байт на сторону
// дорожки - 220 КБ. Образ - сектора подряд, стороны дорожки друг за другом
mx0 : fdd {
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 0
	image = rt11-mx.dsk
	files = "Образы дискет MX (*.dsk *.img);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

mx1 : fdd {
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 1
	files = "Образы дискет MX (*.dsk *.img);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

// Графический контроллер КГД, 176640-176646. Своего монитора у него нет:
// картинку подмешивает к тексту дисплей КСМ
kgd : dvk-kgd {
}

mapper : memory-mapper {
	portstomemory = 1

	// Разряд 0 конфигурации - пультовый режим (вывод SEL)
	~config[0] = cpu.halt_mode

	@memory[0:1][000000-157777] = ram
	@memory[0:1][176640-176647] = kgd
	@memory[0:1][177130-177133] = mx
	@memory[0:1][177560-177567] = tt

	@memory[1:1][140000-157777] = monitor {mode = r}
	@memory[1:1][160000-177777] = sysram
}

//=========================== Терминал КСМ =================================//

// Контроллер символьного монитора - отдельная машина на КР580ВМ80А со своим
// ПЗУ (ksm_04/05), знакогенератором (ksm_03) и 16 КБ видеопамяти. С ДВК
// его связывает только линия ИРПС; клавиатура МС7004 подключена к нему же.
ksm-cpu : i8080 {
	clock = _1540000
	mapper = ksm-mapper
	// Прерывания даёт ВН59 в режиме 8080: CALL на 0BC0 + 4 * уровень
	int_opcode = $CD
	~int = ksm-pic.int
	~int_address = ksm-pic.call
}

ksm-rom : rom {
	size = _4k
	image = ksm.rom
}

ksm-ram : ram {
	clock_source = ksm-cpu
	size = _256
}

ksm-vram : ram {
	clock_source = ksm-cpu
	size = _16k
}

ksm-cg : rom {
	size = _2k
	image = ksm_cg.rom
}

ksm-pic : i8259 {
	clock_source = ksm-cpu
	~inta = ksm-cpu.inta
	~ir[1] = ksm-kbd.rxrdy
	~ir[3] = ksm-line.rxrdy
}

// D42 - линия к ДВК, 9600 бод (x16 от генератора скорости)
ksm-line : i8251 {
	clock_source = ksm-cpu
	clock = 1/_12
	~rxd = tt.txd
}

// D41 - линия от клавиатуры, 4800 бод
ksm-kbd : i8251 {
	clock_source = ksm-cpu
	clock = 1/_24
	~rxd = keyboard.data
}

// D30. Порт A - первая строка кольца видеопамяти на экране, B - переключатели
// SA1 (1 стоп-бит, без чётности, КОИ-7 Н0/Н1), младшая половина C -
// переключатели SA2 (9600 бод, без XON/XOFF)
ksm-ppi : i8255 {
	clock_source = ksm-cpu
	~B = 1
	~CL = 0
}

display : ksm-display {
	clock_source = ksm-cpu
	vram = ksm-vram
	font = ksm-cg
	kgd = kgd
	~line = ksm-ppi.A
}

keyboard : ms7004 {
	clock_source = ksm-cpu
	map = ms7004.map
	use_remap = 0
	// Символ на 4800 бод - 2,3 мс, 3500 тактов процессора КСМ
	interval = _3500
}

ksm-mapper : memory-mapper {
	@memory[$0000-$0FFF] = ksm-rom {mode = r}
	@memory[$2000-$20FF] = ksm-ram
	@memory[$C000-$FFFF] = ksm-vram

	@port[$5E-$5F] = ksm-pic
	@port[$6E-$6F] = ksm-kbd
	@port[$76-$77] = ksm-line
	@port[$78-$7B] = ksm-ppi
}
