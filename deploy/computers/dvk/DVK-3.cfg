// Числа без префикса в этом файле восьмеричные, как во всей документации К1801
system {
	radix = 8
	type = dvk
	name = ДВК
	version = ДВК-3
	debug = 0
}

//=========================== Процессорная плата МС1201.02 =================//

// МС1201.02 с терминалом КСМ, графикой КГД и тремя накопителями: дискеты MX,
// дискеты двойной плотности MY (плата КМД со своим процессором), винчестер
// DW. Пультовый монитор - ПЗУ 279 (загрузка с MX, MY и DW) или раннее 055
// (только MX), переключатель машины «ПЗУ монитора».
//
// КМ1801ВМ2. Пультовый монитор живёт в «теневом» адресном
// пространстве процессора - в пультовом режиме, при поднятом выводе SEL:
// ПЗУ в 140000-157777, своё ОЗУ в 160000-177777. Остальные адреса при SEL
// не отвечает никто, а память прерванной программы монитор читает и пишет
// командами MFPM/MTPM, на время которых SEL снят.
//
// Регистр начального пуска платы отдаёт процессору 140000 и режим 001 -
// «выход в пульт»: процессор входит в пультовый режим и берёт PC и слово
// состояния из 140000/140002. Векторы пультового режима - тоже от 140000:
// HALT - 140170
cpu : 1801vm2 {
	// Частота МС1201.02 - уточнить по паспорту платы
	clock = _8000000
	// Регистр SEL платы: старший байт - вектор пуска (140000) и база векторов
	// пультового режима, младшие разряды - режим пуска 001 (выход в пульт),
	// их читает монитор безадресным чтением
	sel = 140001
	// Прерывания идут цепочкой: DW, MY, потом терминальный интерфейс
	~virq = dw.virq
	~vector = dw.vector
	// Сетевой таймер 50 Гц на входе EVNT (вектор 100) - линия ПРТ от пульта
	~irq2 = !panel.prt
	~halt = panel.ost
	// Разрешение пуска от пульта
	~dclo = panel.aip
	~aclo = panel.asp
}

// Пульт: включает блок питания и даёт разрешение пуска. Через 0,5 с, когда
// блок питания выходит на режим, снимает АИП (DCLO), ещё через 10 мс - АСП
// (ACLO); процессор стартует, когда сняты обе. Терминал КСМ - отдельный блок
// и за это время успевает приготовиться: без паузы первое приглашение
// монитора пропадало. COMMAND panel.reset() - кнопка «Сброс».
//
// Тумблеры пульта - переключатели машины на панели инструментов: «Пульт»
// (линия ОСТ, процессор в пультовом режиме) и «Прерывания» (линия ПРТ,
// сетевой таймер 50 Гц). halt и prt - их положение при включении
panel : dvk-panel {
	power_good = _500
	aip_delay = _13
	asp_delay = _10
	halt = 0
	prt = 1
	halt_icon = agent.png
	prt_icon = socket.png
}

ram : ram {
	size = _64k
}

// Теневое ОЗУ пультового режима, 160000-177777
sysram : ram {
	size = _8k
}

// Пультовый монитор: ПЗУ 279 или 055 - сменная микросхема, выбирается в
// редакторе конфигурации (копия машины, поле «ПЗУ монитора»)
monitor : rom {
	size = _8k
	label = ПЗУ монитора
	image_1 = 279.rom
	title_1 = 279 (MX, MY, DW)
	image_2 = 055.rom
	title_2 = 055 (MX)
}

// Терминальный интерфейс ИРПС, 177560-177566, векторы 60 и 64. На другом
// конце линии - терминал КСМ
tt : dl11 {
	baud = _9600
	~iako = cpu.iako
	~init = cpu.init
	~rxd = ksm-line.txd
}

// Контроллер НГМД MX, 177130/177132. Прерываний у него нет
mx : dvk-mx {
	drives = mx0|mx1
}

// Приводы: 40 дорожек, две стороны, 11 секторов по 256 байт на сторону
// дорожки - 220 КБ. Образ - сектора подряд, стороны дорожки друг за другом
mx0 : fdd {
	title = MX0
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 0
	image = rt11-mx.dsk
	// Дорожки целиком, как их пишет контроллер, .mfm и .hfe хранят их без потерь
	mode = fm_dvk_mx
	files = "Образы дискет MX (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

mx1 : fdd {
	title = MX1
	sides = _2
	tracks = _40
	sectors = _11
	sector_size = _256
	selector_value = 1
	// Дорожки целиком, как их пишет контроллер, .mfm и .hfe хранят их без потерь
	mode = fm_dvk_mx
	files = "Образы дискет MX (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = mx.select
	~motor_on = mx.motor_on
}

// Графический контроллер КГД, 176640-176646. Своего монитора у него нет:
// картинку подмешивает к тексту дисплей КСМ
kgd : dvk-kgd {
}

// Контроллер MY (КМД 3.057.136), 172140/172142, вектор 170. Это плата со
// своим процессором: К1801ВМ1 на 4 МГц, прошивка 092 (КР1801РЕ2), 4 КБ ОЗУ
// (две КР537РУ8) и контроллер дисковода К1801ВП1-128. Чтение, запись,
// форматирование - всё делает прошивка; с машиной плату связывают её
// регистры и прямой доступ к памяти через окно 40000-77777.
// Циклы прямого доступа не несут SEL процессора: память плата видит так,
// как её видит программа, а не пультовый монитор - через свою карту.
// Разряды адреса 16-21 перемычки S1-S6 на шину не выводят
my : dvk-kmd {
	host_mapper = dma-mapper
	address_bits = _16
	~virq_in = tt.virq
	~vector_in = tt.vector
	~iako = cpu.iako
	~init = cpu.init
}

// Процессор платы. Пуск - по адресу из старшего байта 177716 платы (010000):
// прошивка там гасит прерывания и переходит на 0. INIT машины - IRQ2
// платы (вектор 100), АИП/АСП - общие с машиной
kmd-cpu : 1801vm1 {
	clock = _4000000
	mapper = kmd-mapper
	~irq2 = !my.local_init
	~dclo = panel.aip
	~aclo = panel.asp
}

// Прошивка 255 (КР1801РЕ2) - для платы с ОЗУ на 537РУ8/РУ10, как наша по
// нетлисту: 4 КБ на 020000-027777, стек 30000. Прошивки других вариантов
// платы (bkbtl-doc, «1801re2 ROMs») - 092 (ОЗУ 537РУ11), 093 (К1809РУ1),
// 091 (исходный КМД: К1809РУ1 и контроллер дисковода ВП1-097); у тех ОЗУ
// свой интерфейс МПИ и регистр начального адреса и конфигурации 177760,
// который прошивка пишет при пуске. На этой плате его нет
kmd-rom : rom {
	size = _8k
	image = kmd255.rom
	files = "ПЗУ КМД (*.rom *.bin);;Все файлы (*.*)"
}

kmd-ram : ram {
	clock_source = kmd-cpu
	size = _4k
}

kmd-fdc : bk-fdc {
	clock_source = kmd-cpu
	drives = my0|my1
}

my0 : fdd {
	title = MY0
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 0
	image = rt11-my.dsk
	// Дорожки целиком, как их пишет контроллер (К1801ВП1-128); .mfm и .hfe хранят
	// их без потерь, с метками удаления и нестандартной разметкой
	mode = mfm_ibm
	files = "Образы дискет MY (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = kmd-fdc.select
	~motor_on = kmd-fdc.motor_on
}

my1 : fdd {
	title = MY1
	sides = _2
	tracks = _80
	sectors = _10
	sector_size = _512
	selector_value = 1
	// Дорожки целиком, как их пишет контроллер (К1801ВП1-128); .mfm и .hfe хранят
	// их без потерь, с метками удаления и нестандартной разметкой
	mode = mfm_ibm
	files = "Образы дискет MY (*.dsk *.img *.mfm *.hfe);;Все файлы (*.*)"
	~select = kmd-fdc.select
	~motor_on = kmd-fdc.motor_on
}

// Адреса процессора платы. 177716 - регистр режима (переключатели SA1 в
// разрядах 0-1, адрес пуска в старшем байте). 177760 (регистр ОЗУ 537РУ11 /
// К1809РУ1) на плате с 537РУ8 никто не отвечает: обращение - зависание шины
kmd-mapper : memory-mapper {
	@memory[000000-017777] = kmd-rom {mode = r}
	@memory[020000-027777] = kmd-ram
	@memory[040000-077777] = my[0400000]
	@memory[177100-177103] = my[0100]
	@memory[177130-177133] = kmd-fdc
	@memory[177716-177717] = my[0110]
}

// Контроллер винчестера DW (КЗД 3.057.316), 174000-174020, вектор 300.
// Образ в гнездо не вставлен: файл на 5 МБ возят отдельно от машины. RT-11 на
// винчестере - software/dvk/rt11-dw.dsk, вставить из меню и загрузить B DW
dw : dvk-dw {
	title = DW
	files = "Образы винчестера DW (*.dsk *.img);;Все файлы (*.*)"
	~virq_in = my.virq
	~vector_in = my.vector
	~iako = cpu.iako
	~init = cpu.init
}

// Карта прямого доступа: то же, что у процессора вне пульта
dma-mapper : memory-mapper {
	portstomemory = 1
	@memory[000000-157777] = ram
	@memory[172140-172143] = my
	@memory[176640-176647] = kgd
	@memory[177130-177133] = mx
	@memory[177560-177567] = tt
}

mapper : memory-mapper {
	portstomemory = 1

	// Разряд 0 конфигурации - пультовый режим (вывод SEL)
	~config[0] = cpu.halt_mode

	@memory[0:1][000000-157777] = ram
	@memory[0:1][172140-172143] = my
	@memory[0:1][174000-174037] = dw
	@memory[0:1][176640-176647] = kgd
	@memory[0:1][177130-177133] = mx
	@memory[0:1][177560-177567] = tt

	@memory[1:1][140000-157777] = monitor {mode = r}
	@memory[1:1][160000-177777] = sysram
}

//=========================== Терминал КСМ =================================//

// Контроллер символьного монитора - отдельная машина на КР580ВМ80А со своим
// ПЗУ (ksm_04/05), знакогенератором (ksm_03) и 16 КБ видеопамяти. С ДВК
// его связывает только линия ИРПС; клавиатура МС7004 подключена к нему же.
ksm-cpu : i8080 {
	clock = _1540000
	mapper = ksm-mapper
	// Прерывания даёт ВН59 в режиме 8080: CALL на 0BC0 + 4 * уровень
	int_opcode = $CD
	~int = ksm-pic.int
	~int_address = ksm-pic.call
}

ksm-rom : rom {
	size = _4k
	image = ksm.rom
}

ksm-ram : ram {
	clock_source = ksm-cpu
	size = _256
}

ksm-vram : ram {
	clock_source = ksm-cpu
	size = _16k
}

ksm-cg : rom {
	size = _2k
	image = ksm_cg.rom
}

ksm-pic : i8259 {
	clock_source = ksm-cpu
	~inta = ksm-cpu.inta
	~ir[1] = ksm-kbd.rxrdy
	~ir[3] = ksm-line.rxrdy
}

// D42 - линия к ДВК, 9600 бод: 1,54 МГц / 10 = 154 кГц, x16 в режиме 8251
ksm-line : i8251 {
	clock_source = ksm-cpu
	clock = 1/_10
	~rxd = tt.txd
}

// D41 - линия от клавиатуры, 4800 бод (1,54 МГц / 20, x16)
ksm-kbd : i8251 {
	clock_source = ksm-cpu
	clock = 1/_20
	~rxd = keyboard.data
}

// D30. Порт A - первая строка кольца видеопамяти на экране, B - переключатели
// SA1 (1 стоп-бит, без чётности, КОИ-7 Н0/Н1), младшая половина C -
// переключатели SA2 (9600 бод, без XON/XOFF)
ksm-ppi : i8255 {
	clock_source = ksm-cpu
	~B = 1
	~CL = 0
}

display : ksm-display {
	clock_source = ksm-cpu
	vram = ksm-vram
	font = ksm-cg
	kgd = kgd
	~line = ksm-ppi.A
}

keyboard : ms7004 {
	clock_source = ksm-cpu
	map = ms7004.map
	keys = ms7004.keys
	picture = ms7004_keyboard.svg
	// Настройки > Клавиатура: цифровой блок на стрелках или на буквах
	remap_arrows = arrows_ms7004.remap
	remap_letters = letters_ms7004.remap
	use_remap = 0
	// Символ на 4800 бод - 2,3 мс, 3500 тактов процессора КСМ
	interval = _3500
	// Команды КСМ клавиатуре (индикаторы, перезапуск) - D41, обратный канал
	~rxd = ksm-kbd.txd
}

ksm-mapper : memory-mapper {
	@memory[$0000-$0FFF] = ksm-rom {mode = r}
	@memory[$2000-$20FF] = ksm-ram
	@memory[$C000-$FFFF] = ksm-vram

	@port[$5E-$5F] = ksm-pic
	@port[$6E-$6F] = ksm-kbd
	@port[$76-$77] = ksm-line
	@port[$78-$7B] = ksm-ppi
}
