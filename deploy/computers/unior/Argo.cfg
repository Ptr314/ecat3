system {
	type = unior
	name = Юниор ФВ-6506
	version = Арго ФВ-6511
	charmap = argo
	order = 251
}

// Частоты сняты с живой машины (замеры на zx-pk): символьный клок ВГ75
// 1.69 МГц, процессорный вдвое больше. Точное значение дает лента: счет $02C0
// в канале 0 ВИ53 при 1689600 Гц на входе дает ровно 2400 бод, а 2400*704
// и есть 1689600. Оба клока делает один автомат на К155РЕ3 (D11/D12) из OSC,
// так что их отношение жестко задано схемой
cpu : z80 {
	clock = _3379200
	~int = int-frame.out
}

// Кадровое прерывание. На схеме оно собрано на К555ТМ8 (D3/7): на входы D0-D3
// этого счетверённого триггера идут разряды данных 4-7, тактируется он записью
// в регистр конфигурации памяти, а выход Q3 через ЛА3 уходит на вывод 16
// процессора (/INT). То есть старший полубайт того же байта - регистр
// управления, и разряд 7 разрешает прерывание.
//
// Своя программа Арго им не пользуется вовсе: в ПЗУ нет ни одной команды
// прерываний - ни IM, ни EI, ни RETI, монитор всё опрашивает. Ставит этот
// разряд только ZX.COM, последним действием перед переходом в ПЗУ Спектрума
// ($C1, $CB и $D8 - во всех трёх разряд 7), и нужен он там для KEY-SCAN:
// клавиатуру Спектрум читает из обработчика кадрового прерывания.
//
// Источник импульса на схеме не прочитать, но пятидесятигерцевое в этой машине
// одно - кадр ВГ75, и берется он с ее вывода VRTC. Генератор здесь работает
// одновибратором: импульс на фронте обратной ходки.
//
// Ширина подобрана и обе границы у нее настоящие. Снизу: сразу за фронтом кадра
// ВГ75 принимается за нулевую строку, а промежуток между пачками ПДП у нее
// нулевой, так что 80 пересылок идут одним куском - 320 тактов, на которые
// процессор снят с шины. Импульс короче этого тонет в них целиком: при 32 тактах
// принимается каждое пятое прерывание. Сверху: INT у Z80 уровневый, и импульс,
// доживший до конца обработчика, тот наберет повторно - при 800 тактах счет идет
// уже 56 в секунду вместо 52. При 400 счетчик кадров растет ровно на столько,
// сколько кадров выдает ВГ75
int-frame : generator {
	polarity = negative
	length = _400
	~trigger = vg75.vrtc
	~enable = memcfg.value[7-7]
}

// Вся память машины одним куском: первые 128 Кбайт - две банки основной, в
// которые процессор ходит страницами по 16 Кбайт, дальше семь блоков по 64
// Кбайт дополнительной, куда ходит только ПДП. ПЗУ монитора накрывает
// $F800-$FFFF первой банки по чтению, экранный буфер лежит под ним по $F7B0 и
// читается ПДП напрямую, а знакогенератор - $F800 второй банки
ram : ram {
	size = 576k
}

bios : rom {
	size = 2k
	image = argo.rom
}

// Прошивка диспетчера памяти (D42, MEMCFG на К155РЕ3): строка на страницу и
// конфигурацию, в ответе - номер страницы и банки
memcfg-rom : rom {
	size = 32
	image = argo_memcfg.rom
}

// Четыре ячейки регистрового файла К555ИР26 (D6). Ячейку для записи выбирают
// разряды A3 и A4 адреса порта, а действует та, чей черед на шине: у
// процессора своя ($B1 и $B9 - какая именно, решает линия /DRQ0, поэтому
// программы пишут в обе), у канала 0 ПДП своя ($A1), у остальных каналов своя
// ($A9).
//
// В регистровый файл идет только МЛАДШИЙ полубайт: разряд 0 - защита первых
// 16 Кбайт от записи (включает ее НОЛЬ, см. argo_memory.cpp), разряды 1-3 -
// номер конфигурации, то есть строка прошивки
// D42 ($63 вместо $61 подставляет знакогенератор). СТАРШИЙ полубайт уходит в
// счетверенный триггер (D13, ТМ8) и один на все четыре порта: разряд 4 -
// теневая область второй банки (и бордюр), 5 - ПЗУ по $F800-$FFFF, 6 -
// зеркало ПЗУ с нуля при включении, 7 - разрешение кадрового прерывания.
//
// Поэтому одним портом здесь обойтись можно, а разбирать его надо по разрядам:
// монитор и TCP/M пишут в $B1 и $B9 одно и то же значение, а ZX.COM - разные
// ($CB и $D8), и общий старший полубайт задает последняя запись
memcfg : port {
	size = 8
	default = $61
	// Тёплый сброс конфигурацию не трогает: на живой машине сброс в режиме ZX
	// возвращает не в монитор, а на начальный экран Спектрума - процессор
	// уходит на $0000, где в этом режиме лежит копия ПЗУ Спектрума в ОЗУ
	soft_reset = 0
}

// Ячейка, которую регистровый файл отдает процессору, пока канал 0 держит
// запрос ПДП. Ее никто здесь не читает: у нас процессор снимается с шины на
// время пересылки целиком, промежутка "запрос есть, шину еще не отдали" нет.
// Заведена она потому, что значение в ней бывает другим: ZX.COM пишет в $B1
// свое $CB, а в $B9 - $D8, и путать их нельзя. Монитор и TCP/M пишут в обе
// одно и то же, а в одном месте ($5ED3) монитор пишет $61 вообще в одну $B9 -
// по этому и видно, какая из двух живая
memcfg-drq : port {
	size = 8
	default = $61
	soft_reset = 0
}
// Конфигурация блоков для двух каналов ПДП - часть того же регистрового
// файла, и живет она столько же: без нее теплый сброс уводит ПДП экрана в
// нулевой блок, и картинка пропадает совсем
memblk0 : port {
	size = 8
	soft_reset = 0
}
memblk1 : port {
	size = 8
	soft_reset = 0
}

// Системный регистр: разряды 0-3 - цвет бордюра, разряд 4 - звук. Монитор
// дрыгает им программно (F8EE), никакого таймера в звуке Арго нет
sysctl : port {
	size = 8
}

// Пульт магнитофона: разряд 1 - запись, 2 - пуск, 3 - назад, 4 - вперед,
// 5 - стоп. Снято с обработчика NMI в KBD.SNC
tapectl : port {
	size = 8
}

// ПЗУ палитры Арго не сохранилось. Здесь стоит юниоровское: машины одного
// семейства, атрибут поля ВГ75 у обеих адресует пару "цвет символа/цвет фона",
// и без таблицы цветов атрибут пришлось бы читать как набор признаков, отчего
// заставка монитора уходит в инверсию на весь экран. Цвета Арго не проверены
palette : rom {
	size = 64
	image = argo_palette.rom
}

// Теплый сброс ВТ57 и ВГ75 не трогает: кнопка СБРОС на Арго дергает только
// процессор. Иначе после сброса в режиме ZX экрана не было бы вовсе - ВГ75 и
// каналы ПДП под Спектрум настраивает ZX.COM, и после сброса этого не делает
// никто: процессор уходит на $0000, а там копия ПЗУ Спектрума, которая про
// ВГ75 не знает
dma : i8257 {
	soft_reset = 0
}

vg75 : i8275 {
	soft_reset = 0
	memory = ram
	clock = 1/2
	~stop_drq = dma.tc
}

display : i8275-display {
	ram = ram
	i8275 = vg75
	dma = dma
	channel = 2
	// Курсор показывается на знакоместо левее, чем говорит команда загрузки.
	// ПЗУ Арго прибавляет единицу и к колонке, и к строке ($F928): у строки
	// это компенсация строки состояния - знакоместа она считает с $F800, а ПДП
	// читает экран с $F7B0, то есть на строку раньше, - а у колонки
	// компенсировать нечего. ПЗУ Юниора, той же микросхемой и того же автора,
	// к колонке ничего не прибавляет, и курсор у него встает верно
	cursor_left = 1
	// Знакогенератор лежит в самом ОЗУ: вторая банка, страница 3, $F800
	font = ram
	font_base = $1F800
	// Разводка адреса знакогенератора: номер строки развертки в старших
	// разрядах, разряды 6 и 5 кода знака - в разрядах 7 и 6 адреса, разряд 5
	// адреса не подключен. Отсюда и знакогенератор на 128 знаков в двух
	// килобайтах, и дырки по 32 байта у загрузчика с ленты
	font_address = cba65-43210
	// В ОЗУ знакогенератора точки лежат прямо: единица - светящаяся точка
	font_invert = 0
	palette = palette
	// Разряды полубайта цвета: 0 - красный, 3 - зелёный, 1 - синий, 2 - яркость
	// (её экран пока не показывает). Снято с видео живой машины: у монитора
	// белое на синем, и такое даёт только дамп D77_INV_I, прочитанный как есть,
	// младшим полубайтом в чернила. См. раздел о цвете в Argo.md
	rgb = 031
	// Режим ZX Spectrum: разряд 4 регистра конфигурации. Тот же разряд
	// включает теневую область второй банки, а ее и читает экран: страница 1
	// у конфигурации $8 уходит во вторую банку ($18000), и экран Спектрума
	// лежит там по своим собственным адресам - битовая карта с $4000,
	// атрибуты с $5800, то есть $18000 и $19800. Поток знакомест для ВГ75
	// остается в первой банке, ПДП его оттуда и читает.
	// См. draw_row_zx() в i8275display.cpp
	~zx = memcfg.value[4-4]
	// Цвет бордюра. Рисовать его пока нечем - его не рисует ни одна машина
	// проекта, - но линия заведена: во время загрузки с ленты ПЗУ Спектрума
	// гоняет по бордюру полосы, и это единственный признак, что лента идет.
	// Что разряды 0-2 порта $FE в режиме ZX до бордюра доходят, видно по
	// описанию живой машины: там при загрузке «бордюр мигает с голубого на
	// красный», а это в точности полосы пилот-тона
	~border = zx-port.value[0-2]
	zx_bitmap = $18000
	zx_attr = $19800
}

timer : i8253 {
	clock = 1/1
	clock0 = 1/2
}

// Лента идет через ВВ51 в синхронном режиме: синхросимвол $E6, преамбула
// AA AA, скорость задает канал 0 таймера - тот же протокол и тот же формат
// записи .bt, что у Юниора
uart : i8251 {
	~txc = timer.output[0]
}

// Магнитофон с дистанционным управлением по порту $81. Разряды те же, что у
// Юниора, только сдвинуты на два: 1 - запись, 2 - пуск, 3 - назад,
// 4 - вперед, 5 - стоп (снято с обработчика NMI в KBD.SNC и с монитора)
tape : taperecorder {
	encoding = unior
	baudrate = _2400
	files = "Ленты Арго (*.bt);;Ленты ZX Spectrum (*.tap *.tzx)"
	~control[3-7] = tapectl.value[1-5]
	~data_out = uart.rxd
	~data_in = uart.txd
	~ready = uart.dsr
	// В режиме ZX лентопротяжку ведут стрелки клавиатуры, а не процессор: их
	// разбирает то же железо, что собирает матрицу Спектрума. Источника у
	// линии два, и они не спорят - в режиме ZX процессор порт $81 не трогает,
	// а вне его клавиатура ZX молчит
	~control = zx-kbd.control
	// SAVE в режиме ZX: ПЗУ Спектрума пишет на ленту разрядом 3 порта $FE,
	// теми же длительностями, какими потом читает. Вне режима ZX этот порт
	// никто не трогает, так что линия молчит и своей ленте не мешает
	~input = zx-port.value[3]
}

// Клавиатура: 11 столбцов на 8 строк, номер столбца процессор выставляет на
// старших разрядах адреса командой IN A,(C) при C = $A1
kbd-port : argo-keyboard {
	~port = cpu.io_address
}

// Клавиатура ZX Spectrum поверх клавиатуры машины: ПЗУ Спектрума читает
// матрицу портом $FE, а клавиши на Арго свои. Что подает ему эту матрицу на
// живой машине, со схемы не выяснить; здесь клавиша отвечает за ту клавишу
// Спектрума, которая на ней написана
zx-kbd : zx-keyboard {
	keyboard = keyboard
	~port = cpu.io_address
	// Лента Спектрума приходит уровнем в разряд 6 этого же чтения: у него и
	// клавиатура, и магнитофон в одном порту, и загрузчик ПЗУ пользуется
	// обоими сразу - полуряд $7F он читает ради разряда 6, а по разряду 0
	// того же ответа бросает загрузку, если нажат пробел.
	//
	// Магнитофон тут один и тот же: со своей лентой (.bt) он молчит на этой
	// линии и отдает байты в ВВ51, с лентой Спектрума - наоборот
	~ear = tape.output
}

keyboard : scan-keyboard {
	decoder = 1
	~scan[0-3] = kbd-port.scan[0-3]
	~output = kbd-port.rows
	map = argo.kbd
	use_remap = 0
	// Экранная клавиатура: таблица клавиш машины и рисунок к ней
	keys = argo.keys
	picture = argo_keyboard.svg
}

// Диспетчер памяти и пересылки ПДП. Процессор и каждый канал ходят в память
// через свою ячейку регистрового файла, и пересылка - это перелив данных
// между двумя по-разному отображенными пространствами: МОНИТОР дает одному
// каналу чистое $61 (основная память), другому $61 с номером блока
// ($FA18 против $FA36), включает каналы 0 и 1 и ждет, пока ПДП отдаст шину.
//
// Процессор ходит в память страницами по прошивке, канал ПДП - блоками по
// 64 Кбайт; почему так, написано в argo_memory.h
mem : argo-memory {
	memory = ram
	map = memcfg-rom
	dma = dma
	cfg_bits = 1,2,3
	page_bits = 0,1
	bank_bit = 7
	bank_invert = 1
	block_mask = $0E
	blocks = 8
	ext_base = $20000
	~cpu = memcfg.value
	~dma0 = memblk0.value
	~dma1 = memblk1.value
}

// Порт $FE Спектрума по записи. Разряд 4 - динамик, и это единственное, что
// отсюда взято: в режиме ZX ПЗУ Спектрума пищит только им. Разряды 0-2 у
// Спектрума - цвет бордюра, но у Арго бордюр свой, со своим цветом в порту
// $80 и показом от разряда 4 конфигурации, так что сюда они не идут; разряд 3
// (выход на магнитофон) тоже, лента Арго работает через ВВ51, а не уровнем.
// Декодирования записи в $FE на схеме не видно, но и обратного не видно, а
// динамик тут один на всю машину
zx-port : port {
	size = 8
}

// Динамик один, а линий к нему две, и они не пересекаются: монитор дрыгает
// разрядом 4 порта $80 (F8EE) и только в обычном режиме, ПЗУ Спектрума -
// разрядом 4 порта $FE и только в режиме ZX. Уровень ведет тот, кто написал
// последним, поэтому обе ветки идут на одну линию, без сумматора: через
// ~mixer громкость своего звука Арго упала бы вдвое - он делит на число
// источников
sound : speaker {
	~input = sysctl.value[4]
	~input = zx-port.value[4]
}

mapper : memory-mapper {
	portstomemory = 0

	// Зеркало ПЗУ с нуля (cancelinit ниже) взводится при включении, а не
	// кнопкой сброса: на живой машине сброс в режиме ZX уходит на начальный
	// экран Спектрума, то есть процессор читает с нуля ОЗУ, а не ПЗУ. В CP/M
	// это же дает перезагрузку системы - по нулю лежит переход на теплый старт
	soft_reset = 0

	// Разряд 5 конфигурации включает ПЗУ по $F800-$FFFF. В режиме ZX он сброшен
	// (ZX.COM пишет $D8), и там должно быть ОЗУ: без этого тест памяти ПЗУ
	// Спектрума упирается в $F7FF, и игра, делающая CLEAR под самый верх,
	// отвечает «M RAMTOP no good»
	~config = memcfg.value[5-5]

	// Процессор начинает с нуля, а ПЗУ лежит наверху: его копия видна с нуля
	// до первого обращения в верхнюю половину адресов, а первая же команда
	// ПЗУ - переход на $FBD4 - эту копию и снимает
	cancelinit = $8000
	@memory[*][$0000-$07FF] = bios {mode = r}

	// Читать из $F800-$FFFF процессор продолжает ПЗУ при любой конфигурации:
	// иначе он не смог бы выполнять оттуда код, пока заполняет знакогенератор,
	// а монитор именно это и делает - переносит свои 30 знаков командой LDI,
	// беря их из ПЗУ по $FF0A. Запись уходит в ОЗУ - туда, куда ее направил
	// диспетчер
	@memory[1:1][$F800-$FFFF] = bios {mode = r}
	@memory[$0000-$FFFF] = mem

	@port[$80] = sysctl
	@port[$81] = tapectl {mode = w}
	@port[$A0] = timer[0]
	@port[$A2] = timer[1]
	@port[$A4] = timer[2]
	@port[$A6] = timer[3]
	@port[$A1] = kbd-port {mode = r}
	@port[$A1] = memblk0 {mode = w}
	@port[$A9] = memblk1 {mode = w}
	@port[$B1] = memcfg-drq {mode = w}
	@port[$B9] = memcfg {mode = w}
	@port[$C0] = vg75[0]
	@port[$C4] = vg75[1]
	@port[$C1] = uart[0]
	@port[$C3] = uart[1]
	@port[$E0-$E8] = dma
	@port[$FE] = zx-kbd {mode = r}
	@port[$FE] = zx-port {mode = w}
}
