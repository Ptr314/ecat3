system {
	type = unior
	name = Юниор
	version = Юниор ФВ-6506
	charmap = radio-86rk
	order = 250
}

// Частота процессора 2.222222 МГц (сверено с конфигурацией машины в b2m),
// символьный клок ВГ75 - 7/10 от нее.
// При параметрах ВГ75 текстового режима ($4F,$D8,$99,$DC) это дает
// 106*29*10 = 30740 символьных тактов на кадр, то есть 50.1 Гц
cpu : i8080 {
	clock = _2222222
}

// Вся память - ОЗУ. ПЗУ монитора только накрывает $F800-$FFFF по чтению:
// экранный буфер монитора лежит по $F7B0 и заходит под него, а ПДП читает
// ОЗУ напрямую, минуя диспетчер
ram : ram {
	size = 64k
}

bios : rom {
	size = 2k
	image = unior.rom
}

// Два знакогенератора по 128 символов в одной микросхеме: старший адрес
// берется с PC3 системного ВВ55 (см. ~high у display)
font : rom {
	size = 2k
	image = unior_font.rom
}

// ПЗУ палитры (К555РТ4): пара "цвет символа/цвет фона" на каждое сочетание
// атрибутных бит ВГ75
palette : rom {
	size = 64
	image = unior_palette.rom
}

// Системный параллельный интерфейс: клавиатура (A - столбцы через
// дешифратор, B - строки), порт C - выбор блока расширения (0-2),
// знакогенератор (3), звук (4), страница палитры (6)
port-kbd : i8255 {}

// Дополнительный параллельный интерфейс, выведен на разъем расширения
port-ext : i8255 {}

dma : i8257 {}

// Конечный счет ВТ57 заведен на контроллер экрана: дойдя до конца экранного
// буфера, он замолкает до конца кадра, и следующий кадр снова выбирается с
// начала буфера. Без этой связи любая потерянная строка (а канал экрана
// отключают на время пересылок в дополнительную память) сдвигала бы картинку
// навсегда
vg75 : i8275 {
	memory = ram
	clock = 7/10
	~stop_drq = dma.tc
}

display : i8275-display {
	ram  = ram
	i8275 = vg75
	dma = dma
	channel = 2
	font = font
	palette = palette
	// В ответе ПЗУ палитры 1 - красный, 2 - зелёный, 4 - синий
	rgb = 012
	// Графический режим: тот же разряд порта C переключает знакогенератор на
	// второй банк, где знакоместо в 6 точек показывает три псевдоточки -
	// отсюда 240x128 при 80x64 знакоместах. Точка там вдвое шире
	font_high_wide = 1
	~high = port-kbd.CL[3]
	~palette_page = port-kbd.CH[2]
}

// Каналы таймера тактируются по-разному (как в b2m): 0 - звуковой генератор
// кадровой синхронизации, 1 - скорость ленты (2400 бод при счете $039E),
// 2 - звук, и его разрешает разряд 4 порта C
timer : i8253 {
	// Канал 1 тактируется процессором: ПЗУ ставит в него 926 и получает 2400
	// бод для ленты, то есть ровно частоту процессора на входе
	clock = 1/1
	clock0 = 3/4
	clock1 = 1/1

	// Звуковой канал считает строчные импульсы ВГ75 (14.7 кГц при текстовом
	// растре). С тактами процессора игры звучали бы ультразвуком: делители,
	// которыми они гоняют тон, лежат в пределах 6..200, а это 245 Гц ... 2.4 кГц
	// только от строчной частоты
	~clk[2] = vg75.hrtc

	~gate[2] = port-kbd.CH[0]
}

// Обмен с лентой идет через ВВ51 в синхронном режиме: синхросимвол $E6,
// скорость задает канал 1 таймера
uart : i8251 {
	~txc = timer.output[1]
}

// Магнитофон с дистанционным управлением: лентопротяжкой командует порт B
// дополнительного ВВ55, данные ходят байтами через ВВ51
tape : taperecorder {
	encoding = unior
	baudrate = _2400
	files = "Ленты Юниора (*.bt)"
	// Системная кассета заряжена с самого начала: без нее машина умеет только
	// команды монитора, а вставить ленту больше неоткуда - дисковода нет
	image = 265333.bt
	~control = port-ext.B
	~data_out = uart.rxd
	~data_in = uart.txd
	~ready = uart.dsr
}

// Дополнительная память: до семи блоков по 64 Кбайт. Процессор их не видит
// совсем, данные ходят только пересылками ПДП каналами 0/1, номер блока
// выставляется разрядами 0-2 порта C, направление - триггером по порту $50
extram : ram {
	size = 448k
}

ext-memory : unior-memory {
	memory = ram
	extension = extram
	dma = dma
	blocks = 7
	~block[0-2] = port-kbd.CL[0-2]
}

keyboard : scan-keyboard {
	// Младшие четыре бита порта A - номер столбца, дешифратор К555ИД3
	// выбирает одну из одиннадцати линий
	decoder = 1
	~scan[0-3] = port-kbd.A[0-3]
	~output = port-kbd.B
	map = unior.kbd
	use_remap = 0
	// Экранная клавиатура: таблица клавиш машины и рисунок к ней
	keys = unior.keys
	picture = unior_keyboard.svg
}

sound : speaker {
	~input = timer.output[2]
}

mapper : memory-mapper {
	portstomemory = 0

	// После сброса процессор начинает с нуля, а ПЗУ у машины лежит наверху:
	// его копия видна с нуля до первого обращения в верхнюю половину адресов,
	// а первая же команда ПЗУ - переход на $FC62 - эту копию и снимает
	cancelinit = $8000
	@memory[*][$0000-$07FF] = bios {mode = r}

	@memory[$F800-$FFFF] = bios {mode = r}
	@memory[$0000-$FFFF] = ram

	@port[$30-$3B] = dma
	@port[$3C-$3F] = port-ext
	@port[$4C-$4F] = port-kbd
	@port[$50] = ext-memory
	@port[$60-$61] = vg75
	@port[$DC-$DF] = timer
	@port[$EC-$ED] = uart
}
