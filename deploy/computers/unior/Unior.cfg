system {
	type = unior
	name = Юниор ФВ-6506
	version = Юниор ФВ-6506
	charmap = radio-86rk
	order = 250
}

// Частота процессора 2.2 МГц, символьный клок ВГ75 - 7/10 от нее.
// При параметрах ВГ75 текстового режима ($4F,$D8,$99,$DC) это дает
// 106*29*10 = 30740 символьных тактов на кадр, то есть 50.1 Гц
cpu : i8080 {
	clock = 2200000
}

// Вся память - ОЗУ. ПЗУ монитора только накрывает $F800-$FFFF по чтению:
// экранный буфер монитора лежит по $F7B0 и заходит под него, а ПДП читает
// ОЗУ напрямую, минуя диспетчер
ram : ram {
	size = 64k
}

bios : rom {
	size = 2k
	image = unior.rom
}

// Два знакогенератора по 128 символов в одной микросхеме: старший адрес
// берется с PC3 системного ВВ55 (см. ~high у display)
font : rom {
	size = 2k
	image = unior_font.rom
}

// ПЗУ палитры (К555РТ4): пара "цвет символа/цвет фона" на каждое сочетание
// атрибутных бит ВГ75
palette : rom {
	size = 64
	image = palette.rom
}

// Системный параллельный интерфейс: клавиатура (A - столбцы через
// дешифратор, B - строки), порт C - выбор блока расширения (0-2),
// знакогенератор (3), звук (4), страница палитры (6)
port-kbd : i8255 {}

// Дополнительный параллельный интерфейс, выведен на разъем расширения
port-ext : i8255 {}

dma : i8257 {}

vg75 : i8275 {
	memory = ram
	clock = 7/10
}

display : i8275-display {
	ram  = ram
	i8275 = vg75
	dma = dma
	channel = 2
	font = font
	palette = palette
	// В ответе ПЗУ палитры 1 - красный, 2 - зелёный, 4 - синий
	rgb = 012
	~high = port-kbd.CL[3]
	~palette_page = port-kbd.CH[2]
}

timer : i8253 {
	clock = 1/1
	~gate[2] = port-kbd.CH[0]
}

uart : i8251 {}

// Дополнительная память: до семи блоков по 64 Кбайт. Процессор их не видит
// совсем, данные ходят только пересылками ПДП каналами 0/1, номер блока
// выставляется разрядами 0-2 порта C, направление - триггером по порту $50
extram : ram {
	size = 448k
}

ext-memory : unior-memory {
	memory = ram
	extension = extram
	dma = dma
	blocks = 7
	~block[0-2] = port-kbd.CL[0-2]
}

keyboard : scan-keyboard {
	// Младшие четыре бита порта A - номер столбца, дешифратор К555ИД3
	// выбирает одну из одиннадцати линий
	decoder = 1
	~scan[0-3] = port-kbd.A[0-3]
	~output = port-kbd.B
	map = unior.kbd
	use_remap = 0
}

sound : speaker {
	~input = timer.output[2]
}

mapper : memory-mapper {
	portstomemory = 0

	@memory[$F800-$FFFF] = bios {mode = r}
	@memory[$0000-$FFFF] = ram

	@port[$30-$3B] = dma
	@port[$3C-$3F] = port-ext
	@port[$4C-$4F] = port-kbd
	@port[$50] = ext-memory
	@port[$60-$61] = vg75
	@port[$DC-$DF] = timer
	@port[$EC-$ED] = uart
}
