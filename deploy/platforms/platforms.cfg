// Запуск программы по имени платформы: параметр --platform командной строки,
// ?platform= адреса веб-страницы, глагол сценария PLATFORM (docs/SCRIPTING.md).
// Так программы запускает каталог ПО (retro-catalog): он передает файл и
// значение поля «Платформа».
//
// Блок - одна платформа. names - ее имена через |, сравниваются без учета
// регистра и лишних пробелов; имя самого блока тоже подходит. Остальные строки -
// тип файла (расширение) и сценарий запуска из этого каталога. Машину выбирает
// строка MACHINE сценария; ${file} в нем - программа, уже вынутая из архива.
//
// Архив .zip открывается сам: берется файл, чье имя без расширения совпадает с
// именем архива без числа и тире в начале (1373-terra1.zip -> terra1.bin), иначе
// единственный файл типа, который платформа запускает.
//
// БК: .bin - программа с адресом загрузки, .bkd и .img - образ дискеты (машина
// с СМК-512, ее BIOS грузится с дискеты сам).

bk0010 : platform {
    names = БК0010 | БК0010 (11М) | БК0010-01 | bk10 | bk0010 | bk0010-01
    bin   = bk0010-bin.ecat
    bkd   = bk0010-disk.ecat
    img   = bk0010-disk.ecat
}

bk0011m : platform {
    names = БК0011М | БК0011 | bk11 | bk11m | bk0011m
    bin   = bk0011m-bin.ecat
    bkd   = bk0011m-disk.ecat
    img   = bk0011m-disk.ecat
}
